<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Curtain slider preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,760px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.cl{position:relative;height:420px;border-radius:28px;overflow:hidden;background:#0b0b10;border:1px solid var(--sc-line)}
.cl-base,.cl-cols{position:absolute;inset:0}
.cl-img{position:absolute;inset:0;background-size:cover;background-position:center;transform-origin:50% 50%}
.cl-col{position:absolute;top:0;bottom:0;background-repeat:no-repeat;will-change:clip-path}
.cl-ov{position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.55));pointer-events:none}
.cl-txt{position:absolute;left:34px;bottom:38px;color:#fff;pointer-events:none}
.cl-ch{display:block;margin-bottom:10px;font:700 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase;opacity:.85}
.cl-ttl{position:relative;display:block;height:64px;overflow:hidden}
.cl-ttl span{position:absolute;left:0;top:0;white-space:nowrap;font:900 52px/64px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.04em;transition:transform .6s cubic-bezier(.3,.9,.3,1),opacity .4s}
.cl-ui{position:absolute;right:24px;bottom:30px;display:flex;align-items:center;gap:10px}
.cl-btn{width:42px;height:42px;border:1px solid rgba(255,255,255,.5);border-radius:50%;background:rgba(0,0,0,.3);color:#fff;cursor:pointer;font-size:18px}
.cl-btn:hover{background:rgba(255,255,255,.25)}
.cl-dots{display:flex;gap:6px}
.cl-dot{width:8px;height:8px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.4);cursor:pointer}
.cl-dot[aria-current=true]{background:#fff;transform:scale(1.4)}
@media (prefers-reduced-motion:reduce){.cl-ttl span{transition:none}}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="cl" role="group" aria-roledescription="carousel" aria-label="Featured landscapes"><div class="cl-base"><div class="cl-img"></div></div><div class="cl-cols" aria-hidden="true"></div><div class="cl-ov"></div><div class="cl-txt"><span class="cl-ch"></span><span class="cl-ttl" aria-live="polite"></span></div><div class="cl-ui"><div class="cl-dots"></div><button class="cl-btn" type="button" data-d="-1" aria-label="Previous slide">&#8592;</button><button class="cl-btn" type="button" data-d="1" aria-label="Next slide">&#8594;</button></div></div>
</div>
<script>
(function(){var root=document.currentScript.previousElementSibling.querySelector('.cl'),img=root.querySelector('.cl-img'),cols=root.querySelector('.cl-cols'),ch=root.querySelector('.cl-ch'),ttl=root.querySelector('.cl-ttl'),dots=root.querySelector('.cl-dots');
var SCENES=[
{s:['#2b1055','#d6457f','#ffb36b'],u:[.68,.6,.11,'#fff1c0'],h:['#8a2f78','#56206a','#2f1450','#170b2c'],st:0},
{s:['#0b1b3a','#2b6cb0','#a6dcff'],u:[.28,.3,.06,'#ffffff'],h:['#7fb0d4','#4a7ba3','#274b6b','#12273d'],st:0},
{s:['#ffd9a0','#ff9a5a','#d24a43'],u:[.5,.56,.14,'#fff6d8'],h:['#bd4b33','#8c3029','#5c1d29','#300f21'],st:0},
{s:['#06122a','#12305a','#40306f'],u:[.78,.22,.05,'#f5f1ff'],h:['#21405f','#14304a','#0c1f36','#050e1c'],st:1},
{s:['#c4f6dc','#82e2b8','#2fa583'],u:[.3,.28,.09,'#ffffff'],h:['#41b98d','#2b9370','#17664d','#0b402f'],st:0},
{s:['#1a0b2e','#6a1b9a','#ff4fa8'],u:[.5,.5,.12,'#ffe0f3'],h:['#44186e','#2a1250','#170a34','#0a061a'],st:1},
{s:['#0c2429','#1a5a56','#7adcc8'],u:[.72,.34,.07,'#eafff9'],h:['#318e84','#1d625c','#103c40','#06202a'],st:1},
{s:['#fbe6ff','#d8abff','#8d7cff'],u:[.24,.4,.1,'#fffbe8'],h:['#a284ff','#6f58db','#4535a6','#271c63'],st:0}];
var ARTCACHE={};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function art(i,w,h){var key=i+'/'+w+'/'+h;if(ARTCACHE[key])return ARTCACHE[key];var sc=SCENES[((i%8)+8)%8],c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d'),rnd=mulberry(i*7919+13);
 var g=x.createLinearGradient(0,0,0,h*.8);g.addColorStop(0,sc.s[0]);g.addColorStop(.55,sc.s[1]);g.addColorStop(1,sc.s[2]);x.fillStyle=g;x.fillRect(0,0,w,h);
 if(sc.st){for(var k=0;k<90;k++){x.fillStyle='rgba(255,255,255,'+(.25+rnd()*.6)+')';var r=rnd()*1.4+.3;x.beginPath();x.arc(rnd()*w,rnd()*h*.55,r,0,6.283);x.fill()}}
 var ux=sc.u[0]*w,uy=sc.u[1]*h,ur=sc.u[2]*Math.min(w,h),gl=x.createRadialGradient(ux,uy,ur*.2,ux,uy,ur*4.2);gl.addColorStop(0,sc.u[3]+'cc');gl.addColorStop(1,sc.u[3]+'00');x.fillStyle=gl;x.fillRect(0,0,w,h);x.fillStyle=sc.u[3];x.beginPath();x.arc(ux,uy,ur,0,6.283);x.fill();
 for(var L=0;L<4;L++){var y0=h*(.5+L*.11),amp=h*(.07-L*.008),p1=rnd()*6,p2=rnd()*6,p3=rnd()*6,f1=2.2+rnd()*1.4,f2=5+rnd()*3,f3=11+rnd()*5;x.beginPath();x.moveTo(0,h);for(var px=0;px<=w+3;px+=3){var t=px/w;x.lineTo(px,y0+Math.sin(t*f1+p1)*amp+Math.sin(t*f2+p2)*amp*.45+Math.sin(t*f3+p3)*amp*.18)}x.lineTo(w,h);x.closePath();
  var hg=x.createLinearGradient(0,y0-amp,0,h);hg.addColorStop(0,sc.h[L]);hg.addColorStop(1,L<3?sc.h[L+1]:'#000');x.fillStyle=hg;x.fill();
  if(L<3){var fg=x.createLinearGradient(0,y0-amp,0,y0+h*.12);fg.addColorStop(0,'rgba(255,255,255,.13)');fg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=fg;x.fill()}}
 for(var n=0;n<Math.round(w*h/90);n++){x.fillStyle=rnd()<.5?'rgba(255,255,255,.035)':'rgba(0,0,0,.05)';x.fillRect(rnd()*w,rnd()*h,1,1)}
 ARTCACHE[key]=c;return c}
function artURL(i,w,h){var c=art(i,w,h);if(!c.u)c.u=c.toDataURL('image/jpeg',.88);return c.u}
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,slides=[['Golden hour',2],['Glass ridge',1],['Neon tide',5],['Lilac road',7]],cur=0,busy=false,timer=0,hover=false,E='cubic-bezier(.6,0,.3,1)',D=[];
function W(){return root.clientWidth}function H(){return root.clientHeight}
function url(i){return artURL(slides[i][1],760,420)}
slides.forEach(function(s,i){var d=document.createElement('button');d.type='button';d.className='cl-dot';d.setAttribute('aria-label','Go to slide '+(i+1));d.addEventListener('click',function(){go(i)});dots.appendChild(d);D.push(d)});
function setText(i,first){ch.textContent='Chapter 0'+(i+1);var old=ttl.lastElementChild,n=document.createElement('span');n.textContent=slides[i][0];if(!first){n.style.transform='translateY(100%)';n.style.opacity=0}ttl.appendChild(n);if(old){old.style.transform='translateY(-100%)';old.style.opacity=0;setTimeout(function(){old.remove()},650)}void n.offsetWidth;n.style.transition='transform .6s cubic-bezier(.3,.9,.3,1) .2s,opacity .4s .2s';n.style.transform='none';n.style.opacity=1;D.forEach(function(d,k){if(k===i)d.setAttribute('aria-current','true');else d.removeAttribute('aria-current')})}
function go(n){if(busy||n===cur)return;n=(n+slides.length)%slides.length;busy=true;var from=cur,w=W(),h=H(),N=12,cw=w/N;
 if(reduce){cur=n;img.style.backgroundImage='url('+url(n)+')';setText(n);busy=false;return}
 img.style.backgroundImage='url('+url(n)+')';img.animate([{transform:'scale(1.12)'},{transform:'scale(1)'}],{duration:1100,easing:E});
 cols.textContent='';var anims=[];for(var i=0;i<N;i++){var c=document.createElement('div');c.className='cl-col';c.style.left=(i*cw)+'px';c.style.width=(cw+1)+'px';c.style.backgroundImage='url('+url(from)+')';c.style.backgroundSize=w+'px '+h+'px';c.style.backgroundPosition=(-i*cw)+'px 0';cols.appendChild(c);anims.push(c.animate([{clipPath:'inset(0 0 0 0)'},{clipPath:'inset(0 0 0 100%)'}],{duration:700,delay:i*45,easing:E,fill:'forwards'}))}
 setText(n);cur=n;Promise.all(anims.map(function(a){return a.finished})).then(function(){cols.textContent='';busy=false}).catch(function(){busy=false})}
root.querySelectorAll('[data-d]').forEach(function(b){b.addEventListener('click',function(){go(cur+ +b.getAttribute('data-d'));loop()})});
function loop(){clearTimeout(timer);if(reduce)return;timer=setTimeout(function(){if(!hover)go(cur+1);loop()},3600)}
root.addEventListener('pointerenter',function(){hover=true});root.addEventListener('pointerleave',function(){hover=false});root.addEventListener('focusin',function(){hover=true});root.addEventListener('focusout',function(){hover=false});
img.style.backgroundImage='url('+url(0)+')';setText(0,true);loop();})();
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
