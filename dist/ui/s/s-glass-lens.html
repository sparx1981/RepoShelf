<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glass lens preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,780px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.gl{position:relative;height:380px;border:1px solid #1d1b33;border-radius:28px;background:#120d2a;overflow:hidden;cursor:none;touch-action:pan-y}
.gl canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.gl-hint{position:absolute;left:0;right:0;bottom:14px;margin:0;text-align:center;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#b3a8e8;pointer-events:none}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="gl"><canvas aria-hidden="true"></canvas><p class="gl-hint">Move the lens · click to change zoom</p></div>
</div>
<script>
(function(){var root=document.currentScript.previousElementSibling.querySelector('.gl'),cv=root.querySelector('canvas');
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function Stage(root,cv,draw,resize){
 var s={W:0,H:0,dpr:1,x:0,y:0,vx:0,vy:0,px:0,py:0,inside:false,down:false,t:0,dt:16,ctx:cv.getContext('2d'),click:null,first:true},raf=0,visible=true,last=0,until=0;
 function size(){s.dpr=Math.min(2,window.devicePixelRatio||1);s.W=cv.clientWidth;s.H=cv.clientHeight;cv.width=Math.round(s.W*s.dpr);cv.height=Math.round(s.H*s.dpr);s.ctx.setTransform(s.dpr,0,0,s.dpr,0,0);if(resize)resize(s);s.first=true}
 function frame(now){raf=0;s.dt=Math.min(48,now-(last||now-16));last=now;s.t=now;var tx,ty;
  if(s.inside){tx=s.px;ty=s.py}else{tx=s.W*(.5+.34*Math.sin(now*.00071)+.1*Math.sin(now*.0023));ty=s.H*(.5+.3*Math.sin(now*.00097+1)+.08*Math.cos(now*.0021))}
  if(s.first){s.x=tx;s.y=ty;s.first=false}
  s.vx=tx-s.x;s.vy=ty-s.y;s.x=tx;s.y=ty;draw(s);
  if(visible&&(!reduce||now<until))raf=requestAnimationFrame(frame)}
 function go(){if(!raf&&visible){last=0;raf=requestAnimationFrame(frame)}}
 function poke(){until=performance.now()+900;go()}
 function at(e){var r=cv.getBoundingClientRect();s.px=e.clientX-r.left;s.py=e.clientY-r.top;s.inside=true}
 root.addEventListener('pointermove',function(e){at(e);if(reduce)poke()});
 root.addEventListener('pointerleave',function(){s.inside=false;s.down=false});
 root.addEventListener('pointerdown',function(e){at(e);s.down=true;if(s.click)s.click(s.px,s.py);if(reduce)poke()});
 root.addEventListener('pointerup',function(){s.down=false});
 if('IntersectionObserver' in window)new IntersectionObserver(function(es){visible=es[0].isIntersecting;if(visible)go()}).observe(root);
 if('ResizeObserver' in window){var lw=0;new ResizeObserver(function(){if(cv.clientWidth&&cv.clientWidth!==lw){lw=cv.clientWidth;size();go()}}).observe(cv)}else{size();go()}
 if(!reduce)go();else poke();
 return s}
var art=null,lx=0,ly=0,Z=1.7,tZ=1.7,R=80,ready=false;
function makeArt(s){art=document.createElement('canvas');art.width=cv.width;art.height=cv.height;var a=art.getContext('2d'),W=s.W,H=s.H;a.scale(s.dpr,s.dpr);
 var g=a.createLinearGradient(0,0,W,H);g.addColorStop(0,'#1c1146');g.addColorStop(1,'#3a1b78');a.fillStyle=g;a.fillRect(0,0,W,H);
 [[.2,.3,'255,90,170',.5],[.75,.65,'60,200,255',.42],[.55,.1,'255,190,90',.34]].forEach(function(b){var r=a.createRadialGradient(W*b[0],H*b[1],0,W*b[0],H*b[1],Math.max(W,H)*.45);r.addColorStop(0,'rgba('+b[2]+','+b[3]+')');r.addColorStop(1,'rgba('+b[2]+',0)');a.fillStyle=r;a.fillRect(0,0,W,H)});
 a.strokeStyle='rgba(255,255,255,.16)';a.lineWidth=1;for(var i=1;i<9;i++){a.beginPath();a.arc(W*.5,H*.5,i*34,0,6.283);a.stroke()}
 a.fillStyle='#fff';a.font='900 '+Math.round(W*.115)+'px system-ui,-apple-system,Segoe UI,sans-serif';a.textBaseline='alphabetic';a.fillText('LOOK',W*.07,H*.46);a.fillText('CLOSER',W*.07,H*.46+W*.115);
 a.font='9px ui-monospace,SFMono-Regular,Menlo,monospace';a.fillStyle='rgba(255,255,255,.7)';var line='fine print, tiny detail, hidden notes, small wonders, quiet craft, careful kerning, ';for(var y=H*.8;y<H-44;y+=12)a.fillText(line+line+line,W*.07+((y/12)%3)*18,y);
 ready=true}
var s=Stage(root,cv,function(s){var c=s.ctx,W=s.W,H=s.H;if(!ready)return;c.clearRect(0,0,W,H);c.drawImage(art,0,0,W,H);
 lx+=(s.x-lx)*.2;ly+=(s.y-ly)*.2;Z+=(tZ-Z)*.12;var sp=Math.hypot(s.vx,s.vy);R+=((78+Math.min(16,sp*.7))-R)*.12;
 c.save();c.shadowColor='rgba(0,0,0,.55)';c.shadowBlur=30;c.shadowOffsetY=14;c.fillStyle='#000';c.beginPath();c.arc(lx,ly,R,0,6.283);c.fill();c.restore();
 c.save();c.beginPath();c.arc(lx,ly,R,0,6.283);c.clip();c.translate(lx,ly);c.scale(Z,Z);c.translate(-lx,-ly);c.drawImage(art,0,0,W,H);c.restore();
 var rim=c.createRadialGradient(lx,ly,R*.72,lx,ly,R);rim.addColorStop(0,'rgba(255,255,255,0)');rim.addColorStop(.8,'rgba(255,255,255,.12)');rim.addColorStop(1,'rgba(10,6,30,.5)');c.fillStyle=rim;c.beginPath();c.arc(lx,ly,R,0,6.283);c.fill();
 c.lineWidth=2.2;c.strokeStyle='rgba(255,80,120,.55)';c.beginPath();c.arc(lx+1.6,ly,R-1,0,6.283);c.stroke();c.strokeStyle='rgba(70,140,255,.55)';c.beginPath();c.arc(lx-1.6,ly,R-1,0,6.283);c.stroke();
 c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=1.4;c.beginPath();c.arc(lx,ly,R,0,6.283);c.stroke();
 c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=3.2;c.lineCap='round';c.beginPath();c.arc(lx,ly,R*.8,Math.PI*1.08,Math.PI*1.34);c.stroke();c.lineWidth=1.6;c.beginPath();c.arc(lx,ly,R*.8,Math.PI*1.4,Math.PI*1.46);c.stroke()},function(s){makeArt(s);lx=s.W/2;ly=s.H/2});
s.click=function(){tZ=tZ>2?1.7:2.6};})();
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
