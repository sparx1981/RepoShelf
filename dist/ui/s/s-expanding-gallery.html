<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expanding panel gallery preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,820px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.ag{display:flex;gap:10px;height:320px}
.ag-panel{position:relative;flex:1;min-width:0;border:0;border-radius:20px;padding:0;overflow:hidden;cursor:pointer;color:#fff;text-align:left;transition:flex .55s cubic-bezier(.3,.9,.3,1)}
.ag-panel[aria-expanded=true]{flex:5}
.ag-panel::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.55),transparent 55%)}
.ag-body{position:absolute;left:20px;right:20px;bottom:18px;z-index:1}.ag-body b{display:block;font-size:20px;white-space:nowrap}.ag-body span{display:block;max-height:0;opacity:0;overflow:hidden;font-size:14px;transition:all .4s .1s}
.ag-panel[aria-expanded=true] .ag-body span{max-height:60px;opacity:.9}
.ag-panel:not([aria-expanded=true]) .ag-body b{writing-mode:vertical-rl;transform:rotate(180deg);font-size:16px}
.ag-panel:not([aria-expanded=true]) .ag-body{left:50%;right:auto;transform:translateX(-50%)}
@media (max-width:560px){.ag{flex-direction:column;height:420px}.ag-panel:not([aria-expanded=true]) .ag-body b{writing-mode:horizontal-tb;transform:none}.ag-panel:not([aria-expanded=true]) .ag-body{left:20px;transform:none;bottom:12px}}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="ag"><button class="ag-panel" aria-expanded="true" style="background:linear-gradient(160deg,#6d5ef5,#22d3ee)"><div class="ag-body"><b>Aurora</b><span>Soft ribbons of light over a cold horizon.</span></div></button><button class="ag-panel" aria-expanded="false" style="background:linear-gradient(160deg,#f97316,#f43f5e)"><div class="ag-body"><b>Ember</b><span>Warm glow from a slow dying fire.</span></div></button><button class="ag-panel" aria-expanded="false" style="background:linear-gradient(160deg,#10b981,#0ea5e9)"><div class="ag-body"><b>Lagoon</b><span>Clear shallows and deep teal water.</span></div></button><button class="ag-panel" aria-expanded="false" style="background:linear-gradient(160deg,#a855f7,#ec4899)"><div class="ag-body"><b>Orchid</b><span>Dusk petals fading into magenta.</span></div></button><button class="ag-panel" aria-expanded="false" style="background:linear-gradient(160deg,#334155,#0f172a)"><div class="ag-body"><b>Slate</b><span>Quiet stone for calmer layouts.</span></div></button></div>
</div>
<script>
(function(){var root=document.currentScript.previousElementSibling,panels=[].slice.call(root.querySelectorAll('.ag-panel'));
function open(p){panels.forEach(function(x){x.setAttribute('aria-expanded',String(x===p))})}
panels.forEach(function(p){p.addEventListener('mouseenter',function(){open(p)});p.addEventListener('focus',function(){open(p)});p.addEventListener('click',function(){open(p)})});})();
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
