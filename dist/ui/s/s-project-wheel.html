<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project wheel preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,760px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.pw{position:relative;height:430px;border:1px solid var(--sc-line);border-radius:28px;background:var(--sc-surface);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
.pw-pin{position:sticky;top:0;height:430px;overflow:hidden}
.pw-track{height:1000px}
.pw-ring{position:absolute;left:-654px;top:calc(50% - 354px);width:708px;height:708px;border-radius:50%;border:1px solid var(--sc-line)}
.pw-t{position:absolute;left:0;top:0;white-space:nowrap;font:800 40px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.03em;transition:color .25s;will-change:transform,opacity}
.pw-t.on{color:var(--sc-accent)}
.pw-ph{position:absolute;right:34px;top:50%;width:250px;height:330px;margin-top:-165px;border-radius:22px;overflow:hidden;box-shadow:0 26px 44px -20px rgba(0,0,0,.5)}
.pw-ph i{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .45s}
.pw-ph i.on{opacity:1}
.pw-n{position:absolute;right:34px;bottom:26px;margin:0;font:700 13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;color:var(--sc-muted)}
.pw-live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="pw" tabindex="0" role="region" aria-label="Project list, scroll to turn the wheel"><div class="pw-track"><div class="pw-pin"><div class="pw-ring"></div><div class="pw-ph"></div><p class="pw-n"></p><p class="pw-live" aria-live="polite"></p></div></div></div>
</div>
<script>
(function(){var box=document.currentScript.previousElementSibling.querySelector('.pw'),pin=box.querySelector('.pw-pin'),ph=box.querySelector('.pw-ph'),cnt=box.querySelector('.pw-n'),live=box.querySelector('.pw-live');
var SCENES=[
{s:['#2b1055','#d6457f','#ffb36b'],u:[.68,.6,.11,'#fff1c0'],h:['#8a2f78','#56206a','#2f1450','#170b2c'],st:0},
{s:['#0b1b3a','#2b6cb0','#a6dcff'],u:[.28,.3,.06,'#ffffff'],h:['#7fb0d4','#4a7ba3','#274b6b','#12273d'],st:0},
{s:['#ffd9a0','#ff9a5a','#d24a43'],u:[.5,.56,.14,'#fff6d8'],h:['#bd4b33','#8c3029','#5c1d29','#300f21'],st:0},
{s:['#06122a','#12305a','#40306f'],u:[.78,.22,.05,'#f5f1ff'],h:['#21405f','#14304a','#0c1f36','#050e1c'],st:1},
{s:['#c4f6dc','#82e2b8','#2fa583'],u:[.3,.28,.09,'#ffffff'],h:['#41b98d','#2b9370','#17664d','#0b402f'],st:0},
{s:['#1a0b2e','#6a1b9a','#ff4fa8'],u:[.5,.5,.12,'#ffe0f3'],h:['#44186e','#2a1250','#170a34','#0a061a'],st:1},
{s:['#0c2429','#1a5a56','#7adcc8'],u:[.72,.34,.07,'#eafff9'],h:['#318e84','#1d625c','#103c40','#06202a'],st:1},
{s:['#fbe6ff','#d8abff','#8d7cff'],u:[.24,.4,.1,'#fffbe8'],h:['#a284ff','#6f58db','#4535a6','#271c63'],st:0}];
var ARTCACHE={};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function art(i,w,h){var key=i+'/'+w+'/'+h;if(ARTCACHE[key])return ARTCACHE[key];var sc=SCENES[((i%8)+8)%8],c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d'),rnd=mulberry(i*7919+13);
 var g=x.createLinearGradient(0,0,0,h*.8);g.addColorStop(0,sc.s[0]);g.addColorStop(.55,sc.s[1]);g.addColorStop(1,sc.s[2]);x.fillStyle=g;x.fillRect(0,0,w,h);
 if(sc.st){for(var k=0;k<90;k++){x.fillStyle='rgba(255,255,255,'+(.25+rnd()*.6)+')';var r=rnd()*1.4+.3;x.beginPath();x.arc(rnd()*w,rnd()*h*.55,r,0,6.283);x.fill()}}
 var ux=sc.u[0]*w,uy=sc.u[1]*h,ur=sc.u[2]*Math.min(w,h),gl=x.createRadialGradient(ux,uy,ur*.2,ux,uy,ur*4.2);gl.addColorStop(0,sc.u[3]+'cc');gl.addColorStop(1,sc.u[3]+'00');x.fillStyle=gl;x.fillRect(0,0,w,h);x.fillStyle=sc.u[3];x.beginPath();x.arc(ux,uy,ur,0,6.283);x.fill();
 for(var L=0;L<4;L++){var y0=h*(.5+L*.11),amp=h*(.07-L*.008),p1=rnd()*6,p2=rnd()*6,p3=rnd()*6,f1=2.2+rnd()*1.4,f2=5+rnd()*3,f3=11+rnd()*5;x.beginPath();x.moveTo(0,h);for(var px=0;px<=w+3;px+=3){var t=px/w;x.lineTo(px,y0+Math.sin(t*f1+p1)*amp+Math.sin(t*f2+p2)*amp*.45+Math.sin(t*f3+p3)*amp*.18)}x.lineTo(w,h);x.closePath();
  var hg=x.createLinearGradient(0,y0-amp,0,h);hg.addColorStop(0,sc.h[L]);hg.addColorStop(1,L<3?sc.h[L+1]:'#000');x.fillStyle=hg;x.fill();
  if(L<3){var fg=x.createLinearGradient(0,y0-amp,0,y0+h*.12);fg.addColorStop(0,'rgba(255,255,255,.13)');fg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=fg;x.fill()}}
 for(var n=0;n<Math.round(w*h/90);n++){x.fillStyle=rnd()<.5?'rgba(255,255,255,.035)':'rgba(0,0,0,.05)';x.fillRect(rnd()*w,rnd()*h,1,1)}
 ARTCACHE[key]=c;return c}
function artURL(i,w,h){var c=art(i,w,h);if(!c.u)c.u=c.toDataURL('image/jpeg',.88);return c.u}
function ScrollDemo(box,fn,opt){
 var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,auto=!reduce,dir=1,vis=true,raf=0,last=0,resumeT=0,pause=0,SP=(opt&&opt.speed)||.075;
 function max(){return Math.max(1,box.scrollHeight-box.clientHeight)}
 function run(now){var m=max();fn(box.scrollTop/m,box.scrollTop,m,now)}
 function frame(now){raf=0;var dt=Math.min(40,now-(last||now));last=now;
  if(auto&&now>pause){var m=max();box.scrollTop+=dir*dt*SP;if(box.scrollTop>=m-1){dir=-1;pause=now+1100}else if(box.scrollTop<=0){dir=1;pause=now+1100}}
  run(now);if(vis)raf=requestAnimationFrame(frame)}
 function go(){if(!raf&&vis&&!reduce){last=0;raf=requestAnimationFrame(frame)}}
 function user(){auto=false;clearTimeout(resumeT);if(!reduce)resumeT=setTimeout(function(){auto=true},4000)}
 ['wheel','touchstart','pointerdown','keydown'].forEach(function(e){box.addEventListener(e,user,{passive:true})});
 box.addEventListener('scroll',function(){if(reduce)run(performance.now())},{passive:true});
 if('IntersectionObserver' in window)new IntersectionObserver(function(es){vis=es[0].isIntersecting;go()}).observe(box);
 addEventListener('resize',function(){run(performance.now())});
 run(performance.now());go();return {run:function(){run(performance.now())}}}
var titles=['Northern Light','Quiet Harbour','Paper Cities','Slow Summer','Night Shift','Open Field'],ids=[3,1,7,2,5,4],T=[],P=[],N=6,cur=-1;
titles.forEach(function(t,i){var el=document.createElement('div');el.className='pw-t';el.textContent=t;pin.appendChild(el);T.push(el);var im=document.createElement('i');im.style.backgroundImage='url('+artURL(ids[i],250,330)+')';ph.appendChild(im);P.push(im)});
ScrollDemo(box,function(p){var f=p*(N-1),H=pin.clientHeight,near=Math.round(f);
 T.forEach(function(el,i){var a=(i-f)*17;el.style.transform='translate(-300px,'+(H/2)+'px) rotate('+a.toFixed(2)+'deg) translate('+(370+(i===near?14:0))+'px,-50%)';el.style.opacity=Math.max(.12,1-Math.abs(a)/38).toFixed(2);el.classList.toggle('on',i===near)});
 if(near!==cur){cur=near;P.forEach(function(im,i){im.classList.toggle('on',i===near)});cnt.textContent='0'+(near+1)+' / 0'+N;live.textContent=titles[near]}});})();
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
