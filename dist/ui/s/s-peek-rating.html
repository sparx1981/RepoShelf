<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peek star rating preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,460px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.pr{display:grid;gap:12px;justify-items:center}
.pr-stars{display:inline-flex;gap:4px}
.pr-star{padding:4px;border:0;background:none;cursor:pointer;border-radius:8px}
.pr-star svg{display:block;width:38px;height:38px;fill:transparent;stroke:var(--sc-muted);stroke-width:1.6;stroke-linejoin:round;transition:fill .15s,stroke .15s,transform .2s}
.pr-star.on svg{fill:#f59e0b;stroke:#f59e0b}.pr-star:hover svg{transform:scale(1.12)}
.pr-star.pop svg{animation:pr-pop .45s cubic-bezier(.3,1.6,.5,1)}
.pr-cap{margin:0;min-height:1.5em;color:var(--sc-muted);font-size:14px}
@keyframes pr-pop{50%{transform:scale(1.4) rotate(-12deg)}}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="pr"><div class="pr-stars" role="radiogroup" aria-label="Rating"><button class="pr-star" role="radio" aria-checked="false" aria-label="1 star"><svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.6l1.2-6.5L2.5 9.5l6.6-.9z"/></svg></button><button class="pr-star" role="radio" aria-checked="false" aria-label="2 stars"><svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.6l1.2-6.5L2.5 9.5l6.6-.9z"/></svg></button><button class="pr-star" role="radio" aria-checked="false" aria-label="3 stars"><svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.6l1.2-6.5L2.5 9.5l6.6-.9z"/></svg></button><button class="pr-star" role="radio" aria-checked="false" aria-label="4 stars"><svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.6l1.2-6.5L2.5 9.5l6.6-.9z"/></svg></button><button class="pr-star" role="radio" aria-checked="false" aria-label="5 stars"><svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.6l1.2-6.5L2.5 9.5l6.6-.9z"/></svg></button></div><p class="pr-cap" role="status" aria-live="polite">Tap a star to rate</p></div>
</div>
<script>
(function(){var root=document.currentScript.previousElementSibling,stars=[].slice.call(root.querySelectorAll('.pr-star')),cap=root.querySelector('.pr-cap'),value=4,words=['','Not for me','It was fine','Pretty good','Loved it','Absolutely brilliant'];
function paint(n){stars.forEach(function(s,i){s.classList.toggle('on',i<n)})}
function set(n,focus){value=n;stars.forEach(function(s,i){s.setAttribute('aria-checked',String(i+1===n));s.tabIndex=i+1===n||(!n&&!i)?0:-1});paint(n);cap.textContent=words[n];var s=stars[n-1];s.classList.remove('pop');void s.offsetWidth;s.classList.add('pop');if(focus)s.focus()}
stars.forEach(function(s,i){s.addEventListener('mouseenter',function(){paint(i+1)});s.addEventListener('click',function(){set(i+1)});s.addEventListener('keydown',function(e){var n=e.key==='ArrowRight'||e.key==='ArrowUp'?Math.min(5,value+1):e.key==='ArrowLeft'||e.key==='ArrowDown'?Math.max(1,value-1):0;if(n){e.preventDefault();set(n,true)}})});
root.querySelector('.pr-stars').addEventListener('mouseleave',function(){paint(value)});set(4);})();
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
