<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parallax carousel preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,820px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.pc{position:relative;height:470px;border:1px solid var(--sc-line);border-radius:28px;background:var(--sc-surface);overflow:hidden;cursor:grab;touch-action:pan-y;user-select:none}
.pc.drag{cursor:grabbing}
.pc-view{position:absolute;left:0;right:0;top:34px;height:400px;perspective:1200px}
.pc-card{position:absolute;left:50%;top:0;width:300px;height:400px;margin-left:-150px;border-radius:22px;overflow:hidden;box-shadow:0 30px 50px -22px rgba(0,0,0,.55);will-change:transform}
.pc-img{position:absolute;top:0;bottom:0;left:-20%;width:140%;background-size:cover;background-position:center;will-change:transform}
.pc-card strong{position:absolute;left:20px;bottom:20px;color:#fff;font:800 22px/1 system-ui,-apple-system,"Segoe UI",sans-serif;text-shadow:0 1px 10px rgba(0,0,0,.5)}
.pc-bar{position:absolute;left:24px;right:24px;bottom:16px;display:flex;align-items:center;gap:14px}
.pc-prog{flex:1;height:3px;border-radius:3px;background:var(--sc-line);overflow:hidden}
.pc-prog i{display:block;height:100%;width:0;background:var(--sc-accent)}
.pc-btn{padding:7px 14px;border:1px solid var(--sc-line);border-radius:999px;background:var(--sc-bg);cursor:pointer;font-size:13px;font-weight:600}
.pc-btn:hover{border-color:var(--sc-accent)}
.pc-name{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="pc" role="group" aria-roledescription="carousel" aria-label="Landscape carousel" tabindex="0"><div class="pc-view"></div><p class="pc-name" aria-live="polite"></p><div class="pc-bar"><button class="pc-btn" type="button" data-d="-1" aria-label="Previous">Prev</button><span class="pc-prog"><i></i></span><button class="pc-btn" type="button" data-d="1" aria-label="Next">Next</button></div></div>
</div>
<script>
(function(){var root=document.currentScript.previousElementSibling.querySelector('.pc'),view=root.querySelector('.pc-view'),prog=root.querySelector('.pc-prog i'),nm=root.querySelector('.pc-name');
var SCENES=[
{s:['#2b1055','#d6457f','#ffb36b'],u:[.68,.6,.11,'#fff1c0'],h:['#8a2f78','#56206a','#2f1450','#170b2c'],st:0},
{s:['#0b1b3a','#2b6cb0','#a6dcff'],u:[.28,.3,.06,'#ffffff'],h:['#7fb0d4','#4a7ba3','#274b6b','#12273d'],st:0},
{s:['#ffd9a0','#ff9a5a','#d24a43'],u:[.5,.56,.14,'#fff6d8'],h:['#bd4b33','#8c3029','#5c1d29','#300f21'],st:0},
{s:['#06122a','#12305a','#40306f'],u:[.78,.22,.05,'#f5f1ff'],h:['#21405f','#14304a','#0c1f36','#050e1c'],st:1},
{s:['#c4f6dc','#82e2b8','#2fa583'],u:[.3,.28,.09,'#ffffff'],h:['#41b98d','#2b9370','#17664d','#0b402f'],st:0},
{s:['#1a0b2e','#6a1b9a','#ff4fa8'],u:[.5,.5,.12,'#ffe0f3'],h:['#44186e','#2a1250','#170a34','#0a061a'],st:1},
{s:['#0c2429','#1a5a56','#7adcc8'],u:[.72,.34,.07,'#eafff9'],h:['#318e84','#1d625c','#103c40','#06202a'],st:1},
{s:['#fbe6ff','#d8abff','#8d7cff'],u:[.24,.4,.1,'#fffbe8'],h:['#a284ff','#6f58db','#4535a6','#271c63'],st:0}];
var ARTCACHE={};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function art(i,w,h){var key=i+'/'+w+'/'+h;if(ARTCACHE[key])return ARTCACHE[key];var sc=SCENES[((i%8)+8)%8],c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d'),rnd=mulberry(i*7919+13);
 var g=x.createLinearGradient(0,0,0,h*.8);g.addColorStop(0,sc.s[0]);g.addColorStop(.55,sc.s[1]);g.addColorStop(1,sc.s[2]);x.fillStyle=g;x.fillRect(0,0,w,h);
 if(sc.st){for(var k=0;k<90;k++){x.fillStyle='rgba(255,255,255,'+(.25+rnd()*.6)+')';var r=rnd()*1.4+.3;x.beginPath();x.arc(rnd()*w,rnd()*h*.55,r,0,6.283);x.fill()}}
 var ux=sc.u[0]*w,uy=sc.u[1]*h,ur=sc.u[2]*Math.min(w,h),gl=x.createRadialGradient(ux,uy,ur*.2,ux,uy,ur*4.2);gl.addColorStop(0,sc.u[3]+'cc');gl.addColorStop(1,sc.u[3]+'00');x.fillStyle=gl;x.fillRect(0,0,w,h);x.fillStyle=sc.u[3];x.beginPath();x.arc(ux,uy,ur,0,6.283);x.fill();
 for(var L=0;L<4;L++){var y0=h*(.5+L*.11),amp=h*(.07-L*.008),p1=rnd()*6,p2=rnd()*6,p3=rnd()*6,f1=2.2+rnd()*1.4,f2=5+rnd()*3,f3=11+rnd()*5;x.beginPath();x.moveTo(0,h);for(var px=0;px<=w+3;px+=3){var t=px/w;x.lineTo(px,y0+Math.sin(t*f1+p1)*amp+Math.sin(t*f2+p2)*amp*.45+Math.sin(t*f3+p3)*amp*.18)}x.lineTo(w,h);x.closePath();
  var hg=x.createLinearGradient(0,y0-amp,0,h);hg.addColorStop(0,sc.h[L]);hg.addColorStop(1,L<3?sc.h[L+1]:'#000');x.fillStyle=hg;x.fill();
  if(L<3){var fg=x.createLinearGradient(0,y0-amp,0,y0+h*.12);fg.addColorStop(0,'rgba(255,255,255,.13)');fg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=fg;x.fill()}}
 for(var n=0;n<Math.round(w*h/90);n++){x.fillStyle=rnd()<.5?'rgba(255,255,255,.035)':'rgba(0,0,0,.05)';x.fillRect(rnd()*w,rnd()*h,1,1)}
 ARTCACHE[key]=c;return c}
function artURL(i,w,h){var c=art(i,w,h);if(!c.u)c.u=c.toDataURL('image/jpeg',.88);return c.u}
var NAMES=['Dusk','Glacier','Mesa','Night','Mint','Neon','Tide','Lilac'];
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,N=7,W=324,cards=[],x=0,tx=0,v=0,drag=false,lx=0,raf=0,visible=true,lastName=-1;
for(var i=0;i<N;i++){var c=document.createElement('div');c.className='pc-card';var im=document.createElement('div');im.className='pc-img';im.style.backgroundImage='url('+artURL(i+4,420,400)+')';var t=document.createElement('strong');t.textContent=NAMES[(i+4)%8];c.appendChild(im);c.appendChild(t);view.appendChild(c);cards.push({el:c,img:im})}
function frame(){raf=0;if(!drag){if(Math.abs(v)>.4){tx+=v;v*=.92}else{var snap=Math.round(tx/W)*W;snap=Math.max(0,Math.min((N-1)*W,snap));tx=reduce?snap:tx+(snap-tx)*.14;v=0}}tx=Math.max(-W*.3,Math.min((N-1)*W+W*.3,tx));x+=(tx-x)*(reduce?1:.25);
 cards.forEach(function(c,i){var off=(i*W-x)/W,a=Math.abs(off);c.el.style.transform='translateX('+(off*W).toFixed(1)+'px) scale('+(1-Math.min(.25,a*.1)).toFixed(3)+') rotateY('+(off*-10).toFixed(2)+'deg)';c.el.style.zIndex=100-Math.round(a*10);c.el.style.opacity=Math.max(.15,1-a*.28).toFixed(2);c.img.style.transform='translateX('+(-off*70).toFixed(1)+'px)'});
 prog.style.width=(Math.max(0,Math.min(1,x/((N-1)*W)))*100).toFixed(1)+'%';var cur=Math.max(0,Math.min(N-1,Math.round(x/W)));if(cur!==lastName){lastName=cur;nm.textContent=NAMES[(cur+4)%8]}
 if(visible)raf=requestAnimationFrame(frame)}
function go(){if(!raf&&visible)raf=requestAnimationFrame(frame)}
function step(d){tx=Math.max(0,Math.min((N-1)*W,Math.round(tx/W)*W+d*W));v=0}
root.addEventListener('pointerdown',function(e){if(e.target.closest('.pc-bar'))return;drag=true;lx=e.clientX;v=0;root.classList.add('drag');try{root.setPointerCapture(e.pointerId)}catch(_){}});
root.addEventListener('pointermove',function(e){if(!drag)return;var dx=e.clientX-lx;lx=e.clientX;tx-=dx;v=-dx});
function up(){drag=false;root.classList.remove('drag')}root.addEventListener('pointerup',up);root.addEventListener('pointercancel',up);
root.addEventListener('wheel',function(e){if(Math.abs(e.deltaX)>Math.abs(e.deltaY))tx+=e.deltaX},{passive:true});
root.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'){e.preventDefault();step(-1)}if(e.key==='ArrowRight'){e.preventDefault();step(1)}});
root.querySelectorAll('[data-d]').forEach(function(b){b.addEventListener('click',function(){step(+b.getAttribute('data-d'))})});
if('IntersectionObserver' in window)new IntersectionObserver(function(es){visible=es[0].isIntersecting;go()}).observe(root);tx=W*2;x=tx;go();})();
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
