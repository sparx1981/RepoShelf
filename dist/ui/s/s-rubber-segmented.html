<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rubber segmented control preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,520px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.rs{display:grid;gap:18px;justify-items:center}
.rs-bar{position:relative;display:inline-flex;padding:5px;border-radius:14px;background:var(--sc-surface);border:1px solid var(--sc-line)}
.rs-ind{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:10px;background:var(--sc-bg);box-shadow:0 1px 4px rgba(0,0,0,.2),0 0 0 1px var(--sc-line);transition:transform .5s cubic-bezier(.3,1.5,.5,1),width .5s cubic-bezier(.3,1.5,.5,1)}
.rs-opt{position:relative;padding:9px 24px;border:0;background:none;border-radius:10px;cursor:pointer;color:var(--sc-muted);transition:color .2s}
.rs-opt[aria-checked=true]{color:var(--sc-fg);font-weight:600}
.rs-out{font-size:34px;font-weight:700;letter-spacing:-.03em}.rs-out small{display:block;font-size:13px;font-weight:400;color:var(--sc-muted);letter-spacing:0}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="rs"><div class="rs-bar" role="radiogroup" aria-label="Range"><span class="rs-ind"></span><button class="rs-opt" role="radio" aria-checked="false">Day</button><button class="rs-opt" role="radio" aria-checked="true">Week</button><button class="rs-opt" role="radio" aria-checked="false">Month</button></div><div class="rs-out" aria-live="polite">48,210<small>visitors this week</small></div></div>
</div>
<script>
(function(){var root=document.currentScript.previousElementSibling,bar=root.querySelector('.rs-bar'),ind=bar.querySelector('.rs-ind'),opts=[].slice.call(bar.querySelectorAll('.rs-opt')),out=root.querySelector('.rs-out'),data=[['6,918','visitors today'],['48,210','visitors this week'],['201,774','visitors this month']];
function sel(i,focus){opts.forEach(function(o,n){o.setAttribute('aria-checked',String(n===i));o.tabIndex=n===i?0:-1});var o=opts[i];ind.style.width=o.offsetWidth+'px';ind.style.transform='translateX('+(o.offsetLeft-5)+'px)';out.firstChild.textContent=data[i][0];out.querySelector('small').textContent=data[i][1];if(focus)o.focus()}
opts.forEach(function(o,i){o.addEventListener('click',function(){sel(i)});o.addEventListener('keydown',function(e){var n=e.key==='ArrowRight'?(i+1)%3:e.key==='ArrowLeft'?(i+2)%3:-1;if(n>=0){e.preventDefault();sel(n,true)}})});
ind.style.transition='none';sel(1);requestAnimationFrame(function(){ind.style.transition=''});})();
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
