<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Page-turn menu preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,760px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.sm{position:relative;height:430px;border:1px solid var(--sc-line);border-radius:28px;background:#0b0b10;overflow:hidden;perspective:1200px}
.sm-page{position:absolute;inset:0;z-index:2;overflow:hidden;background-size:cover;background-position:center;transform-origin:0 50%;transition:transform .75s cubic-bezier(.7,0,.2,1),border-radius .75s,box-shadow .75s;cursor:default}
.sm.open .sm-page{transform:translateX(-12%) rotate(-4deg) scale(.82);border-radius:30px;box-shadow:0 40px 80px -20px rgba(0,0,0,.7);cursor:pointer}
.sm-hero{position:absolute;left:34px;bottom:40px;max-width:420px;color:#fff;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.sm-hero h2{margin:0;font:900 54px/.98 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.04em}
.sm-hero p{margin:12px 0 0;font-size:16px;opacity:.92}
.sm-burger{position:absolute;right:20px;top:18px;z-index:6;width:48px;height:48px;border:0;border-radius:50%;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);cursor:pointer;display:grid;place-content:center;gap:5px}
.sm-burger i{display:block;width:20px;height:2px;border-radius:2px;background:#fff;transition:transform .5s cubic-bezier(.7,0,.2,1)}
.sm.open .sm-burger i:first-child{transform:translateY(3.5px) rotate(45deg)}.sm.open .sm-burger i:last-child{transform:translateY(-3.5px) rotate(-45deg)}
.sm-panel{position:absolute;top:0;right:0;bottom:0;z-index:4;width:62%;background:#101018;transform:translateX(100%);transition:transform .75s cubic-bezier(.7,0,.2,1);display:grid;grid-template-columns:1fr 40%;gap:14px;padding:86px 22px 28px 34px}
.sm.open .sm-panel{transform:none}
.sm-nav{display:grid;align-content:start;gap:6px}
.sm-a{display:block;overflow:hidden;color:#fff;text-decoration:none;font:800 42px/1.1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.03em}
.sm-a span{display:block;transform:translateY(110%);transition:transform .6s cubic-bezier(.3,.9,.3,1),color .25s,padding .3s}
.sm.open .sm-a span{transform:none;transition-delay:calc(.5s + var(--i)*60ms),0s,0s}
.sm-a:hover span,.sm-a:focus-visible span{padding-left:10px;color:hsl(262 90% 78%)}
.sm-img{position:relative;border-radius:18px;overflow:hidden;align-self:end;height:70%}
.sm-img i{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .45s}
.sm-img i.on{opacity:1}
.sm:not(.open) .sm-panel{visibility:hidden;transition:transform .75s cubic-bezier(.7,0,.2,1),visibility 0s .75s}
@media (prefers-reduced-motion:reduce){.sm-page,.sm-panel,.sm-a span,.sm-burger i,.sm-img i{transition:none}}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="sm"><div class="sm-page"><div class="sm-hero"><h2>Slow light, big skies.</h2><p>A field guide to the hours we love.</p></div></div><button class="sm-burger" type="button" aria-expanded="false" aria-controls="sm-nav" aria-label="Open menu"><i></i><i></i></button><div class="sm-panel"><nav class="sm-nav" id="sm-nav" aria-label="Main"></nav><div class="sm-img" aria-hidden="true"></div></div></div>
</div>
<script>
(function(){var root=document.currentScript.previousElementSibling.querySelector('.sm'),page=root.querySelector('.sm-page'),btn=root.querySelector('.sm-burger'),nav=root.querySelector('.sm-nav'),imgBox=root.querySelector('.sm-img');
var SCENES=[
{s:['#2b1055','#d6457f','#ffb36b'],u:[.68,.6,.11,'#fff1c0'],h:['#8a2f78','#56206a','#2f1450','#170b2c'],st:0},
{s:['#0b1b3a','#2b6cb0','#a6dcff'],u:[.28,.3,.06,'#ffffff'],h:['#7fb0d4','#4a7ba3','#274b6b','#12273d'],st:0},
{s:['#ffd9a0','#ff9a5a','#d24a43'],u:[.5,.56,.14,'#fff6d8'],h:['#bd4b33','#8c3029','#5c1d29','#300f21'],st:0},
{s:['#06122a','#12305a','#40306f'],u:[.78,.22,.05,'#f5f1ff'],h:['#21405f','#14304a','#0c1f36','#050e1c'],st:1},
{s:['#c4f6dc','#82e2b8','#2fa583'],u:[.3,.28,.09,'#ffffff'],h:['#41b98d','#2b9370','#17664d','#0b402f'],st:0},
{s:['#1a0b2e','#6a1b9a','#ff4fa8'],u:[.5,.5,.12,'#ffe0f3'],h:['#44186e','#2a1250','#170a34','#0a061a'],st:1},
{s:['#0c2429','#1a5a56','#7adcc8'],u:[.72,.34,.07,'#eafff9'],h:['#318e84','#1d625c','#103c40','#06202a'],st:1},
{s:['#fbe6ff','#d8abff','#8d7cff'],u:[.24,.4,.1,'#fffbe8'],h:['#a284ff','#6f58db','#4535a6','#271c63'],st:0}];
var ARTCACHE={};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function art(i,w,h){var key=i+'/'+w+'/'+h;if(ARTCACHE[key])return ARTCACHE[key];var sc=SCENES[((i%8)+8)%8],c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d'),rnd=mulberry(i*7919+13);
 var g=x.createLinearGradient(0,0,0,h*.8);g.addColorStop(0,sc.s[0]);g.addColorStop(.55,sc.s[1]);g.addColorStop(1,sc.s[2]);x.fillStyle=g;x.fillRect(0,0,w,h);
 if(sc.st){for(var k=0;k<90;k++){x.fillStyle='rgba(255,255,255,'+(.25+rnd()*.6)+')';var r=rnd()*1.4+.3;x.beginPath();x.arc(rnd()*w,rnd()*h*.55,r,0,6.283);x.fill()}}
 var ux=sc.u[0]*w,uy=sc.u[1]*h,ur=sc.u[2]*Math.min(w,h),gl=x.createRadialGradient(ux,uy,ur*.2,ux,uy,ur*4.2);gl.addColorStop(0,sc.u[3]+'cc');gl.addColorStop(1,sc.u[3]+'00');x.fillStyle=gl;x.fillRect(0,0,w,h);x.fillStyle=sc.u[3];x.beginPath();x.arc(ux,uy,ur,0,6.283);x.fill();
 for(var L=0;L<4;L++){var y0=h*(.5+L*.11),amp=h*(.07-L*.008),p1=rnd()*6,p2=rnd()*6,p3=rnd()*6,f1=2.2+rnd()*1.4,f2=5+rnd()*3,f3=11+rnd()*5;x.beginPath();x.moveTo(0,h);for(var px=0;px<=w+3;px+=3){var t=px/w;x.lineTo(px,y0+Math.sin(t*f1+p1)*amp+Math.sin(t*f2+p2)*amp*.45+Math.sin(t*f3+p3)*amp*.18)}x.lineTo(w,h);x.closePath();
  var hg=x.createLinearGradient(0,y0-amp,0,h);hg.addColorStop(0,sc.h[L]);hg.addColorStop(1,L<3?sc.h[L+1]:'#000');x.fillStyle=hg;x.fill();
  if(L<3){var fg=x.createLinearGradient(0,y0-amp,0,y0+h*.12);fg.addColorStop(0,'rgba(255,255,255,.13)');fg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=fg;x.fill()}}
 for(var n=0;n<Math.round(w*h/90);n++){x.fillStyle=rnd()<.5?'rgba(255,255,255,.035)':'rgba(0,0,0,.05)';x.fillRect(rnd()*w,rnd()*h,1,1)}
 ARTCACHE[key]=c;return c}
function artURL(i,w,h){var c=art(i,w,h);if(!c.u)c.u=c.toDataURL('image/jpeg',.88);return c.u}
var links=['Home','Work','About','Journal'],ids=[2,5,1,6],I=[];page.style.backgroundImage='url('+artURL(2,760,430)+')';
links.forEach(function(t,i){var a=document.createElement('a');a.className='sm-a';a.href='#';a.style.setProperty('--i',i);a.tabIndex=-1;var s=document.createElement('span');s.textContent=t;a.appendChild(s);a.addEventListener('click',function(e){e.preventDefault();set(false)});nav.appendChild(a);var im=document.createElement('i');im.style.backgroundImage='url('+artURL(ids[i],240,300)+')';if(!i)im.className='on';imgBox.appendChild(im);I.push(im);
 function sel(){I.forEach(function(x,k){x.classList.toggle('on',k===i)})}a.addEventListener('pointerenter',sel);a.addEventListener('focus',sel)});
function set(o){root.classList.toggle('open',o);btn.setAttribute('aria-expanded',String(o));btn.setAttribute('aria-label',o?'Close menu':'Open menu');nav.querySelectorAll('a').forEach(function(a){a.tabIndex=o?0:-1});if(!o)btn.focus()}
btn.addEventListener('click',function(){set(!root.classList.contains('open'))});page.addEventListener('click',function(){if(root.classList.contains('open'))set(false)});root.addEventListener('keydown',function(e){if(e.key==='Escape'&&root.classList.contains('open'))set(false)});
var auto=setInterval(function(){if(!root.matches(':hover')&&!root.contains(document.activeElement)){var o=!root.classList.contains('open');root.classList.toggle('open',o);btn.setAttribute('aria-expanded',String(o))}},3800);root.addEventListener('pointerenter',function(){clearInterval(auto)});root.addEventListener('focusin',function(){clearInterval(auto)});})();
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
