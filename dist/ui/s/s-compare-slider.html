<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Before & after slider preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,800px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.cp{display:grid;gap:14px;padding:14px;border:1px solid var(--sc-line);border-radius:28px;background:var(--sc-surface)}
.cp-stage{--p:50%;position:relative;height:380px;border-radius:18px;overflow:hidden;cursor:ew-resize;touch-action:pan-y;user-select:none}
.cp-img{position:absolute;inset:0;background-size:cover;background-position:center}
.cp-before{filter:grayscale(1) contrast(.85) brightness(.9);clip-path:inset(0 calc(100% - var(--p)) 0 0)}
.cp-line{position:absolute;top:0;bottom:0;left:var(--p);width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 12px rgba(0,0,0,.5)}
.cp-grip{position:absolute;top:50%;left:var(--p);width:44px;height:44px;margin:-22px 0 0 -22px;display:grid;place-items:center;border-radius:50%;background:#fff;color:#222;box-shadow:0 6px 20px rgba(0,0,0,.4);font-weight:800;font-size:15px;pointer-events:none}
.cp-range{position:absolute;width:1px;height:1px;opacity:0}
.cp-range:focus-visible~.cp-grip{outline:3px solid var(--sc-accent);outline-offset:3px}
.cp-tag{position:absolute;top:14px;padding:5px 11px;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;pointer-events:none}
.cp-tag.a{right:14px}.cp-tag.b{left:14px}
.cp-tabs{display:flex;gap:8px;justify-content:center}
.cp-tab{padding:7px 16px;border:1px solid var(--sc-line);border-radius:999px;background:var(--sc-bg);cursor:pointer;font-size:13px;font-weight:600}
.cp-tab[aria-pressed=true]{border-color:var(--sc-accent);background:var(--sc-ring)}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="cp"><div class="cp-stage"><div class="cp-img cp-after"></div><div class="cp-img cp-before"></div><div class="cp-line"></div><input class="cp-range" type="range" min="0" max="100" value="50" aria-label="Reveal"><div class="cp-grip" aria-hidden="true">&#8644;</div><span class="cp-tag b">Before</span><span class="cp-tag a">After</span></div><div class="cp-tabs"></div></div>
</div>
<script>
(function(){var root=document.currentScript.previousElementSibling.querySelector('.cp'),stage=root.querySelector('.cp-stage'),after=root.querySelector('.cp-after'),before=root.querySelector('.cp-before'),range=root.querySelector('.cp-range'),tabs=root.querySelector('.cp-tabs');
var SCENES=[
{s:['#2b1055','#d6457f','#ffb36b'],u:[.68,.6,.11,'#fff1c0'],h:['#8a2f78','#56206a','#2f1450','#170b2c'],st:0},
{s:['#0b1b3a','#2b6cb0','#a6dcff'],u:[.28,.3,.06,'#ffffff'],h:['#7fb0d4','#4a7ba3','#274b6b','#12273d'],st:0},
{s:['#ffd9a0','#ff9a5a','#d24a43'],u:[.5,.56,.14,'#fff6d8'],h:['#bd4b33','#8c3029','#5c1d29','#300f21'],st:0},
{s:['#06122a','#12305a','#40306f'],u:[.78,.22,.05,'#f5f1ff'],h:['#21405f','#14304a','#0c1f36','#050e1c'],st:1},
{s:['#c4f6dc','#82e2b8','#2fa583'],u:[.3,.28,.09,'#ffffff'],h:['#41b98d','#2b9370','#17664d','#0b402f'],st:0},
{s:['#1a0b2e','#6a1b9a','#ff4fa8'],u:[.5,.5,.12,'#ffe0f3'],h:['#44186e','#2a1250','#170a34','#0a061a'],st:1},
{s:['#0c2429','#1a5a56','#7adcc8'],u:[.72,.34,.07,'#eafff9'],h:['#318e84','#1d625c','#103c40','#06202a'],st:1},
{s:['#fbe6ff','#d8abff','#8d7cff'],u:[.24,.4,.1,'#fffbe8'],h:['#a284ff','#6f58db','#4535a6','#271c63'],st:0}];
var ARTCACHE={};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function art(i,w,h){var key=i+'/'+w+'/'+h;if(ARTCACHE[key])return ARTCACHE[key];var sc=SCENES[((i%8)+8)%8],c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d'),rnd=mulberry(i*7919+13);
 var g=x.createLinearGradient(0,0,0,h*.8);g.addColorStop(0,sc.s[0]);g.addColorStop(.55,sc.s[1]);g.addColorStop(1,sc.s[2]);x.fillStyle=g;x.fillRect(0,0,w,h);
 if(sc.st){for(var k=0;k<90;k++){x.fillStyle='rgba(255,255,255,'+(.25+rnd()*.6)+')';var r=rnd()*1.4+.3;x.beginPath();x.arc(rnd()*w,rnd()*h*.55,r,0,6.283);x.fill()}}
 var ux=sc.u[0]*w,uy=sc.u[1]*h,ur=sc.u[2]*Math.min(w,h),gl=x.createRadialGradient(ux,uy,ur*.2,ux,uy,ur*4.2);gl.addColorStop(0,sc.u[3]+'cc');gl.addColorStop(1,sc.u[3]+'00');x.fillStyle=gl;x.fillRect(0,0,w,h);x.fillStyle=sc.u[3];x.beginPath();x.arc(ux,uy,ur,0,6.283);x.fill();
 for(var L=0;L<4;L++){var y0=h*(.5+L*.11),amp=h*(.07-L*.008),p1=rnd()*6,p2=rnd()*6,p3=rnd()*6,f1=2.2+rnd()*1.4,f2=5+rnd()*3,f3=11+rnd()*5;x.beginPath();x.moveTo(0,h);for(var px=0;px<=w+3;px+=3){var t=px/w;x.lineTo(px,y0+Math.sin(t*f1+p1)*amp+Math.sin(t*f2+p2)*amp*.45+Math.sin(t*f3+p3)*amp*.18)}x.lineTo(w,h);x.closePath();
  var hg=x.createLinearGradient(0,y0-amp,0,h);hg.addColorStop(0,sc.h[L]);hg.addColorStop(1,L<3?sc.h[L+1]:'#000');x.fillStyle=hg;x.fill();
  if(L<3){var fg=x.createLinearGradient(0,y0-amp,0,y0+h*.12);fg.addColorStop(0,'rgba(255,255,255,.13)');fg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=fg;x.fill()}}
 for(var n=0;n<Math.round(w*h/90);n++){x.fillStyle=rnd()<.5?'rgba(255,255,255,.035)':'rgba(0,0,0,.05)';x.fillRect(rnd()*w,rnd()*h,1,1)}
 ARTCACHE[key]=c;return c}
function artURL(i,w,h){var c=art(i,w,h);if(!c.u)c.u=c.toDataURL('image/jpeg',.88);return c.u}
var NAMES=['Dusk','Glacier','Mesa','Night','Mint','Neon','Tide','Lilac'];
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,pos=50,touched=false,drag=false,raf=0,visible=true,btns=[],scenes=[0,2,5];
function set(p){pos=Math.max(0,Math.min(100,p));stage.style.setProperty('--p',pos.toFixed(2)+'%');range.value=Math.round(pos)}
function scene(n){var url='url('+artURL(scenes[n],800,380)+')';after.style.backgroundImage=url;before.style.backgroundImage=url;btns.forEach(function(b,i){b.setAttribute('aria-pressed',String(i===n))})}
scenes.forEach(function(s,i){var b=document.createElement('button');b.type='button';b.className='cp-tab';b.textContent=NAMES[s];b.addEventListener('click',function(){scene(i)});tabs.appendChild(b);btns.push(b)});
function frame(now){raf=0;if(!touched&&!drag)set(50+25*Math.sin(now/1500));if(visible&&!reduce)raf=requestAnimationFrame(frame)}
function go(){if(!raf&&visible&&!reduce)raf=requestAnimationFrame(frame)}
function at(e){var r=stage.getBoundingClientRect();set((e.clientX-r.left)/r.width*100)}
stage.addEventListener('pointerdown',function(e){drag=true;touched=true;at(e);try{stage.setPointerCapture(e.pointerId)}catch(_){}});
stage.addEventListener('pointermove',function(e){if(drag)at(e)});
function up(){drag=false}stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
range.addEventListener('input',function(){touched=true;set(+range.value)});
if('IntersectionObserver' in window)new IntersectionObserver(function(es){visible=es[0].isIntersecting;go()}).observe(root);
scene(0);set(50);go();})();
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
