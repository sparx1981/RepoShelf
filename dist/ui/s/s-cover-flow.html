<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cover flow preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,780px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.cv{position:relative;height:390px;border:1px solid var(--sc-line);border-radius:28px;background:radial-gradient(120% 90% at 50% 20%,color-mix(in srgb,var(--sc-accent) 14%,var(--sc-surface)),var(--sc-surface));overflow:hidden;cursor:grab;user-select:none;touch-action:pan-y}
.cv-s{position:absolute;inset:0 0 54px;perspective:1100px;perspective-origin:50% 40%}
.cv-c{position:absolute;left:50%;top:36px;width:170px;height:220px;margin-left:-85px;transform-style:preserve-3d;will-change:transform}
.cv-f,.cv-r{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:12px;background-size:cover;background-position:center}
.cv-f{box-shadow:0 18px 30px -14px rgba(0,0,0,.55)}
.cv-r{top:100%;margin-top:4px;transform:scaleY(-1);opacity:.4;-webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.7),transparent 55%);mask-image:linear-gradient(to top,rgba(0,0,0,.7),transparent 55%)}
.cv-cap{z-index:500;position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:10px;align-items:baseline;font:700 17px/1 system-ui;color:var(--sc-fg)}
.cv-cap small{font:600 12px/1 ui-monospace,monospace;color:var(--sc-muted)}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="cv" tabindex="0" role="region" aria-label="Cover flow: drag, click a card or use the arrow keys"><div class="cv-s"></div><div class="cv-cap" aria-live="polite"></div></div>
</div>
<script>
(function(){var root=document.currentScript.previousElementSibling.querySelector('.cv'),stage=root.querySelector('.cv-s'),cap=root.querySelector('.cv-cap');
var SCENES=[
{s:['#2b1055','#d6457f','#ffb36b'],u:[.68,.6,.11,'#fff1c0'],h:['#8a2f78','#56206a','#2f1450','#170b2c'],st:0},
{s:['#0b1b3a','#2b6cb0','#a6dcff'],u:[.28,.3,.06,'#ffffff'],h:['#7fb0d4','#4a7ba3','#274b6b','#12273d'],st:0},
{s:['#ffd9a0','#ff9a5a','#d24a43'],u:[.5,.56,.14,'#fff6d8'],h:['#bd4b33','#8c3029','#5c1d29','#300f21'],st:0},
{s:['#06122a','#12305a','#40306f'],u:[.78,.22,.05,'#f5f1ff'],h:['#21405f','#14304a','#0c1f36','#050e1c'],st:1},
{s:['#c4f6dc','#82e2b8','#2fa583'],u:[.3,.28,.09,'#ffffff'],h:['#41b98d','#2b9370','#17664d','#0b402f'],st:0},
{s:['#1a0b2e','#6a1b9a','#ff4fa8'],u:[.5,.5,.12,'#ffe0f3'],h:['#44186e','#2a1250','#170a34','#0a061a'],st:1},
{s:['#0c2429','#1a5a56','#7adcc8'],u:[.72,.34,.07,'#eafff9'],h:['#318e84','#1d625c','#103c40','#06202a'],st:1},
{s:['#fbe6ff','#d8abff','#8d7cff'],u:[.24,.4,.1,'#fffbe8'],h:['#a284ff','#6f58db','#4535a6','#271c63'],st:0}];
var ARTCACHE={};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function art(i,w,h){var key=i+'/'+w+'/'+h;if(ARTCACHE[key])return ARTCACHE[key];var sc=SCENES[((i%8)+8)%8],c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d'),rnd=mulberry(i*7919+13);
 var g=x.createLinearGradient(0,0,0,h*.8);g.addColorStop(0,sc.s[0]);g.addColorStop(.55,sc.s[1]);g.addColorStop(1,sc.s[2]);x.fillStyle=g;x.fillRect(0,0,w,h);
 if(sc.st){for(var k=0;k<90;k++){x.fillStyle='rgba(255,255,255,'+(.25+rnd()*.6)+')';var r=rnd()*1.4+.3;x.beginPath();x.arc(rnd()*w,rnd()*h*.55,r,0,6.283);x.fill()}}
 var ux=sc.u[0]*w,uy=sc.u[1]*h,ur=sc.u[2]*Math.min(w,h),gl=x.createRadialGradient(ux,uy,ur*.2,ux,uy,ur*4.2);gl.addColorStop(0,sc.u[3]+'cc');gl.addColorStop(1,sc.u[3]+'00');x.fillStyle=gl;x.fillRect(0,0,w,h);x.fillStyle=sc.u[3];x.beginPath();x.arc(ux,uy,ur,0,6.283);x.fill();
 for(var L=0;L<4;L++){var y0=h*(.5+L*.11),amp=h*(.07-L*.008),p1=rnd()*6,p2=rnd()*6,p3=rnd()*6,f1=2.2+rnd()*1.4,f2=5+rnd()*3,f3=11+rnd()*5;x.beginPath();x.moveTo(0,h);for(var px=0;px<=w+3;px+=3){var t=px/w;x.lineTo(px,y0+Math.sin(t*f1+p1)*amp+Math.sin(t*f2+p2)*amp*.45+Math.sin(t*f3+p3)*amp*.18)}x.lineTo(w,h);x.closePath();
  var hg=x.createLinearGradient(0,y0-amp,0,h);hg.addColorStop(0,sc.h[L]);hg.addColorStop(1,L<3?sc.h[L+1]:'#000');x.fillStyle=hg;x.fill();
  if(L<3){var fg=x.createLinearGradient(0,y0-amp,0,y0+h*.12);fg.addColorStop(0,'rgba(255,255,255,.13)');fg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=fg;x.fill()}}
 for(var n=0;n<Math.round(w*h/90);n++){x.fillStyle=rnd()<.5?'rgba(255,255,255,.035)':'rgba(0,0,0,.05)';x.fillRect(rnd()*w,rnd()*h,1,1)}
 ARTCACHE[key]=c;return c}
function artURL(i,w,h){var c=art(i,w,h);if(!c.u)c.u=c.toDataURL('image/jpeg',.88);return c.u}
var NAMES=['Dusk','Glacier','Mesa','Night','Mint','Neon','Tide','Lilac'];
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,N=8,cur=0,vel=0,target=0,C=[],raf=0,visible=true,auto=!reduce,drag=false,lx=0,moved=0,t0=0,shown=-1,resume=0;
for(var i=0;i<N;i++){var c=document.createElement('div');c.className='cv-c';var u='url('+artURL(i,170,220)+')',f=document.createElement('div');f.className='cv-f';f.style.backgroundImage=u;var r=document.createElement('div');r.className='cv-r';r.style.backgroundImage=u;c.appendChild(f);c.appendChild(r);stage.appendChild(c);C.push(c);(function(k,el){el.addEventListener('click',function(){if(moved>6)return;touch();target=k})})(i,c)}
function touch(){auto=false;clearTimeout(resume);if(!reduce)resume=setTimeout(function(){auto=true},5000)}
function lay(){C.forEach(function(c,i){var d=((i-cur)%N+N+N/2)%N-N/2,t=Math.max(-1,Math.min(1,d)),x=d*58+t*120,z=-Math.abs(t)*150-Math.max(0,Math.abs(d)-1)*24;c.style.transform='translateX('+x.toFixed(1)+'px) translateZ('+z.toFixed(1)+'px) rotateY('+(-t*56).toFixed(1)+'deg)';c.style.zIndex=String(100-Math.round(Math.abs(d)*10));c.style.opacity=String(Math.max(0,1-Math.max(0,Math.abs(d)-3.2)*.8))});
 var n=((Math.round(cur)%N)+N)%N;if(n!==shown){shown=n;cap.textContent='';var a=document.createElement('span');a.textContent=NAMES[n];var b=document.createElement('small');b.textContent=(n+1)+' / '+N;cap.appendChild(a);cap.appendChild(b)}}
function frame(now){raf=0;if(auto&&now-t0>2400){t0=now;target=Math.round(target)+1}
 if(reduce){cur=target}else{vel+=(target-cur)*.1;vel*=.78;cur+=vel}
 if(Math.abs(target-cur)<.0005&&Math.abs(vel)<.0005)cur=target;lay();if(visible&&(!reduce||Math.abs(target-cur)>.001||true))raf=requestAnimationFrame(frame);if(reduce&&!auto&&Math.abs(target-cur)<.001){raf=0}}
function go(){if(!raf&&visible)raf=requestAnimationFrame(frame)}
root.addEventListener('pointerdown',function(e){drag=true;lx=e.clientX;moved=0;touch();root.style.cursor='grabbing';go()});
root.addEventListener('pointermove',function(e){if(!drag)return;var dx=e.clientX-lx;lx=e.clientX;moved+=Math.abs(dx);target-=dx/70;go()});
function up(){if(drag){drag=false;root.style.cursor='';target=Math.round(target)}}root.addEventListener('pointerup',up);root.addEventListener('pointercancel',up);root.addEventListener('pointerleave',up);
root.addEventListener('keydown',function(e){if(e.key==='ArrowRight'){e.preventDefault();touch();target=Math.round(target)+1;go()}if(e.key==='ArrowLeft'){e.preventDefault();touch();target=Math.round(target)-1;go()}});
if('IntersectionObserver' in window)new IntersectionObserver(function(es){visible=es[0].isIntersecting;go()}).observe(root);
lay();go();})();
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
