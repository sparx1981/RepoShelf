<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peel sticker preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,560px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.ps2{display:grid;gap:18px;justify-items:center;padding:44px 20px 26px;border:1px solid var(--sc-line);border-radius:28px;background:var(--sc-surface)}
.ps2-sheet{position:relative;width:250px;height:250px;padding:10px;border-radius:14px;background:repeating-linear-gradient(135deg,var(--sc-surface) 0 8px,var(--sc-bg) 8px 16px);border:1px dashed var(--sc-line)}
.ps2-s{position:absolute;left:10px;top:10px;width:230px;height:230px;transition:transform .6s cubic-bezier(.4,0,.2,1),opacity .5s}
.ps2-s.off{transform:translate(70px,-90px) rotate(24deg);opacity:0;pointer-events:none}
.ps2-main,.ps2-fold{position:absolute;inset:0}
.ps2-main{background-size:cover;background-position:center;border-radius:16px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.ps2-cap{position:absolute;left:16px;top:16px;color:#fff;font:900 30px/.95 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.03em;text-shadow:0 2px 10px rgba(0,0,0,.4);pointer-events:none}
.ps2-fold{background:linear-gradient(135deg,#fffdf6 0%,#e8e2d2 100%);filter:drop-shadow(-4px -4px 7px rgba(0,0,0,.35));cursor:grab}
.ps2-hit{position:absolute;right:0;bottom:0;width:70px;height:70px;cursor:grab;touch-action:none;z-index:5}
.ps2-btn{padding:8px 16px;border:1px solid var(--sc-line);border-radius:999px;background:var(--sc-bg);cursor:pointer;font-size:13px;font-weight:600}
.ps2-btn:hover{border-color:var(--sc-accent)}
.ps2-btn[hidden]{display:none}
.ps2-note{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--sc-muted)}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="ps2"><div class="ps2-sheet"><div class="ps2-s" role="img" aria-label="A peelable sticker that reads Hello, world"><div class="ps2-main"></div><div class="ps2-fold"></div><div class="ps2-cap">Hello,<br>world</div><div class="ps2-hit"></div></div></div><p class="ps2-note">Drag the corner to peel</p><button class="ps2-btn" type="button" hidden>Stick it back</button></div>
</div>
<script>
(function(){var root=document.currentScript.previousElementSibling.querySelector('.ps2'),s=root.querySelector('.ps2-s'),main=root.querySelector('.ps2-main'),fold=root.querySelector('.ps2-fold'),hit=root.querySelector('.ps2-hit'),btn=root.querySelector('.ps2-btn');
var SCENES=[
{s:['#2b1055','#d6457f','#ffb36b'],u:[.68,.6,.11,'#fff1c0'],h:['#8a2f78','#56206a','#2f1450','#170b2c'],st:0},
{s:['#0b1b3a','#2b6cb0','#a6dcff'],u:[.28,.3,.06,'#ffffff'],h:['#7fb0d4','#4a7ba3','#274b6b','#12273d'],st:0},
{s:['#ffd9a0','#ff9a5a','#d24a43'],u:[.5,.56,.14,'#fff6d8'],h:['#bd4b33','#8c3029','#5c1d29','#300f21'],st:0},
{s:['#06122a','#12305a','#40306f'],u:[.78,.22,.05,'#f5f1ff'],h:['#21405f','#14304a','#0c1f36','#050e1c'],st:1},
{s:['#c4f6dc','#82e2b8','#2fa583'],u:[.3,.28,.09,'#ffffff'],h:['#41b98d','#2b9370','#17664d','#0b402f'],st:0},
{s:['#1a0b2e','#6a1b9a','#ff4fa8'],u:[.5,.5,.12,'#ffe0f3'],h:['#44186e','#2a1250','#170a34','#0a061a'],st:1},
{s:['#0c2429','#1a5a56','#7adcc8'],u:[.72,.34,.07,'#eafff9'],h:['#318e84','#1d625c','#103c40','#06202a'],st:1},
{s:['#fbe6ff','#d8abff','#8d7cff'],u:[.24,.4,.1,'#fffbe8'],h:['#a284ff','#6f58db','#4535a6','#271c63'],st:0}];
var ARTCACHE={};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function art(i,w,h){var key=i+'/'+w+'/'+h;if(ARTCACHE[key])return ARTCACHE[key];var sc=SCENES[((i%8)+8)%8],c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d'),rnd=mulberry(i*7919+13);
 var g=x.createLinearGradient(0,0,0,h*.8);g.addColorStop(0,sc.s[0]);g.addColorStop(.55,sc.s[1]);g.addColorStop(1,sc.s[2]);x.fillStyle=g;x.fillRect(0,0,w,h);
 if(sc.st){for(var k=0;k<90;k++){x.fillStyle='rgba(255,255,255,'+(.25+rnd()*.6)+')';var r=rnd()*1.4+.3;x.beginPath();x.arc(rnd()*w,rnd()*h*.55,r,0,6.283);x.fill()}}
 var ux=sc.u[0]*w,uy=sc.u[1]*h,ur=sc.u[2]*Math.min(w,h),gl=x.createRadialGradient(ux,uy,ur*.2,ux,uy,ur*4.2);gl.addColorStop(0,sc.u[3]+'cc');gl.addColorStop(1,sc.u[3]+'00');x.fillStyle=gl;x.fillRect(0,0,w,h);x.fillStyle=sc.u[3];x.beginPath();x.arc(ux,uy,ur,0,6.283);x.fill();
 for(var L=0;L<4;L++){var y0=h*(.5+L*.11),amp=h*(.07-L*.008),p1=rnd()*6,p2=rnd()*6,p3=rnd()*6,f1=2.2+rnd()*1.4,f2=5+rnd()*3,f3=11+rnd()*5;x.beginPath();x.moveTo(0,h);for(var px=0;px<=w+3;px+=3){var t=px/w;x.lineTo(px,y0+Math.sin(t*f1+p1)*amp+Math.sin(t*f2+p2)*amp*.45+Math.sin(t*f3+p3)*amp*.18)}x.lineTo(w,h);x.closePath();
  var hg=x.createLinearGradient(0,y0-amp,0,h);hg.addColorStop(0,sc.h[L]);hg.addColorStop(1,L<3?sc.h[L+1]:'#000');x.fillStyle=hg;x.fill();
  if(L<3){var fg=x.createLinearGradient(0,y0-amp,0,y0+h*.12);fg.addColorStop(0,'rgba(255,255,255,.13)');fg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=fg;x.fill()}}
 for(var n=0;n<Math.round(w*h/90);n++){x.fillStyle=rnd()<.5?'rgba(255,255,255,.035)':'rgba(0,0,0,.05)';x.fillRect(rnd()*w,rnd()*h,1,1)}
 ARTCACHE[key]=c;return c}
function artURL(i,w,h){var c=art(i,w,h);if(!c.u)c.u=c.toDataURL('image/jpeg',.88);return c.u}
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,S=230,c=2*S,tc=2*S,drag=false,raf=0;main.style.backgroundImage='url('+artURL(5,230,230)+')';
function poly(c){var a=c-S;if(c>=2*S-.5)return {m:'none',f:'polygon(0 0,0 0,0 0)'};return {m:'polygon(0 0,'+S+'px 0,'+S+'px '+a+'px,'+a+'px '+S+'px,0 '+S+'px)',f:'polygon('+S+'px '+a+'px,'+a+'px '+S+'px,'+a+'px '+a+'px)'}}
function paint(){var p=poly(c);main.style.clipPath=p.m==='none'?'none':p.m;fold.style.clipPath=p.f;fold.style.display=c>=2*S-.5?'none':'block'}
function frame(){raf=0;if(drag){c=tc}else{c+=(tc-c)*(reduce?1:.18);if(Math.abs(tc-c)<.3)c=tc}paint();if(drag||c!==tc)raf=requestAnimationFrame(frame)}
function kick(){if(!raf)raf=requestAnimationFrame(frame)}
hit.addEventListener('pointerdown',function(e){drag=true;try{hit.setPointerCapture(e.pointerId)}catch(_){}kick()});
hit.addEventListener('pointermove',function(e){if(!drag)return;var r=s.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;tc=Math.max(S+12,Math.min(2*S,S+(px+py)/2));c=tc});
function up(){if(!drag)return;drag=false;if(c<1.45*S){s.classList.add('off');btn.hidden=false;tc=2*S;c=2*S;paint()}else tc=2*S;kick()}
hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
btn.addEventListener('click',function(){s.classList.remove('off');btn.hidden=true});
paint();})();
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
