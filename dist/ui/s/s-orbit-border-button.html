<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbiting border button preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,520px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
@property --sc-angle{syntax:"<angle>";initial-value:0deg;inherits:false}
.ob{display:grid;gap:22px;justify-items:center}
.ob-ring{position:relative;border-radius:16px;isolation:isolate}
.ob-ring::before{content:"";position:absolute;inset:0;padding:2px;border-radius:inherit;background:conic-gradient(from var(--sc-angle),transparent 0 70%,var(--sc-accent) 85%,#22d3ee 95%,transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:ob-spin 3.2s linear infinite;z-index:1}
.ob-ring::after{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid var(--sc-line);z-index:0}
@keyframes ob-spin{to{--sc-angle:360deg}}
.ob-btn{position:relative;z-index:2;display:block;padding:14px 30px;border:0;border-radius:inherit;background:var(--sc-surface);cursor:pointer;font-weight:600}
.ob-card{position:relative;z-index:2;padding:22px 26px;border-radius:inherit;background:var(--sc-surface);max-width:320px}.ob-card h3{margin:0 0 4px;font-size:17px}.ob-card p{margin:0;color:var(--sc-muted);font-size:14px}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="ob"><div class="ob-ring"><button class="ob-btn">Start free trial</button></div><div class="ob-ring" style="border-radius:20px"><div class="ob-card"><h3>Pro plan</h3><p>Everything in Free, plus unlimited projects and priority support.</p></div></div></div>
</div>
<script>
/* Pure CSS component: no script required. */
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
