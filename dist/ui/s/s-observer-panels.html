<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Input-driven panels preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,780px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.op{position:relative;height:430px;border-radius:28px;overflow:hidden;background:#0b0b10;border:1px solid var(--sc-line);touch-action:none}
.op-p{position:absolute;inset:0;clip-path:inset(0 0 0 0);color:#fff;overflow:hidden}
.op-bg{position:absolute;left:0;right:0;top:-12%;bottom:-12%;background-size:cover;background-position:center}
.op-p::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.6))}
.op-txt{position:absolute;left:34px;bottom:38px;z-index:2;max-width:420px}
.op-n{display:block;margin-bottom:10px;font:700 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.2em}
.op-h{margin:0;font:900 48px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.04em;overflow:hidden}
.op-h span{display:inline-block;transform:translateY(110%);transition:transform .7s cubic-bezier(.3,.9,.3,1)}
.op-p.on .op-h span{transform:none;transition-delay:calc(.35s + var(--w)*70ms)}
.op-t{margin:10px 0 0;font-size:15px;opacity:.9}
.op-rail{position:absolute;right:18px;top:50%;z-index:5;display:grid;gap:10px;transform:translateY(-50%)}
.op-dot{width:10px;height:10px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.4);cursor:pointer;transition:transform .3s,background .3s}
.op-dot[aria-current=true]{background:#fff;transform:scale(1.5)}
.op-hint{position:absolute;left:0;right:0;top:14px;z-index:5;margin:0;text-align:center;font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.75);pointer-events:none}
@media (prefers-reduced-motion:reduce){.op-h span{transition:none}}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">

</div>
