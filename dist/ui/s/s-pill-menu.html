<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Morphing menu pill preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,640px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.pm{position:relative;height:420px;border:1px solid var(--sc-line);border-radius:28px;background:linear-gradient(135deg,var(--sc-ring),transparent 60%),var(--sc-surface);overflow:hidden}
.pm-hero{position:absolute;left:30px;top:44px;margin:0;max-width:300px;font:800 40px/1.05 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.03em}
.pm-hero small{display:block;margin-top:12px;font:500 15px/1.5 system-ui;letter-spacing:0;color:var(--sc-muted)}
.pm-box{position:absolute;right:16px;top:16px;z-index:5;width:110px;height:44px;border-radius:22px;background:#0d0d12;color:#fff;overflow:hidden;transition:width .6s cubic-bezier(.3,.9,.2,1),height .6s cubic-bezier(.3,.9,.2,1),border-radius .6s;box-shadow:0 18px 36px -14px rgba(0,0,0,.5)}
.pm-box.open{width:min(440px,calc(100% - 32px));height:330px;border-radius:26px}
.pm-head{position:absolute;left:0;top:0;width:110px;height:44px;border:0;background:transparent;color:inherit;cursor:pointer;font:700 14px/1 system-ui;display:flex;align-items:center;justify-content:center;gap:8px}
.pm-lab{position:relative;display:block;height:16px;overflow:hidden;width:44px;text-align:left}
.pm-lab span{display:block;line-height:16px;transition:transform .4s cubic-bezier(.3,.9,.3,1)}
.pm-box.open .pm-lab span{transform:translateY(-16px)}
.pm-bars{display:grid;gap:4px}.pm-bars i{display:block;width:16px;height:2px;border-radius:2px;background:#fff;transition:transform .4s}
.pm-box.open .pm-bars i:first-child{transform:translateY(3px) rotate(45deg)}.pm-box.open .pm-bars i:last-child{transform:translateY(-3px) rotate(-45deg)}
.pm-nav{position:absolute;left:28px;top:70px;display:grid;gap:2px}
.pm-link{display:block;color:#fff;text-decoration:none;font:800 40px/1.12 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.03em;overflow:hidden;height:1.12em}
.pm-roll{display:block;transition:transform .45s cubic-bezier(.3,.9,.3,1)}
.pm-link:hover .pm-roll,.pm-link:focus-visible .pm-roll{transform:translateY(-100%)}
.pm-line{display:block;white-space:nowrap}
.pm-line i{display:inline-block;font-style:normal;transform:translateY(110%);transition:transform .55s cubic-bezier(.3,.9,.3,1);transition-delay:0s}
.pm-box.open .pm-line i{transform:none;transition-delay:calc(.28s + var(--l)*40ms + var(--i)*22ms)}
.pm-line.b i{color:hsl(262 90% 78%)}
.pm-img{position:absolute;right:22px;bottom:22px;width:130px;height:170px;border-radius:16px;background-size:cover;background-position:center;opacity:0;transform:scale(.9);transition:opacity .4s,transform .5s cubic-bezier(.3,.9,.3,1)}
.pm-box.open .pm-img{opacity:1;transform:none;transition-delay:.35s}
.pm-box:not(.open) .pm-nav{visibility:hidden;transition:visibility 0s .6s}
@media (prefers-reduced-motion:reduce){.pm-box,.pm-line i,.pm-lab span,.pm-img,.pm-roll,.pm-bars i{transition:none}}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="pm"><h2 class="pm-hero">Make things worth opening.<small>An independent design studio for brands, products and film.</small></h2><div class="pm-box"><button class="pm-head" type="button" aria-expanded="false" aria-controls="pm-nav"><span class="pm-lab"><span>Menu</span><span>Close</span></span><span class="pm-bars" aria-hidden="true"><i></i><i></i></span></button><nav class="pm-nav" id="pm-nav" aria-label="Main"></nav><div class="pm-img" aria-hidden="true"></div></div></div>
</div>
<script>
(function(){var root=document.currentScript.previousElementSibling.querySelector('.pm'),box=root.querySelector('.pm-box'),btn=root.querySelector('.pm-head'),nav=root.querySelector('.pm-nav'),img=root.querySelector('.pm-img');
var SCENES=[
{s:['#2b1055','#d6457f','#ffb36b'],u:[.68,.6,.11,'#fff1c0'],h:['#8a2f78','#56206a','#2f1450','#170b2c'],st:0},
{s:['#0b1b3a','#2b6cb0','#a6dcff'],u:[.28,.3,.06,'#ffffff'],h:['#7fb0d4','#4a7ba3','#274b6b','#12273d'],st:0},
{s:['#ffd9a0','#ff9a5a','#d24a43'],u:[.5,.56,.14,'#fff6d8'],h:['#bd4b33','#8c3029','#5c1d29','#300f21'],st:0},
{s:['#06122a','#12305a','#40306f'],u:[.78,.22,.05,'#f5f1ff'],h:['#21405f','#14304a','#0c1f36','#050e1c'],st:1},
{s:['#c4f6dc','#82e2b8','#2fa583'],u:[.3,.28,.09,'#ffffff'],h:['#41b98d','#2b9370','#17664d','#0b402f'],st:0},
{s:['#1a0b2e','#6a1b9a','#ff4fa8'],u:[.5,.5,.12,'#ffe0f3'],h:['#44186e','#2a1250','#170a34','#0a061a'],st:1},
{s:['#0c2429','#1a5a56','#7adcc8'],u:[.72,.34,.07,'#eafff9'],h:['#318e84','#1d625c','#103c40','#06202a'],st:1},
{s:['#fbe6ff','#d8abff','#8d7cff'],u:[.24,.4,.1,'#fffbe8'],h:['#a284ff','#6f58db','#4535a6','#271c63'],st:0}];
var ARTCACHE={};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function art(i,w,h){var key=i+'/'+w+'/'+h;if(ARTCACHE[key])return ARTCACHE[key];var sc=SCENES[((i%8)+8)%8],c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d'),rnd=mulberry(i*7919+13);
 var g=x.createLinearGradient(0,0,0,h*.8);g.addColorStop(0,sc.s[0]);g.addColorStop(.55,sc.s[1]);g.addColorStop(1,sc.s[2]);x.fillStyle=g;x.fillRect(0,0,w,h);
 if(sc.st){for(var k=0;k<90;k++){x.fillStyle='rgba(255,255,255,'+(.25+rnd()*.6)+')';var r=rnd()*1.4+.3;x.beginPath();x.arc(rnd()*w,rnd()*h*.55,r,0,6.283);x.fill()}}
 var ux=sc.u[0]*w,uy=sc.u[1]*h,ur=sc.u[2]*Math.min(w,h),gl=x.createRadialGradient(ux,uy,ur*.2,ux,uy,ur*4.2);gl.addColorStop(0,sc.u[3]+'cc');gl.addColorStop(1,sc.u[3]+'00');x.fillStyle=gl;x.fillRect(0,0,w,h);x.fillStyle=sc.u[3];x.beginPath();x.arc(ux,uy,ur,0,6.283);x.fill();
 for(var L=0;L<4;L++){var y0=h*(.5+L*.11),amp=h*(.07-L*.008),p1=rnd()*6,p2=rnd()*6,p3=rnd()*6,f1=2.2+rnd()*1.4,f2=5+rnd()*3,f3=11+rnd()*5;x.beginPath();x.moveTo(0,h);for(var px=0;px<=w+3;px+=3){var t=px/w;x.lineTo(px,y0+Math.sin(t*f1+p1)*amp+Math.sin(t*f2+p2)*amp*.45+Math.sin(t*f3+p3)*amp*.18)}x.lineTo(w,h);x.closePath();
  var hg=x.createLinearGradient(0,y0-amp,0,h);hg.addColorStop(0,sc.h[L]);hg.addColorStop(1,L<3?sc.h[L+1]:'#000');x.fillStyle=hg;x.fill();
  if(L<3){var fg=x.createLinearGradient(0,y0-amp,0,y0+h*.12);fg.addColorStop(0,'rgba(255,255,255,.13)');fg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=fg;x.fill()}}
 for(var n=0;n<Math.round(w*h/90);n++){x.fillStyle=rnd()<.5?'rgba(255,255,255,.035)':'rgba(0,0,0,.05)';x.fillRect(rnd()*w,rnd()*h,1,1)}
 ARTCACHE[key]=c;return c}
function artURL(i,w,h){var c=art(i,w,h);if(!c.u)c.u=c.toDataURL('image/jpeg',.88);return c.u}
var links=['Work','Studio','Journal','Contact'],ids=[0,2,5,6];
function line(txt,cls,li){var s=document.createElement('span');s.className='pm-line '+cls;s.style.setProperty('--l',li);for(var i=0;i<txt.length;i++){var c=document.createElement('i');c.style.setProperty('--i',i);c.textContent=txt.charAt(i);s.appendChild(c)}return s}
links.forEach(function(t,i){var a=document.createElement('a');a.className='pm-link';a.href='#';a.addEventListener('click',function(e){e.preventDefault()});var r=document.createElement('span');r.className='pm-roll';r.appendChild(line(t,'a',i));r.appendChild(line(t,'b',i));a.appendChild(r);a.setAttribute('aria-label',t);a.tabIndex=-1;nav.appendChild(a);a.addEventListener('pointerenter',function(){img.style.backgroundImage='url('+artURL(ids[i],130,170)+')'});a.addEventListener('focus',function(){img.style.backgroundImage='url('+artURL(ids[i],130,170)+')'})});
img.style.backgroundImage='url('+artURL(ids[0],130,170)+')';
function set(o){box.classList.toggle('open',o);btn.setAttribute('aria-expanded',String(o));nav.querySelectorAll('a').forEach(function(a){a.tabIndex=o?0:-1});if(!o)btn.focus()}
btn.addEventListener('click',function(){set(!box.classList.contains('open'))});root.addEventListener('keydown',function(e){if(e.key==='Escape'&&box.classList.contains('open'))set(false)});
var auto=setInterval(function(){if(!root.matches(':hover')&&!root.contains(document.activeElement)){box.classList.toggle('open');btn.setAttribute('aria-expanded',String(box.classList.contains('open')))}},3600);root.addEventListener('pointerenter',function(){clearInterval(auto)});root.addEventListener('focusin',function(){clearInterval(auto)});})();
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
