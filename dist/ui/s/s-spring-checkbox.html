<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spring checkbox preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,460px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.sk{display:grid;gap:10px}
.sk label{display:flex;align-items:center;gap:14px;padding:14px 18px;border:1px solid var(--sc-line);border-radius:14px;background:var(--sc-surface);cursor:pointer}
.sk input{position:absolute;opacity:0;pointer-events:none}
.sk-box{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;border:2px solid var(--sc-line);background:var(--sc-bg);transition:background .2s,border-color .2s}
.sk-box svg{width:16px;height:16px;fill:none;stroke:var(--sc-accent-fg);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .3s .08s}
.sk input:checked+.sk-box{background:var(--sc-accent);border-color:var(--sc-accent);animation:sk-pop .45s cubic-bezier(.3,1.6,.5,1)}
.sk input:checked+.sk-box svg{stroke-dashoffset:0}
.sk input:focus-visible+.sk-box{outline:2px solid var(--sc-accent);outline-offset:3px}
.sk-text{position:relative;transition:color .3s}
.sk-text::after{content:"";position:absolute;left:0;top:55%;height:2px;width:100%;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .35s}
.sk input:checked~.sk-text{color:var(--sc-muted)}.sk input:checked~.sk-text::after{transform:scaleX(1)}
@keyframes sk-pop{0%{transform:scale(.8)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="sk"><label><input type="checkbox" checked><span class="sk-box"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="sk-text">Plan the launch</span></label><label><input type="checkbox"><span class="sk-box"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="sk-text">Write the announcement</span></label><label><input type="checkbox"><span class="sk-box"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="sk-text">Ship it</span></label></div>
</div>
<script>
/* Pure CSS component: no script required. */
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
