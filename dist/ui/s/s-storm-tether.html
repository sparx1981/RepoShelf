<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Storm tether preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,780px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.st{position:relative;height:380px;border:1px solid #1b2030;border-radius:28px;background:radial-gradient(ellipse at 20% 50%,#101a33,#05070f 70%);overflow:hidden;cursor:crosshair;touch-action:pan-y}
.st canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.st-hint{position:absolute;left:0;right:0;bottom:14px;margin:0;text-align:center;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6d7aa0;pointer-events:none}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="st"><canvas aria-hidden="true"></canvas><p class="st-hint">Move to conduct · click to overcharge</p></div>
</div>
<script>
(function(){var root=document.currentScript.previousElementSibling.querySelector('.st'),cv=root.querySelector('canvas');
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function Stage(root,cv,draw,resize){
 var s={W:0,H:0,dpr:1,x:0,y:0,vx:0,vy:0,px:0,py:0,inside:false,down:false,t:0,dt:16,ctx:cv.getContext('2d'),click:null,first:true},raf=0,visible=true,last=0,until=0;
 function size(){s.dpr=Math.min(2,window.devicePixelRatio||1);s.W=cv.clientWidth;s.H=cv.clientHeight;cv.width=Math.round(s.W*s.dpr);cv.height=Math.round(s.H*s.dpr);s.ctx.setTransform(s.dpr,0,0,s.dpr,0,0);if(resize)resize(s);s.first=true}
 function frame(now){raf=0;s.dt=Math.min(48,now-(last||now-16));last=now;s.t=now;var tx,ty;
  if(s.inside){tx=s.px;ty=s.py}else{tx=s.W*(.5+.34*Math.sin(now*.00071)+.1*Math.sin(now*.0023));ty=s.H*(.5+.3*Math.sin(now*.00097+1)+.08*Math.cos(now*.0021))}
  if(s.first){s.x=tx;s.y=ty;s.first=false}
  s.vx=tx-s.x;s.vy=ty-s.y;s.x=tx;s.y=ty;draw(s);
  if(visible&&(!reduce||now<until))raf=requestAnimationFrame(frame)}
 function go(){if(!raf&&visible){last=0;raf=requestAnimationFrame(frame)}}
 function poke(){until=performance.now()+900;go()}
 function at(e){var r=cv.getBoundingClientRect();s.px=e.clientX-r.left;s.py=e.clientY-r.top;s.inside=true}
 root.addEventListener('pointermove',function(e){at(e);if(reduce)poke()});
 root.addEventListener('pointerleave',function(){s.inside=false;s.down=false});
 root.addEventListener('pointerdown',function(e){at(e);s.down=true;if(s.click)s.click(s.px,s.py);if(reduce)poke()});
 root.addEventListener('pointerup',function(){s.down=false});
 if('IntersectionObserver' in window)new IntersectionObserver(function(es){visible=es[0].isIntersecting;if(visible)go()}).observe(root);
 if('ResizeObserver' in window){var lw=0;new ResizeObserver(function(){if(cv.clientWidth&&cv.clientWidth!==lw){lw=cv.clientWidth;size();go()}}).observe(cv)}else{size();go()}
 if(!reduce)go();else poke();
 return s}
var flash=0,burst=[],lastGen=0,cache=[];
function bolt(ax,ay,bx,by,depth,spread){var pts=[[ax,ay],[bx,by]];for(var d=0;d<depth;d++){var np=[pts[0]];for(var i=0;i<pts.length-1;i++){var a=pts[i],b=pts[i+1],dx=b[0]-a[0],dy=b[1]-a[1],len=Math.sqrt(dx*dx+dy*dy)+.001,off=(Math.random()-.5)*spread/Math.pow(1.85,d);np.push([(a[0]+b[0])/2-dy/len*off,(a[1]+b[1])/2+dx/len*off]);np.push(b)}pts=np}return pts}
function stroke(c,pts,w,col){c.strokeStyle=col;c.lineWidth=w;c.lineJoin='round';c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.stroke()}
function anchors(s){return [[26,s.H*.3],[26,s.H*.7]]}
function gen(s){cache=[];anchors(s).forEach(function(a){var d=Math.hypot(s.x-a[0],s.y-a[1]),main=bolt(a[0],a[1],s.x,s.y,6,Math.min(170,d*.28));cache.push({p:main,w:1});
 for(var f=0;f<3;f++){var o=main[Math.floor(main.length*(.2+Math.random()*.6))],ang=Math.atan2(s.y-a[1],s.x-a[0])+(Math.random()-.5)*2.2,l=40+Math.random()*90;cache.push({p:bolt(o[0],o[1],o[0]+Math.cos(ang)*l,o[1]+Math.sin(ang)*l,4,l*.35),w:.5})}})}
var s=Stage(root,cv,function(s){var c=s.ctx;c.globalCompositeOperation='source-over';c.fillStyle='rgba(5,7,15,.3)';c.fillRect(0,0,s.W,s.H);c.globalCompositeOperation='lighter';
 if(s.t-lastGen>46||!cache.length){lastGen=s.t;gen(s)}
 var fl=flash;flash*=.9;
 cache.forEach(function(b){stroke(c,b.p,9*b.w,'rgba(60,110,255,.07)');stroke(c,b.p,3.4*b.w,'rgba(90,190,255,.4)');stroke(c,b.p,1.3*b.w+.2,'rgba(240,250,255,.95)')});
 burst=burst.filter(function(b){b.life-=1;return b.life>0});
 burst.forEach(function(b){var a=b.life/b.max;stroke(c,b.p,6*a,'rgba(110,180,255,'+(.25*a)+')');stroke(c,b.p,1.6,'rgba(255,255,255,'+a+')')});
 var g=c.createRadialGradient(s.x,s.y,0,s.x,s.y,70+fl*120);g.addColorStop(0,'rgba(170,215,255,'+(.5+fl*.5)+')');g.addColorStop(1,'rgba(60,100,255,0)');c.fillStyle=g;c.fillRect(s.x-190,s.y-190,380,380);
 anchors(s).forEach(function(a){var g2=c.createRadialGradient(a[0],a[1],0,a[0],a[1],26);g2.addColorStop(0,'rgba(200,230,255,.95)');g2.addColorStop(.3,'rgba(90,150,255,.5)');g2.addColorStop(1,'rgba(60,100,255,0)');c.fillStyle=g2;c.fillRect(a[0]-30,a[1]-30,60,60)});
 if(fl>.02){c.fillStyle='rgba(160,200,255,'+(fl*.12)+')';c.fillRect(0,0,s.W,s.H)}});
s.click=function(x,y){flash=1;for(var i=0;i<8;i++){var a=i/8*6.283+Math.random()*.4,l=120+Math.random()*110;burst.push({p:bolt(x,y,x+Math.cos(a)*l,y+Math.sin(a)*l,5,l*.3),life:18,max:18})}};})();
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
