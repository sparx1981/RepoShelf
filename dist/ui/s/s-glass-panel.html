<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frosted glass panel preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,700px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.gl{position:relative;display:grid;place-items:center;min-height:340px;overflow:hidden;border-radius:26px;background:#0f1020}
.gl i{position:absolute;width:260px;height:260px;border-radius:50%;filter:blur(40px);opacity:.9;animation:gl-drift 14s ease-in-out infinite alternate}
.gl i:nth-child(1){background:#6d5ef5;left:6%;top:-8%}.gl i:nth-child(2){background:#22d3ee;right:4%;bottom:-10%;animation-delay:-5s}.gl i:nth-child(3){background:#f472b6;left:38%;top:30%;width:200px;height:200px;animation-delay:-9s}
@keyframes gl-drift{to{transform:translate(50px,-30px) scale(1.15)}}
.gl-panel{position:relative;width:min(88%,360px);padding:26px;border-radius:22px;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 24px 48px -20px rgba(0,0,0,.55);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6)}
@supports not (backdrop-filter:blur(1px)){.gl-panel{background:rgba(30,30,50,.75)}}
.gl-panel h3{margin:0 0 6px;font-size:22px}.gl-panel p{margin:0 0 18px;color:rgba(255,255,255,.82);font-size:14px}
.gl-panel button{padding:10px 18px;border:1px solid rgba(255,255,255,.5);border-radius:999px;background:rgba(255,255,255,.22);color:#fff;cursor:pointer}.gl-panel button:hover{background:rgba(255,255,255,.34)}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="gl"><i></i><i></i><i></i><section class="gl-panel"><h3>Clear as glass</h3><p>Content stays readable while colour moves softly behind it.</p><button>Get started</button></section></div>
</div>
<script>
/* Pure CSS component: no script required. */
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
