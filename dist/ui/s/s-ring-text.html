<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbiting ring text preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,560px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.rt{display:grid;place-items:center;padding:34px;border:1px solid var(--sc-line);border-radius:28px;background:var(--sc-surface);perspective:900px}
.rt-svg{width:min(100%,400px);height:auto;transform-style:preserve-3d;will-change:transform;overflow:visible}
.rt-ring{transform-origin:200px 200px;font:800 21px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--sc-fg)}
.rt-out{animation:rt-spin var(--do,26s) linear infinite}
.rt-in{animation:rt-spin var(--di,18s) linear infinite reverse;font-size:16px;fill:var(--sc-accent)}
.rt-star{transform-origin:200px 200px;animation:rt-spin 9s linear infinite reverse}
.rt-pulse{transform-origin:200px 200px;animation:rt-pulse 3.2s ease-in-out infinite}
@keyframes rt-spin{to{transform:rotate(360deg)}}
@keyframes rt-pulse{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.rt-ring,.rt-star,.rt-pulse{animation:none}}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="rt"><svg class="rt-svg" viewBox="0 0 400 400" role="img" aria-label="Rotating badge reading: design in motion, type that turns"><defs><path id="rt-p1" d="M200,200 m-160,0 a160,160 0 1,1 320,0 a160,160 0 1,1 -320,0"/><path id="rt-p2" d="M200,200 m-118,0 a118,118 0 1,1 236,0 a118,118 0 1,1 -236,0"/><radialGradient id="rt-g" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#ffd6f5"/><stop offset=".35" stop-color="#d36bff"/><stop offset="1" stop-color="#4b2bd6"/></radialGradient></defs><g class="rt-ring rt-out"><text><textPath href="#rt-p1" textLength="1000" lengthAdjust="spacing">DESIGN IN MOTION ✦ TYPE THAT TURNS ✦ LETTERS IN ORBIT ✦ </textPath></text></g><g class="rt-ring rt-in"><text><textPath href="#rt-p2" textLength="736" lengthAdjust="spacing">ROUND AND ROUND ✦ NEVER THE SAME ✦ </textPath></text></g><g class="rt-pulse"><circle cx="200" cy="200" r="58" fill="url(#rt-g)"/></g><g class="rt-star"><path d="M200 168 L207 193 L232 200 L207 207 L200 232 L193 207 L168 200 L193 193 Z" fill="#fff" opacity=".92"/></g></svg></div>
</div>
<script>
(function(){var root=document.currentScript.previousElementSibling.querySelector('.rt'),svg=root.querySelector('.rt-svg');
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,rx=0,ry=0,tx=0,ty=0,raf=0;
function frame(){raf=0;rx+=(tx-rx)*.1;ry+=(ty-ry)*.1;svg.style.transform='rotateX('+rx.toFixed(2)+'deg) rotateY('+ry.toFixed(2)+'deg)';if(Math.abs(tx-rx)>.02||Math.abs(ty-ry)>.02)raf=requestAnimationFrame(frame)}
function kick(){if(!raf&&!reduce)raf=requestAnimationFrame(frame)}
root.addEventListener('pointermove',function(e){var r=root.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;ty=x*32;tx=-y*32;kick()});
root.addEventListener('pointerenter',function(){root.style.setProperty('--do','9s');root.style.setProperty('--di','6s')});
root.addEventListener('pointerleave',function(){tx=ty=0;root.style.removeProperty('--do');root.style.removeProperty('--di');kick()});})();
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
