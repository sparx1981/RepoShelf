<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spotlight cards preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,820px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.spc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.spc-card{position:relative;overflow:hidden;padding:24px;border:1px solid var(--sc-line);border-radius:18px;background:var(--sc-surface)}
.spc-card::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--x,50%) var(--y,50%),var(--sc-ring),transparent 70%);opacity:0;transition:opacity .25s}
.spc-grid:hover .spc-card::before{opacity:1}
.spc-card h3{position:relative;margin:0 0 6px;font-size:17px}
.spc-card p{position:relative;margin:0;color:var(--sc-muted);font-size:14px}
.spc-dot{position:relative;display:block;width:34px;height:34px;margin-bottom:16px;border-radius:10px;background:var(--sc-accent)}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="spc-grid"><article class="spc-card"><span class="spc-dot"></span><h3>Live sync</h3><p>Every change reaches your team in under a second.</p></article><article class="spc-card"><span class="spc-dot" style="opacity:.75"></span><h3>Smart search</h3><p>Find any file, note or message with one shortcut.</p></article><article class="spc-card"><span class="spc-dot" style="opacity:.5"></span><h3>Private by default</h3><p>Nothing is shared until you decide it should be.</p></article></div>
</div>
<script>
(function(){var root=document.currentScript.previousElementSibling,grid=root.querySelector('.spc-grid');
grid.addEventListener('pointermove',function(e){grid.querySelectorAll('.spc-card').forEach(function(card){var r=card.getBoundingClientRect();card.style.setProperty('--x',(e.clientX-r.left)+'px');card.style.setProperty('--y',(e.clientY-r.top)+'px')})});})();
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
