<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scroll stack preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,640px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.sk2{position:relative;border:1px solid var(--sc-line);border-radius:28px;background:var(--sc-surface);overflow:hidden}
.sk2-scroll{height:440px;overflow-y:auto;padding:18px 18px 260px;scroll-behavior:smooth}
.sk2-card{position:sticky;top:calc(18px + var(--i)*14px);height:260px;margin-bottom:34px;border-radius:24px;overflow:hidden;background:var(--sc-bg);border:1px solid var(--sc-line);box-shadow:0 18px 34px -18px rgba(0,0,0,.45);transform-origin:50% 0;will-change:transform,filter;display:grid;grid-template-columns:1fr 1.1fr}
.sk2-art{background-size:cover;background-position:center}
.sk2-txt{padding:26px 26px 20px;display:flex;flex-direction:column;justify-content:center}
.sk2-txt small{font:700 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;color:var(--sc-accent)}
.sk2-txt h3{margin:10px 0 8px;font:800 26px/1.1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.02em}
.sk2-txt p{margin:0;font-size:15px;line-height:1.5;color:var(--sc-muted)}
.sk2-count{position:absolute;right:16px;top:14px;padding:5px 10px;border-radius:999px;background:var(--sc-bg);border:1px solid var(--sc-line);font:700 12px/1 ui-monospace,monospace;z-index:20}
@media (max-width:520px){.sk2-card{grid-template-columns:1fr}.sk2-art{display:none}}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="sk2"><span class="sk2-count" aria-live="polite">1 / 5</span><div class="sk2-scroll" tabindex="0" role="region" aria-label="Stacking cards, scroll to continue"></div></div>
</div>
<script>
(function(){var root=document.currentScript.previousElementSibling.querySelector('.sk2'),sc=root.querySelector('.sk2-scroll'),count=root.querySelector('.sk2-count');
var SCENES=[
{s:['#2b1055','#d6457f','#ffb36b'],u:[.68,.6,.11,'#fff1c0'],h:['#8a2f78','#56206a','#2f1450','#170b2c'],st:0},
{s:['#0b1b3a','#2b6cb0','#a6dcff'],u:[.28,.3,.06,'#ffffff'],h:['#7fb0d4','#4a7ba3','#274b6b','#12273d'],st:0},
{s:['#ffd9a0','#ff9a5a','#d24a43'],u:[.5,.56,.14,'#fff6d8'],h:['#bd4b33','#8c3029','#5c1d29','#300f21'],st:0},
{s:['#06122a','#12305a','#40306f'],u:[.78,.22,.05,'#f5f1ff'],h:['#21405f','#14304a','#0c1f36','#050e1c'],st:1},
{s:['#c4f6dc','#82e2b8','#2fa583'],u:[.3,.28,.09,'#ffffff'],h:['#41b98d','#2b9370','#17664d','#0b402f'],st:0},
{s:['#1a0b2e','#6a1b9a','#ff4fa8'],u:[.5,.5,.12,'#ffe0f3'],h:['#44186e','#2a1250','#170a34','#0a061a'],st:1},
{s:['#0c2429','#1a5a56','#7adcc8'],u:[.72,.34,.07,'#eafff9'],h:['#318e84','#1d625c','#103c40','#06202a'],st:1},
{s:['#fbe6ff','#d8abff','#8d7cff'],u:[.24,.4,.1,'#fffbe8'],h:['#a284ff','#6f58db','#4535a6','#271c63'],st:0}];
var ARTCACHE={};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function art(i,w,h){var key=i+'/'+w+'/'+h;if(ARTCACHE[key])return ARTCACHE[key];var sc=SCENES[((i%8)+8)%8],c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d'),rnd=mulberry(i*7919+13);
 var g=x.createLinearGradient(0,0,0,h*.8);g.addColorStop(0,sc.s[0]);g.addColorStop(.55,sc.s[1]);g.addColorStop(1,sc.s[2]);x.fillStyle=g;x.fillRect(0,0,w,h);
 if(sc.st){for(var k=0;k<90;k++){x.fillStyle='rgba(255,255,255,'+(.25+rnd()*.6)+')';var r=rnd()*1.4+.3;x.beginPath();x.arc(rnd()*w,rnd()*h*.55,r,0,6.283);x.fill()}}
 var ux=sc.u[0]*w,uy=sc.u[1]*h,ur=sc.u[2]*Math.min(w,h),gl=x.createRadialGradient(ux,uy,ur*.2,ux,uy,ur*4.2);gl.addColorStop(0,sc.u[3]+'cc');gl.addColorStop(1,sc.u[3]+'00');x.fillStyle=gl;x.fillRect(0,0,w,h);x.fillStyle=sc.u[3];x.beginPath();x.arc(ux,uy,ur,0,6.283);x.fill();
 for(var L=0;L<4;L++){var y0=h*(.5+L*.11),amp=h*(.07-L*.008),p1=rnd()*6,p2=rnd()*6,p3=rnd()*6,f1=2.2+rnd()*1.4,f2=5+rnd()*3,f3=11+rnd()*5;x.beginPath();x.moveTo(0,h);for(var px=0;px<=w+3;px+=3){var t=px/w;x.lineTo(px,y0+Math.sin(t*f1+p1)*amp+Math.sin(t*f2+p2)*amp*.45+Math.sin(t*f3+p3)*amp*.18)}x.lineTo(w,h);x.closePath();
  var hg=x.createLinearGradient(0,y0-amp,0,h);hg.addColorStop(0,sc.h[L]);hg.addColorStop(1,L<3?sc.h[L+1]:'#000');x.fillStyle=hg;x.fill();
  if(L<3){var fg=x.createLinearGradient(0,y0-amp,0,y0+h*.12);fg.addColorStop(0,'rgba(255,255,255,.13)');fg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=fg;x.fill()}}
 for(var n=0;n<Math.round(w*h/90);n++){x.fillStyle=rnd()<.5?'rgba(255,255,255,.035)':'rgba(0,0,0,.05)';x.fillRect(rnd()*w,rnd()*h,1,1)}
 ARTCACHE[key]=c;return c}
function artURL(i,w,h){var c=art(i,w,h);if(!c.u)c.u=c.toDataURL('image/jpeg',.88);return c.u}
var NAMES=['Dusk','Glacier','Mesa','Night','Mint','Neon','Tide','Lilac'];
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,cards=[],raf=0,heads=['Sketch the idea','Block it out','Add the light','Polish the details','Ship it'],body=['Start loose. Capture the shape of the thing before its edges.','Rough in the layout so the rhythm of the page is clear.','Colour and shadow turn flat blocks into a place to look at.','Spacing, type and motion get one last careful pass.','Release it, watch how people use it, begin the next draft.'];
for(var i=0;i<5;i++){var c=document.createElement('article');c.className='sk2-card';c.style.setProperty('--i',i);var a=document.createElement('div');a.className='sk2-art';a.style.backgroundImage='url('+artURL(i*3+1,300,260)+')';var t=document.createElement('div');t.className='sk2-txt';var s=document.createElement('small');s.textContent='STEP 0'+(i+1);var h=document.createElement('h3');h.textContent=heads[i];var p=document.createElement('p');p.textContent=body[i];t.appendChild(s);t.appendChild(h);t.appendChild(p);c.appendChild(a);c.appendChild(t);sc.appendChild(c);cards.push(c)}
function update(){raf=0;var top=sc.getBoundingClientRect().top,cur=0;
 cards.forEach(function(c,i){var next=cards[i+1],ov=0;if(next){var cr=c.getBoundingClientRect(),nr=next.getBoundingClientRect();ov=Math.max(0,Math.min(1,(cr.top+cr.height*.55-nr.top)/(cr.height*.55)))}if(c.getBoundingClientRect().top-top<60+i*14)cur=i;
  var depth=0;for(var j=i+1;j<cards.length;j++){var q=cards[j].getBoundingClientRect();depth+=Math.max(0,Math.min(1,(c.getBoundingClientRect().top+c.offsetHeight*.55-q.top)/(c.offsetHeight*.55)))}
  if(reduce)return;c.style.transform='scale('+(1-.045*Math.min(depth,3)).toFixed(4)+')';c.style.filter='brightness('+(1-.12*Math.min(depth,3)).toFixed(3)+')'});
 count.textContent=(cur+1)+' / 5'}
function sched(){if(!raf)raf=requestAnimationFrame(update)}
sc.addEventListener('scroll',sched,{passive:true});update();})();
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
