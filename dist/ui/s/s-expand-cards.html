<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expanding cards preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,780px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.xc{position:relative;height:430px;padding:14px;border:1px solid var(--sc-line);border-radius:28px;background:var(--sc-surface);overflow:hidden}
.xc-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;height:100%}
.xc-card{position:relative;padding:0;border:0;border-radius:20px;overflow:hidden;cursor:pointer;color:#fff;text-align:left;background-size:cover;background-position:center;transition:transform .3s cubic-bezier(.2,.9,.3,1.2),box-shadow .3s}
.xc-card:hover{transform:scale(1.015);box-shadow:0 18px 30px -16px rgba(0,0,0,.55)}
.xc-card span{position:absolute;left:18px;bottom:16px;font:800 22px/1 system-ui,-apple-system,"Segoe UI",sans-serif;text-shadow:0 1px 10px rgba(0,0,0,.5)}
.xc-card small{position:absolute;left:18px;top:16px;font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;opacity:.9}
.xc-open{position:absolute;border-radius:20px;overflow:hidden;background-size:cover;background-position:center;z-index:10;transition:left .55s cubic-bezier(.3,.8,.2,1),top .55s cubic-bezier(.3,.8,.2,1),width .55s cubic-bezier(.3,.8,.2,1),height .55s cubic-bezier(.3,.8,.2,1),border-radius .55s}
.xc-open .xc-body{position:absolute;left:0;right:0;bottom:0;padding:70px 30px 28px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75));opacity:0;transition:opacity .35s .25s}
.xc-open.full .xc-body{opacity:1}
.xc-body h3{margin:0 0 8px;font:800 34px/1.05 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.02em}
.xc-body p{margin:0 0 16px;max-width:36em;font-size:16px;line-height:1.5;opacity:.92}
.xc-close{padding:9px 18px;border:1px solid rgba(255,255,255,.6);border-radius:999px;background:rgba(0,0,0,.35);color:#fff;cursor:pointer;font-size:14px;font-weight:600}
.xc-close:hover{background:rgba(0,0,0,.6)}
@media (prefers-reduced-motion:reduce){.xc-open,.xc-open .xc-body{transition:none}}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="xc"><div class="xc-grid"></div></div>
</div>
<script>
(function(){var root=document.currentScript.previousElementSibling.querySelector('.xc'),grid=root.querySelector('.xc-grid');
var SCENES=[
{s:['#2b1055','#d6457f','#ffb36b'],u:[.68,.6,.11,'#fff1c0'],h:['#8a2f78','#56206a','#2f1450','#170b2c'],st:0},
{s:['#0b1b3a','#2b6cb0','#a6dcff'],u:[.28,.3,.06,'#ffffff'],h:['#7fb0d4','#4a7ba3','#274b6b','#12273d'],st:0},
{s:['#ffd9a0','#ff9a5a','#d24a43'],u:[.5,.56,.14,'#fff6d8'],h:['#bd4b33','#8c3029','#5c1d29','#300f21'],st:0},
{s:['#06122a','#12305a','#40306f'],u:[.78,.22,.05,'#f5f1ff'],h:['#21405f','#14304a','#0c1f36','#050e1c'],st:1},
{s:['#c4f6dc','#82e2b8','#2fa583'],u:[.3,.28,.09,'#ffffff'],h:['#41b98d','#2b9370','#17664d','#0b402f'],st:0},
{s:['#1a0b2e','#6a1b9a','#ff4fa8'],u:[.5,.5,.12,'#ffe0f3'],h:['#44186e','#2a1250','#170a34','#0a061a'],st:1},
{s:['#0c2429','#1a5a56','#7adcc8'],u:[.72,.34,.07,'#eafff9'],h:['#318e84','#1d625c','#103c40','#06202a'],st:1},
{s:['#fbe6ff','#d8abff','#8d7cff'],u:[.24,.4,.1,'#fffbe8'],h:['#a284ff','#6f58db','#4535a6','#271c63'],st:0}];
var ARTCACHE={};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function art(i,w,h){var key=i+'/'+w+'/'+h;if(ARTCACHE[key])return ARTCACHE[key];var sc=SCENES[((i%8)+8)%8],c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d'),rnd=mulberry(i*7919+13);
 var g=x.createLinearGradient(0,0,0,h*.8);g.addColorStop(0,sc.s[0]);g.addColorStop(.55,sc.s[1]);g.addColorStop(1,sc.s[2]);x.fillStyle=g;x.fillRect(0,0,w,h);
 if(sc.st){for(var k=0;k<90;k++){x.fillStyle='rgba(255,255,255,'+(.25+rnd()*.6)+')';var r=rnd()*1.4+.3;x.beginPath();x.arc(rnd()*w,rnd()*h*.55,r,0,6.283);x.fill()}}
 var ux=sc.u[0]*w,uy=sc.u[1]*h,ur=sc.u[2]*Math.min(w,h),gl=x.createRadialGradient(ux,uy,ur*.2,ux,uy,ur*4.2);gl.addColorStop(0,sc.u[3]+'cc');gl.addColorStop(1,sc.u[3]+'00');x.fillStyle=gl;x.fillRect(0,0,w,h);x.fillStyle=sc.u[3];x.beginPath();x.arc(ux,uy,ur,0,6.283);x.fill();
 for(var L=0;L<4;L++){var y0=h*(.5+L*.11),amp=h*(.07-L*.008),p1=rnd()*6,p2=rnd()*6,p3=rnd()*6,f1=2.2+rnd()*1.4,f2=5+rnd()*3,f3=11+rnd()*5;x.beginPath();x.moveTo(0,h);for(var px=0;px<=w+3;px+=3){var t=px/w;x.lineTo(px,y0+Math.sin(t*f1+p1)*amp+Math.sin(t*f2+p2)*amp*.45+Math.sin(t*f3+p3)*amp*.18)}x.lineTo(w,h);x.closePath();
  var hg=x.createLinearGradient(0,y0-amp,0,h);hg.addColorStop(0,sc.h[L]);hg.addColorStop(1,L<3?sc.h[L+1]:'#000');x.fillStyle=hg;x.fill();
  if(L<3){var fg=x.createLinearGradient(0,y0-amp,0,y0+h*.12);fg.addColorStop(0,'rgba(255,255,255,.13)');fg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=fg;x.fill()}}
 for(var n=0;n<Math.round(w*h/90);n++){x.fillStyle=rnd()<.5?'rgba(255,255,255,.035)':'rgba(0,0,0,.05)';x.fillRect(rnd()*w,rnd()*h,1,1)}
 ARTCACHE[key]=c;return c}
function artURL(i,w,h){var c=art(i,w,h);if(!c.u)c.u=c.toDataURL('image/jpeg',.88);return c.u}
var NAMES=['Dusk','Glacier','Mesa','Night','Mint','Neon','Tide','Lilac'];
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,ids=[0,2,5,6],texts=['Warm light settling over the ridgelines as the day closes.','A cold, bright morning above a quiet glacier basin.','Neon haze over an empty highway, long after midnight.','Teal water, soft wind and one last bright moon.'],cards=[],open=null;
function rectOf(el){var r=el.getBoundingClientRect(),p=root.getBoundingClientRect();return {l:r.left-p.left,t:r.top-p.top,w:r.width,h:r.height}}
function place(el,r){el.style.left=r.l+'px';el.style.top=r.t+'px';el.style.width=r.w+'px';el.style.height=r.h+'px'}
ids.forEach(function(id,i){var b=document.createElement('button');b.type='button';b.className='xc-card';b.style.backgroundImage='url('+artURL(id,380,200)+')';var s=document.createElement('span');s.textContent=NAMES[id%8];var sm=document.createElement('small');sm.textContent='0'+(i+1);b.appendChild(sm);b.appendChild(s);b.addEventListener('click',function(){expand(i,b)});grid.appendChild(b);cards.push(b)});
function expand(i,card){if(open)return;var r=rectOf(card),el=document.createElement('div');el.className='xc-open';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label',NAMES[ids[i]%8]);el.style.backgroundImage='url('+artURL(ids[i],780,430)+')';place(el,r);
 var body=document.createElement('div');body.className='xc-body';var h=document.createElement('h3');h.textContent=NAMES[ids[i]%8];var p=document.createElement('p');p.textContent=texts[i];var c=document.createElement('button');c.type='button';c.className='xc-close';c.textContent='Close';body.appendChild(h);body.appendChild(p);body.appendChild(c);el.appendChild(body);root.appendChild(el);void el.offsetWidth;
 card.style.visibility='hidden';var full={l:0,t:0,w:root.clientWidth,h:root.clientHeight};place(el,full);el.style.borderRadius='0px';el.classList.add('full');open={el:el,card:card};c.focus();c.addEventListener('click',close);el.addEventListener('pointerdown',function(e){if(e.target===el)close()})}
function close(){if(!open)return;var o=open;open=null;o.el.classList.remove('full');place(o.el,rectOf(o.card));o.el.style.borderRadius='20px';var done=function(){o.card.style.visibility='';o.el.remove();o.card.focus()};if(reduce)done();else setTimeout(done,560)}
root.addEventListener('keydown',function(e){if(e.key==='Escape')close()});})();
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
