<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wave lettering preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,780px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.wv{display:grid;place-items:center;min-height:340px;padding:44px 28px;border:1px solid var(--sc-line);border-radius:28px;background:var(--sc-surface);overflow:hidden}
.wv-line{margin:0;text-align:center;font:900 clamp(44px,11.5vw,104px)/1.08 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.045em}
.wv-w{display:inline-block;white-space:nowrap}
.wv-l{display:inline-block;will-change:transform}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="wv"><h2 class="wv-line"></h2></div>
</div>
<script>
(function(){var root=document.currentScript.previousElementSibling.querySelector('.wv'),line=root.querySelector('.wv-line'),lines=['Ride the','wave'];
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,L=[],raf=0,visible=true,amp=22,freq=.5,tAmp=22,tFreq=.5,ptr=false;
line.setAttribute('aria-label',lines.join(' '));
lines.forEach(function(txt,li){if(li)line.appendChild(document.createElement('br'));txt.split(' ').forEach(function(word,wi){if(wi)line.appendChild(document.createTextNode(' '));var w=document.createElement('span');w.className='wv-w';w.setAttribute('aria-hidden','true');for(var i=0;i<word.length;i++){var s=document.createElement('span');s.className='wv-l';s.textContent=word.charAt(i);w.appendChild(s);L.push({el:s,i:L.length+li*2})}line.appendChild(w)})});
function frame(now){raf=0;var t=now/1000;if(!ptr){tAmp=26+10*Math.sin(t*.4);tFreq=.5+.18*Math.sin(t*.27)}amp+=(tAmp-amp)*.08;freq+=(tFreq-freq)*.08;
 L.forEach(function(l){var ph=l.i*freq-t*3.2,s=Math.sin(ph),c=Math.cos(ph);l.el.style.transform='translateY('+(s*amp).toFixed(2)+'px) rotate('+(c*9).toFixed(2)+'deg)';l.el.style.color='hsl('+(262+(s*.5+.5)*78).toFixed(0)+',86%,'+(60+s*6).toFixed(0)+'%)'});
 if(visible)raf=requestAnimationFrame(frame)}
function go(){if(!raf&&visible&&!reduce)raf=requestAnimationFrame(frame)}
if(reduce)L.forEach(function(l,i){l.el.style.color='hsl('+(262+i*6)+',86%,62%)'});
root.addEventListener('pointermove',function(e){var r=root.getBoundingClientRect();ptr=true;tAmp=10+36*(1-(e.clientY-r.top)/r.height);tFreq=.28+.7*((e.clientX-r.left)/r.width)});
root.addEventListener('pointerleave',function(){ptr=false});
if('IntersectionObserver' in window)new IntersectionObserver(function(es){visible=es[0].isIntersecting;go()}).observe(root);go();})();
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
