<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Warp portal preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,760px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.wp{position:relative;height:420px;border:1px solid #1d1d28;border-radius:28px;background:#03030a;overflow:hidden;cursor:pointer;touch-action:pan-y}
.wp canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.wp-btn{position:absolute;right:14px;bottom:14px;padding:8px 16px;border:1px solid #3a3a58;border-radius:999px;background:rgba(10,10,24,.7);color:#e6e6ff;cursor:pointer;font-size:13px;font-weight:600}
.wp-btn:hover{border-color:#a99bff}
.wp-hint{position:absolute;left:18px;bottom:20px;margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6c6c86;pointer-events:none}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="wp"><canvas aria-hidden="true"></canvas><p class="wp-hint">Click to jump through</p><button class="wp-btn" type="button">Jump</button></div>
</div>
<script>
(function(){var root=document.currentScript.previousElementSibling.querySelector('.wp'),cv=root.querySelector('canvas'),btn=root.querySelector('.wp-btn');
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function Stage(root,cv,draw,resize){
 var s={W:0,H:0,dpr:1,x:0,y:0,vx:0,vy:0,px:0,py:0,inside:false,down:false,t:0,dt:16,ctx:cv.getContext('2d'),click:null,first:true},raf=0,visible=true,last=0,until=0;
 function size(){s.dpr=Math.min(2,window.devicePixelRatio||1);s.W=cv.clientWidth;s.H=cv.clientHeight;cv.width=Math.round(s.W*s.dpr);cv.height=Math.round(s.H*s.dpr);s.ctx.setTransform(s.dpr,0,0,s.dpr,0,0);if(resize)resize(s);s.first=true}
 function frame(now){raf=0;s.dt=Math.min(48,now-(last||now-16));last=now;s.t=now;var tx,ty;
  if(s.inside){tx=s.px;ty=s.py}else{tx=s.W*(.5+.34*Math.sin(now*.00071)+.1*Math.sin(now*.0023));ty=s.H*(.5+.3*Math.sin(now*.00097+1)+.08*Math.cos(now*.0021))}
  if(s.first){s.x=tx;s.y=ty;s.first=false}
  s.vx=tx-s.x;s.vy=ty-s.y;s.x=tx;s.y=ty;draw(s);
  if(visible&&(!reduce||now<until))raf=requestAnimationFrame(frame)}
 function go(){if(!raf&&visible){last=0;raf=requestAnimationFrame(frame)}}
 function poke(){until=performance.now()+900;go()}
 function at(e){var r=cv.getBoundingClientRect();s.px=e.clientX-r.left;s.py=e.clientY-r.top;s.inside=true}
 root.addEventListener('pointermove',function(e){at(e);if(reduce)poke()});
 root.addEventListener('pointerleave',function(){s.inside=false;s.down=false});
 root.addEventListener('pointerdown',function(e){at(e);s.down=true;if(s.click)s.click(s.px,s.py);if(reduce)poke()});
 root.addEventListener('pointerup',function(){s.down=false});
 if('IntersectionObserver' in window)new IntersectionObserver(function(es){visible=es[0].isIntersecting;if(visible)go()}).observe(root);
 if('ResizeObserver' in window){var lw=0;new ResizeObserver(function(){if(cv.clientWidth&&cv.clientWidth!==lw){lw=cv.clientWidth;size();go()}}).observe(cv)}else{size();go()}
 if(!reduce)go();else poke();
 return s}
var SCENES=[
{s:['#2b1055','#d6457f','#ffb36b'],u:[.68,.6,.11,'#fff1c0'],h:['#8a2f78','#56206a','#2f1450','#170b2c'],st:0},
{s:['#0b1b3a','#2b6cb0','#a6dcff'],u:[.28,.3,.06,'#ffffff'],h:['#7fb0d4','#4a7ba3','#274b6b','#12273d'],st:0},
{s:['#ffd9a0','#ff9a5a','#d24a43'],u:[.5,.56,.14,'#fff6d8'],h:['#bd4b33','#8c3029','#5c1d29','#300f21'],st:0},
{s:['#06122a','#12305a','#40306f'],u:[.78,.22,.05,'#f5f1ff'],h:['#21405f','#14304a','#0c1f36','#050e1c'],st:1},
{s:['#c4f6dc','#82e2b8','#2fa583'],u:[.3,.28,.09,'#ffffff'],h:['#41b98d','#2b9370','#17664d','#0b402f'],st:0},
{s:['#1a0b2e','#6a1b9a','#ff4fa8'],u:[.5,.5,.12,'#ffe0f3'],h:['#44186e','#2a1250','#170a34','#0a061a'],st:1},
{s:['#0c2429','#1a5a56','#7adcc8'],u:[.72,.34,.07,'#eafff9'],h:['#318e84','#1d625c','#103c40','#06202a'],st:1},
{s:['#fbe6ff','#d8abff','#8d7cff'],u:[.24,.4,.1,'#fffbe8'],h:['#a284ff','#6f58db','#4535a6','#271c63'],st:0}];
var ARTCACHE={};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function art(i,w,h){var key=i+'/'+w+'/'+h;if(ARTCACHE[key])return ARTCACHE[key];var sc=SCENES[((i%8)+8)%8],c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d'),rnd=mulberry(i*7919+13);
 var g=x.createLinearGradient(0,0,0,h*.8);g.addColorStop(0,sc.s[0]);g.addColorStop(.55,sc.s[1]);g.addColorStop(1,sc.s[2]);x.fillStyle=g;x.fillRect(0,0,w,h);
 if(sc.st){for(var k=0;k<90;k++){x.fillStyle='rgba(255,255,255,'+(.25+rnd()*.6)+')';var r=rnd()*1.4+.3;x.beginPath();x.arc(rnd()*w,rnd()*h*.55,r,0,6.283);x.fill()}}
 var ux=sc.u[0]*w,uy=sc.u[1]*h,ur=sc.u[2]*Math.min(w,h),gl=x.createRadialGradient(ux,uy,ur*.2,ux,uy,ur*4.2);gl.addColorStop(0,sc.u[3]+'cc');gl.addColorStop(1,sc.u[3]+'00');x.fillStyle=gl;x.fillRect(0,0,w,h);x.fillStyle=sc.u[3];x.beginPath();x.arc(ux,uy,ur,0,6.283);x.fill();
 for(var L=0;L<4;L++){var y0=h*(.5+L*.11),amp=h*(.07-L*.008),p1=rnd()*6,p2=rnd()*6,p3=rnd()*6,f1=2.2+rnd()*1.4,f2=5+rnd()*3,f3=11+rnd()*5;x.beginPath();x.moveTo(0,h);for(var px=0;px<=w+3;px+=3){var t=px/w;x.lineTo(px,y0+Math.sin(t*f1+p1)*amp+Math.sin(t*f2+p2)*amp*.45+Math.sin(t*f3+p3)*amp*.18)}x.lineTo(w,h);x.closePath();
  var hg=x.createLinearGradient(0,y0-amp,0,h);hg.addColorStop(0,sc.h[L]);hg.addColorStop(1,L<3?sc.h[L+1]:'#000');x.fillStyle=hg;x.fill();
  if(L<3){var fg=x.createLinearGradient(0,y0-amp,0,y0+h*.12);fg.addColorStop(0,'rgba(255,255,255,.13)');fg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=fg;x.fill()}}
 for(var n=0;n<Math.round(w*h/90);n++){x.fillStyle=rnd()<.5?'rgba(255,255,255,.035)':'rgba(0,0,0,.05)';x.fillRect(rnd()*w,rnd()*h,1,1)}
 ARTCACHE[key]=c;return c}
function artURL(i,w,h){var c=art(i,w,h);if(!c.u)c.u=c.toDataURL('image/jpeg',.88);return c.u}
var S=[],jump=-1,DUR=3200,scene=0,off=0,ready=false,pic=null;
function mk(s){S=[];for(var i=0;i<220;i++)S.push({a:Math.random()*6.283,r:Math.random(),v:.004+Math.random()*.012});pic=null;ready=true}
function ease(x){return x*x*(3-2*x)}
var s=Stage(root,cv,function(s){var c=s.ctx,W=s.W,H=s.H,cx=W/2,cy=H/2,t=s.t;if(!ready)return;c.fillStyle='#03030a';c.fillRect(0,0,W,H);
 var k=jump>=0?(t-jump)/DUR:-1,boost=1,flash=0,disc=0;if(k>=1){jump=-1;k=-1}
 if(k>=0){boost=1+7*Math.sin(Math.min(1,k/.5)*Math.PI/2)*(k<.7?1:Math.max(0,1-(k-.7)/.3));flash=k<.5?Math.max(0,1-Math.abs(k-.35)/.15):0;disc=k<.3?0:k<.85?ease(Math.min(1,(k-.3)/.25)):1-ease((k-.85)/.15)}
 off=(off+.0035*boost)%1;var R=Math.max(W,H)*.75;c.globalCompositeOperation='lighter';
 for(var i=0;i<14;i++){var u=((i/14+off)%1),r=Math.pow(u,2.2)*R,al=Math.sin(u*Math.PI)*.8;if(r<4)continue;c.strokeStyle='hsla('+(260+u*80)+',90%,'+(50+u*14)+'%,'+al+')';c.lineWidth=1+u*4;c.save();c.translate(cx,cy);c.rotate(t*.0003*boost+i*.3);c.beginPath();c.ellipse(0,0,r,r*.7,0,0,6.283);c.stroke();c.restore()}
 S.forEach(function(p){p.r+=p.v*boost;if(p.r>1.1){p.r=.02;p.a=Math.random()*6.283}var r0=Math.pow(p.r,1.7)*R,r1=Math.pow(Math.max(0,p.r-.03*boost),1.7)*R,ca=Math.cos(p.a+Math.log(1+p.r)*.6),sa=Math.sin(p.a+Math.log(1+p.r)*.6);c.strokeStyle='hsla('+(190+p.a*10)+',90%,'+(60+p.r*30)+'%,'+Math.min(1,p.r*1.4)*.8+')';c.lineWidth=1+p.r*1.6;c.beginPath();c.moveTo(cx+ca*r1,cy+sa*r1*.7);c.lineTo(cx+ca*r0,cy+sa*r0*.7);c.stroke()});
 var rim=c.createRadialGradient(cx,cy,10,cx,cy,Math.min(W,H)*.32);rim.addColorStop(0,'rgba(0,0,0,1)');rim.addColorStop(.55,'rgba(0,0,0,.92)');rim.addColorStop(.8,'rgba(150,110,255,.35)');rim.addColorStop(1,'rgba(150,110,255,0)');c.globalCompositeOperation='source-over';c.fillStyle=rim;c.fillRect(0,0,W,H);
 if(disc>0){var dr=disc*H*.38;if(!pic||pic.sc!==scene)pic={sc:scene,c:art(scene,Math.round(H*.8),Math.round(H*.8))};c.save();c.beginPath();c.arc(cx,cy,dr,0,6.283);c.clip();c.drawImage(pic.c,cx-dr,cy-dr,dr*2,dr*2);c.restore();c.globalCompositeOperation='lighter';c.strokeStyle='rgba(200,190,255,'+(.9*disc)+')';c.lineWidth=3+6*(1-disc);c.beginPath();c.arc(cx,cy,dr,0,6.283);c.stroke();c.globalCompositeOperation='source-over'}
 if(flash>0){c.fillStyle='rgba(255,255,255,'+flash*.85+')';c.fillRect(0,0,W,H)}},mk);
function go(){if(jump<0){jump=performance.now();scene=(scene+1)%8}}
s.click=go;btn.addEventListener('click',go);})();
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
