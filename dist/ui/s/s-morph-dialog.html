<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Morphing dialog preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,560px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.md{display:grid;place-items:center;min-height:300px;padding:30px 20px;border:1px solid var(--sc-line);border-radius:28px;background:var(--sc-surface)}
.md-card{display:flex;align-items:center;gap:16px;width:min(100%,420px);padding:14px 18px 14px 14px;border:1px solid var(--sc-line);border-radius:22px;background:var(--sc-bg);color:inherit;text-align:left;cursor:pointer;transition:transform .25s,box-shadow .25s}
.md-card:hover{transform:translateY(-2px);box-shadow:0 18px 30px -18px rgba(0,0,0,.35)}
.md-th{flex:none;width:64px;height:64px;border-radius:16px;background-size:cover;background-position:center}
.md-card.is-open .md-th,.md-card.is-open .md-tt{visibility:hidden}
.md-tt{display:block;font:800 17px/1.15 system-ui,-apple-system,"Segoe UI",sans-serif}
.md-meta{display:block;margin-top:4px;font-size:13px;color:var(--sc-muted)}
.md-chev{margin-left:auto;color:var(--sc-muted);font-size:20px}
.md-dlg{width:min(92vw,460px);padding:0;border:0;border-radius:28px;background:var(--sc-bg);color:var(--sc-fg);overflow:visible;box-shadow:0 40px 80px -20px rgba(0,0,0,.5)}
.md-dlg::backdrop{background:rgba(10,10,20,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.md-panel{padding:22px 22px 24px}
.md-big{display:block;width:100%;height:190px;border-radius:20px;background-size:cover;background-position:center;transform-origin:0 0}
.md-h{margin:18px 0 6px;font:800 26px/1.1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.02em;transform-origin:0 0;display:block}
.md-body p{margin:0 0 14px;font-size:15px;line-height:1.55;color:var(--sc-muted)}
.md-close{padding:9px 18px;border:1px solid var(--sc-line);border-radius:999px;background:var(--sc-surface);color:inherit;cursor:pointer;font-size:14px;font-weight:600}
.md-close:hover{border-color:var(--sc-accent)}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="md"><button class="md-card" type="button" aria-haspopup="dialog"><span class="md-th"></span><span><span class="md-tt">Lilac Morning</span><span class="md-meta">Photo story · 4 min read</span></span><span class="md-chev" aria-hidden="true">&#8250;</span></button><dialog class="md-dlg" aria-labelledby="md-h"><div class="md-panel"><span class="md-big"></span><span class="md-h" id="md-h">Lilac Morning</span><div class="md-body"><p>Soft light arrives before the colour does. The valley holds its breath, the ridgelines stack into pale violet layers, and for a few minutes everything looks painted.</p><p>Shot over three early mornings with a single wide lens.</p><button class="md-close" type="button">Close</button></div></div></dialog></div>
</div>
<script>
(function(){var root=document.currentScript.previousElementSibling.querySelector('.md'),card=root.querySelector('.md-card'),dlg=root.querySelector('.md-dlg'),th=card.querySelector('.md-th'),tt=card.querySelector('.md-tt'),big=dlg.querySelector('.md-big'),hh=dlg.querySelector('.md-h'),body=dlg.querySelector('.md-body'),panel=dlg.querySelector('.md-panel'),close=dlg.querySelector('.md-close');
var SCENES=[
{s:['#2b1055','#d6457f','#ffb36b'],u:[.68,.6,.11,'#fff1c0'],h:['#8a2f78','#56206a','#2f1450','#170b2c'],st:0},
{s:['#0b1b3a','#2b6cb0','#a6dcff'],u:[.28,.3,.06,'#ffffff'],h:['#7fb0d4','#4a7ba3','#274b6b','#12273d'],st:0},
{s:['#ffd9a0','#ff9a5a','#d24a43'],u:[.5,.56,.14,'#fff6d8'],h:['#bd4b33','#8c3029','#5c1d29','#300f21'],st:0},
{s:['#06122a','#12305a','#40306f'],u:[.78,.22,.05,'#f5f1ff'],h:['#21405f','#14304a','#0c1f36','#050e1c'],st:1},
{s:['#c4f6dc','#82e2b8','#2fa583'],u:[.3,.28,.09,'#ffffff'],h:['#41b98d','#2b9370','#17664d','#0b402f'],st:0},
{s:['#1a0b2e','#6a1b9a','#ff4fa8'],u:[.5,.5,.12,'#ffe0f3'],h:['#44186e','#2a1250','#170a34','#0a061a'],st:1},
{s:['#0c2429','#1a5a56','#7adcc8'],u:[.72,.34,.07,'#eafff9'],h:['#318e84','#1d625c','#103c40','#06202a'],st:1},
{s:['#fbe6ff','#d8abff','#8d7cff'],u:[.24,.4,.1,'#fffbe8'],h:['#a284ff','#6f58db','#4535a6','#271c63'],st:0}];
var ARTCACHE={};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function art(i,w,h){var key=i+'/'+w+'/'+h;if(ARTCACHE[key])return ARTCACHE[key];var sc=SCENES[((i%8)+8)%8],c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d'),rnd=mulberry(i*7919+13);
 var g=x.createLinearGradient(0,0,0,h*.8);g.addColorStop(0,sc.s[0]);g.addColorStop(.55,sc.s[1]);g.addColorStop(1,sc.s[2]);x.fillStyle=g;x.fillRect(0,0,w,h);
 if(sc.st){for(var k=0;k<90;k++){x.fillStyle='rgba(255,255,255,'+(.25+rnd()*.6)+')';var r=rnd()*1.4+.3;x.beginPath();x.arc(rnd()*w,rnd()*h*.55,r,0,6.283);x.fill()}}
 var ux=sc.u[0]*w,uy=sc.u[1]*h,ur=sc.u[2]*Math.min(w,h),gl=x.createRadialGradient(ux,uy,ur*.2,ux,uy,ur*4.2);gl.addColorStop(0,sc.u[3]+'cc');gl.addColorStop(1,sc.u[3]+'00');x.fillStyle=gl;x.fillRect(0,0,w,h);x.fillStyle=sc.u[3];x.beginPath();x.arc(ux,uy,ur,0,6.283);x.fill();
 for(var L=0;L<4;L++){var y0=h*(.5+L*.11),amp=h*(.07-L*.008),p1=rnd()*6,p2=rnd()*6,p3=rnd()*6,f1=2.2+rnd()*1.4,f2=5+rnd()*3,f3=11+rnd()*5;x.beginPath();x.moveTo(0,h);for(var px=0;px<=w+3;px+=3){var t=px/w;x.lineTo(px,y0+Math.sin(t*f1+p1)*amp+Math.sin(t*f2+p2)*amp*.45+Math.sin(t*f3+p3)*amp*.18)}x.lineTo(w,h);x.closePath();
  var hg=x.createLinearGradient(0,y0-amp,0,h);hg.addColorStop(0,sc.h[L]);hg.addColorStop(1,L<3?sc.h[L+1]:'#000');x.fillStyle=hg;x.fill();
  if(L<3){var fg=x.createLinearGradient(0,y0-amp,0,y0+h*.12);fg.addColorStop(0,'rgba(255,255,255,.13)');fg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=fg;x.fill()}}
 for(var n=0;n<Math.round(w*h/90);n++){x.fillStyle=rnd()<.5?'rgba(255,255,255,.035)':'rgba(0,0,0,.05)';x.fillRect(rnd()*w,rnd()*h,1,1)}
 ARTCACHE[key]=c;return c}
function artURL(i,w,h){var c=art(i,w,h);if(!c.u)c.u=c.toDataURL('image/jpeg',.88);return c.u}
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,busy=false,E='cubic-bezier(.3,.8,.2,1)';
th.style.backgroundImage='url('+artURL(7,128,128)+')';big.style.backgroundImage='url('+artURL(7,420,190)+')';
function tf(from,to){var sx=from.width/to.width,sy=from.height/to.height;return 'translate('+(from.left-to.left)+'px,'+(from.top-to.top)+'px) scale('+sx+','+sy+')'}
function run(el,a,b,opts){return el.animate([{transform:a},{transform:b}],opts)}
function open(){if(busy||dlg.open)return;busy=true;dlg.style.opacity=0;dlg.showModal();var c1=th.getBoundingClientRect(),c2=tt.getBoundingClientRect(),d1=big.getBoundingClientRect(),d2=hh.getBoundingClientRect();card.classList.add('is-open');dlg.style.opacity='';
 if(reduce){busy=false;return}
 var o={duration:500,easing:E};run(big,tf(c1,d1),'none',o);run(hh,tf(c2,d2),'none',o);dlg.animate([{opacity:0,transform:'scale(.94)'},{opacity:1,transform:'none'}],{duration:380,easing:E});body.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:400,delay:150,easing:'ease',fill:'backwards'});
 setTimeout(function(){busy=false},520)}
function shut(){if(busy||!dlg.open)return;busy=true;var finish=function(){dlg.close();card.classList.remove('is-open');busy=false;card.focus()};if(reduce){finish();return}
 var c1=th.getBoundingClientRect(),c2=tt.getBoundingClientRect(),d1=big.getBoundingClientRect(),d2=hh.getBoundingClientRect(),o={duration:420,easing:E,fill:'forwards'};
 run(big,'none',tf(c1,d1),o);run(hh,'none',tf(c2,d2),o);body.animate([{opacity:1},{opacity:0}],{duration:160,fill:'forwards'});var a=dlg.animate([{opacity:1,transform:'none'},{opacity:0,transform:'scale(.96)'}],{duration:420,easing:E,fill:'forwards'});a.onfinish=function(){finish();[big,hh,body,dlg].forEach(function(e){e.getAnimations().forEach(function(x){x.cancel()})})}}
card.addEventListener('click',open);close.addEventListener('click',shut);dlg.addEventListener('cancel',function(e){e.preventDefault();shut()});dlg.addEventListener('click',function(e){if(e.target===dlg)shut()});})();
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
