<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Magnetic button preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,520px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.mg{display:grid;place-items:center;min-height:220px}
.mg-btn{position:relative;padding:18px 40px;border:0;border-radius:999px;background:var(--sc-fg);color:var(--sc-bg);font-weight:700;font-size:17px;cursor:pointer;transform:translate(var(--x,0),var(--y,0));transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.mg-btn.is-near{transition:transform .12s ease-out}
.mg-label{display:block;transform:translate(var(--lx,0),var(--ly,0));transition:transform .5s cubic-bezier(.3,1.6,.5,1)}.mg-btn.is-near .mg-label{transition:transform .12s ease-out}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="mg"><button class="mg-btn"><span class="mg-label">Get started</span></button></div>
</div>
<script>
(function(){var root=document.currentScript.previousElementSibling,zone=root.querySelector('.mg'),btn=root.querySelector('.mg-btn'),calm=matchMedia('(prefers-reduced-motion: reduce)'),R=110;
function leave(){btn.classList.remove('is-near');['--x','--y','--lx','--ly'].forEach(function(p){btn.style.setProperty(p,'0px')})}
zone.addEventListener('pointermove',function(e){if(calm.matches||e.pointerType==='touch')return;var r=btn.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy),reach=Math.max(r.width,r.height)/2+R;if(d>reach){leave();return}btn.classList.add('is-near');var k=1-d/reach;btn.style.setProperty('--x',(dx*.18*k+dx*.04)+'px');btn.style.setProperty('--y',(dy*.18*k+dy*.04)+'px');btn.style.setProperty('--lx',(dx*.06)+'px');btn.style.setProperty('--ly',(dy*.06)+'px')});
zone.addEventListener('pointerleave',leave);})();
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
