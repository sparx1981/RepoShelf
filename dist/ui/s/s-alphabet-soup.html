<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alphabet soup preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,780px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.as{position:relative;height:400px;border-radius:28px;overflow:hidden;border:1px solid var(--sc-line);background:radial-gradient(100% 100% at 50% 0%,#3a2a20,#17100c);cursor:crosshair}
.as canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="as" role="img" aria-label="Letters floating in a bowl of soup, stirred by the pointer"><canvas></canvas></div>
</div>
<script>
(function(){var root=document.currentScript.previousElementSibling.querySelector('.as'),cv=root.querySelector('canvas');
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function Stage(root,cv,draw,resize){
 var s={W:0,H:0,dpr:1,x:0,y:0,vx:0,vy:0,px:0,py:0,inside:false,down:false,t:0,dt:16,ctx:cv.getContext('2d'),click:null,first:true},raf=0,visible=true,last=0,until=0;
 function size(){s.dpr=Math.min(2,window.devicePixelRatio||1);s.W=cv.clientWidth;s.H=cv.clientHeight;cv.width=Math.round(s.W*s.dpr);cv.height=Math.round(s.H*s.dpr);s.ctx.setTransform(s.dpr,0,0,s.dpr,0,0);if(resize)resize(s);s.first=true}
 function frame(now){raf=0;s.dt=Math.min(48,now-(last||now-16));last=now;s.t=now;var tx,ty;
  if(s.inside){tx=s.px;ty=s.py}else{tx=s.W*(.5+.34*Math.sin(now*.00071)+.1*Math.sin(now*.0023));ty=s.H*(.5+.3*Math.sin(now*.00097+1)+.08*Math.cos(now*.0021))}
  if(s.first){s.x=tx;s.y=ty;s.first=false}
  s.vx=tx-s.x;s.vy=ty-s.y;s.x=tx;s.y=ty;draw(s);
  if(visible&&(!reduce||now<until))raf=requestAnimationFrame(frame)}
 function go(){if(!raf&&visible){last=0;raf=requestAnimationFrame(frame)}}
 function poke(){until=performance.now()+900;go()}
 function at(e){var r=cv.getBoundingClientRect();s.px=e.clientX-r.left;s.py=e.clientY-r.top;s.inside=true}
 root.addEventListener('pointermove',function(e){at(e);if(reduce)poke()});
 root.addEventListener('pointerleave',function(){s.inside=false;s.down=false});
 root.addEventListener('pointerdown',function(e){at(e);s.down=true;if(s.click)s.click(s.px,s.py);if(reduce)poke()});
 root.addEventListener('pointerup',function(){s.down=false});
 if('IntersectionObserver' in window)new IntersectionObserver(function(es){visible=es[0].isIntersecting;if(visible)go()}).observe(root);
 if('ResizeObserver' in window){var lw=0;new ResizeObserver(function(){if(cv.clientWidth&&cv.clientWidth!==lw){lw=cv.clientWidth;size();go()}}).observe(cv)}else{size();go()}
 if(!reduce)go();else poke();
 return s}
var N=26,T=[],R=15,spoonA=0,lx=0,ly=0,ready=false,splash=[];
function seed(s){T=[];var cx=s.W/2,cy=s.H/2+10,BR=Math.min(150,Math.min(s.W,s.H)*.36);for(var i=0;i<N;i++){var a=Math.random()*6.283,d=Math.sqrt(Math.random())*(BR-R-6);T.push({ch:String.fromCharCode(65+i),x:cx+Math.cos(a)*d,y:cy+Math.sin(a)*d,vx:0,vy:0,a:Math.random()*6.28,w:0})}ready=true}
var s=Stage(root,cv,function(s){var c=s.ctx,W=s.W,H=s.H,cx=W/2,cy=H/2+10,BR=Math.min(150,Math.min(s.W,s.H)*.36);if(!ready)seed(s);
 c.clearRect(0,0,W,H);
 var sx=s.x,sy=s.y;if(!s.inside){spoonA+=.012;sx=cx+Math.cos(spoonA)*BR*.55;sy=cy+Math.sin(spoonA)*BR*.55}
 var svx=sx-lx,svy=sy-ly;lx=sx;ly=sy;
 if(!reduce)for(var it=0;it<1;it++){
  for(var i=0;i<N;i++){var t=T[i];t.vy+=.012;
   var dx=t.x-sx,dy=t.y-sy,d=Math.sqrt(dx*dx+dy*dy)+.1;
   if(d<70&&Math.hypot(sx-cx,sy-cy)<BR){var k=(1-d/70),rx=t.x-cx,ry=t.y-cy,rl=Math.sqrt(rx*rx+ry*ry)+.1;t.vx+=(-ry/rl)*k*.5*(s.inside?1:.6)+dx/d*k*.28+svx*.07*k;t.vy+=(rx/rl)*k*.5*(s.inside?1:.6)+dy/d*k*.28+svy*.07*k;t.w+=k*.01}
   t.vx*=.992;t.vy*=.992;t.w*=.97;t.x+=t.vx;t.y+=t.vy;t.a+=t.w+t.vx*.01}
  for(var p=0;p<3;p++){
   for(var a=0;a<N;a++)for(var b=a+1;b<N;b++){var A=T[a],B=T[b],ex=B.x-A.x,ey=B.y-A.y,ed=Math.sqrt(ex*ex+ey*ey);if(ed<R*2&&ed>.001){var nx=ex/ed,ny=ey/ed,ov=(R*2-ed)/2;A.x-=nx*ov;A.y-=ny*ov;B.x+=nx*ov;B.y+=ny*ov;var rv=(B.vx-A.vx)*nx+(B.vy-A.vy)*ny;if(rv<0){var jj=-(1+.45)*rv/2;A.vx-=jj*nx;A.vy-=jj*ny;B.vx+=jj*nx;B.vy+=jj*ny}}}
   for(var q=0;q<N;q++){var u=T[q],wx=u.x-cx,wy=u.y-cy,wd=Math.sqrt(wx*wx+wy*wy),lim=BR-R-2;if(wd>lim){var wnx=wx/wd,wny=wy/wd;u.x=cx+wnx*lim;u.y=cy+wny*lim;var vn=u.vx*wnx+u.vy*wny;if(vn>0){u.vx-=(1+.35)*vn*wnx;u.vy-=(1+.35)*vn*wny}}}}}
 var rim=c.createRadialGradient(cx,cy-BR*.2,BR*.2,cx,cy,BR+22);rim.addColorStop(0,'#e9d2b0');rim.addColorStop(.86,'#cfae83');rim.addColorStop(1,'#8d6a43');
 c.fillStyle='rgba(0,0,0,.4)';c.beginPath();c.ellipse(cx,cy+BR+20,BR*1.05,16,0,0,6.283);c.fill();
 c.fillStyle=rim;c.beginPath();c.arc(cx,cy,BR+18,0,6.283);c.fill();
 var br=c.createRadialGradient(cx-BR*.25,cy-BR*.3,BR*.1,cx,cy,BR);br.addColorStop(0,'#f2b254');br.addColorStop(.7,'#d97c2d');br.addColorStop(1,'#9b4a1a');c.fillStyle=br;c.beginPath();c.arc(cx,cy,BR,0,6.283);c.fill();
 c.save();c.beginPath();c.arc(cx,cy,BR,0,6.283);c.clip();c.strokeStyle='rgba(255,230,170,.18)';c.lineWidth=2;for(var rr=0;rr<5;rr++){c.beginPath();c.ellipse(cx+Math.sin(s.t*.0006+rr)*6,cy+Math.cos(s.t*.0005+rr)*5,BR*(.3+rr*.16),BR*(.22+rr*.12),0,0,6.283);c.stroke()}
 for(var m=0;m<N;m++){var t2=T[m];c.save();c.translate(t2.x,t2.y);c.rotate(t2.a);c.fillStyle='rgba(60,25,5,.35)';c.beginPath();c.arc(1.5,2.5,R,0,6.283);c.fill();c.fillStyle='#fff5e2';c.beginPath();c.arc(0,0,R,0,6.283);c.fill();c.fillStyle='hsl('+(m*47%360)+' 62% 42%)';c.font='800 19px system-ui,sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(t2.ch,0,1);c.restore()}
 splash=splash.filter(function(p){return s.t-p.t<500});splash.forEach(function(p){var k=(s.t-p.t)/500;c.strokeStyle='rgba(255,240,200,'+(1-k)*.8+')';c.lineWidth=2;c.beginPath();c.arc(p.x,p.y,6+k*50,0,6.283);c.stroke()});
 c.restore();
 var hl=c.createRadialGradient(cx-BR*.4,cy-BR*.5,2,cx-BR*.4,cy-BR*.5,BR*.5);hl.addColorStop(0,'rgba(255,255,255,.28)');hl.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=hl;c.beginPath();c.arc(cx,cy,BR,0,6.283);c.fill();
 },function(s){seed(s)});
s.click=function(x,y){splash.push({x:x,y:y,t:s.t});T.forEach(function(t){var dx=t.x-x,dy=t.y-y,d=Math.sqrt(dx*dx+dy*dy)+1;if(d<90){var k=(1-d/90)*3.2;t.vx+=dx/d*k;t.vy+=dy/d*k;t.w+=(Math.random()-.5)*.2}})};
})();
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
