<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Magnifying dock preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,560px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.dk{display:flex;justify-content:center;padding-top:34px}
.dk-bar{display:flex;align-items:flex-end;gap:10px;padding:10px 14px;border-radius:24px;background:color-mix(in srgb,var(--sc-surface) 85%,transparent);border:1px solid var(--sc-line);box-shadow:0 16px 36px -18px rgba(0,0,0,.5);backdrop-filter:blur(12px)}
.dk-item{position:relative;display:grid;place-items:center;width:52px;height:52px;border:0;border-radius:14px;background:var(--sc-bg);color:var(--sc-fg);cursor:pointer;transform-origin:50% 100%;transform:scale(var(--s,1));transition:transform .12s ease-out;border:1px solid var(--sc-line)}
.dk-item svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dk-item::after{content:attr(data-label);position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) scale(calc(1/var(--s,1)));padding:3px 9px;border-radius:8px;background:var(--sc-fg);color:var(--sc-bg);font-size:12px;white-space:nowrap;opacity:0;transition:opacity .15s;pointer-events:none}
.dk-item:hover::after,.dk-item:focus-visible::after{opacity:1}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="dk"><div class="dk-bar" role="toolbar" aria-label="Dock"><button class="dk-item" data-label="Home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button><button class="dk-item" data-label="Search" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button><button class="dk-item" data-label="Mail" aria-label="Mail"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></button><button class="dk-item" data-label="Music" aria-label="Music"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></button><button class="dk-item" data-label="Settings" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button></div></div>
</div>
<script>
(function(){var root=document.currentScript.previousElementSibling,bar=root.querySelector('.dk-bar'),items=[].slice.call(bar.querySelectorAll('.dk-item')),calm=matchMedia('(prefers-reduced-motion: reduce)');
function reset(){items.forEach(function(i){i.style.setProperty('--s',1)})}
bar.addEventListener('pointermove',function(e){if(calm.matches)return;items.forEach(function(item){var r=item.getBoundingClientRect(),d=e.clientX-(r.left+r.width/2);item.style.setProperty('--s',(1+.9*Math.exp(-(d*d)/(2*60*60))).toFixed(3))})});
bar.addEventListener('pointerleave',reset);})();
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
