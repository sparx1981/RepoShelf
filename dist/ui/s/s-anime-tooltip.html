<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Speech-bubble tooltip preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,520px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.sv{position:relative;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center;padding:28px 12px;min-height:150px}
.sv-p{position:absolute;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:5}
.sv-p.chip{border-radius:2px;width:8px;height:5px}
.sv-p.dust{width:10px;height:10px;opacity:.7}
.sv-w{position:absolute;pointer-events:none;z-index:6;font:900 italic 22px/1 system-ui,sans-serif;letter-spacing:.04em;color:var(--sc-accent);-webkit-text-stroke:1.5px var(--sc-fg);paint-order:stroke fill;white-space:nowrap}
.sv-tw{position:relative}
.sv-tb{padding:12px 22px;border:2px solid var(--sc-line);border-radius:12px;background:var(--sc-surface);font-weight:700;cursor:pointer}
.sv-tip{position:absolute;left:50%;bottom:calc(100% + 12px);transform:translateX(-50%) scale(0);transform-origin:50% 120%;padding:8px 14px;border-radius:12px;background:var(--sc-fg);color:var(--sc-bg);font-size:13px;font-weight:600;white-space:nowrap;transition:transform .38s cubic-bezier(.3,1.7,.5,1);pointer-events:none}
.sv-tip::after{content:'';position:absolute;left:50%;top:100%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--sc-fg)}
.sv-tw.open .sv-tip{transform:translateX(-50%) scale(1)}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="sv"><span class="sv-tw"><button class="sv-tb" aria-describedby="t1">Undo</button><span class="sv-tip" id="t1" role="tooltip">Take that back!</span></span><span class="sv-tw"><button class="sv-tb" aria-describedby="t2">Share</button><span class="sv-tip" id="t2" role="tooltip">Send it out</span></span><span class="sv-tw"><button class="sv-tb" aria-describedby="t3">Archive</button><span class="sv-tip" id="t3" role="tooltip">Tuck it away</span></span></div>
</div>
<script>
(function(){var root=document.currentScript.previousElementSibling,h=root.querySelector('.sv');
var rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
function fly(p,a,t){p.animate(a,{duration:t,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=function(){p.remove()}}
function burst(h,x,y,o){if(rm)return;o=o||{};var n=o.n||9,r=o.r||38,i,a,d,p;for(i=0;i<n;i++){a=o.arc?o.arc[0]+(o.arc[1]-o.arc[0])*i/Math.max(1,n-1):i/n*6.283;d=r*(.6+Math.random()*.7);p=document.createElement('i');p.className='sv-p '+(o.shape||'');p.style.left=x+'px';p.style.top=y+'px';p.style.background=o.c||'var(--sc-accent)';h.appendChild(p);fly(p,[{transform:'translate(-50%,-50%) rotate(0) scale(1)',opacity:1},{transform:'translate(calc(-50% + '+Math.cos(a)*d+'px),calc(-50% + '+Math.sin(a)*d+'px)) rotate(200deg) scale(.2)',opacity:0}],o.t||560)}}
function word(h,x,y,t,rot){if(rm)return;var s=document.createElement('b');s.className='sv-w';s.textContent=t;s.style.left=x+'px';s.style.top=y+'px';h.appendChild(s);rot=rot||-8;s.animate([{transform:'translate(-50%,-50%) rotate('+rot+'deg) scale(.3)',opacity:0},{transform:'translate(-50%,-90%) rotate('+rot+'deg) scale(1.2)',opacity:1,offset:.25},{transform:'translate(-50%,-150%) rotate('+rot+'deg) scale(1)',opacity:0}],{duration:760,easing:'ease-out'}).onfinish=function(){s.remove()}}
function mid(h,el){var a=h.getBoundingClientRect(),b=el.getBoundingClientRect();return[b.left-a.left+b.width/2,b.top-a.top+b.height/2]}
function squash(el,a,t){if(rm)return;el.animate(a,{duration:t||420,easing:'cubic-bezier(.3,1.6,.5,1)'})}
root.querySelectorAll('.sv-tw').forEach(function(w){var b=w.firstElementChild;function open(){if(w.classList.contains('open'))return;w.classList.add('open');var c=mid(h,b);burst(h,c[0],c[1]-b.offsetHeight/2-4,{n:5,r:18,arc:[-2.8,-.3],shape:'dust',c:'var(--sc-muted)',t:420})}function close(){w.classList.remove('open')}w.addEventListener('mouseenter',open);w.addEventListener('mouseleave',close);b.addEventListener('focus',open);b.addEventListener('blur',close);b.addEventListener('keydown',function(e){if(e.key==='Escape')close()})})})();
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
