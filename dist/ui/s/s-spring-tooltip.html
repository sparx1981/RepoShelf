<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spring tooltip preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,520px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.tp{display:flex;gap:14px;justify-content:center;padding:58px 0 20px}
.tp-wrap{position:relative}
.tp-btn{display:grid;place-items:center;width:48px;height:48px;border:1px solid var(--sc-line);border-radius:14px;background:var(--sc-surface);cursor:pointer}
.tp-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tp-tip{position:absolute;left:50%;bottom:calc(100% + 10px);padding:6px 11px;border-radius:9px;background:var(--sc-fg);color:var(--sc-bg);font-size:13px;white-space:nowrap;pointer-events:none;opacity:0;transform:translateX(-50%) translateY(6px) scale(.85);transform-origin:50% 100%;transition:opacity .15s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.tp-tip::after{content:"";position:absolute;left:50%;top:100%;width:8px;height:8px;margin:-4px 0 0 -4px;background:inherit;transform:rotate(45deg)}
.tp-wrap.is-flip .tp-tip{bottom:auto;top:calc(100% + 10px);transform-origin:50% 0}.tp-wrap.is-flip .tp-tip::after{top:0;margin-top:-4px}
.tp-wrap.is-open .tp-tip{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="tp"><div class="tp-wrap"><button class="tp-btn" aria-describedby="tip-1" aria-label="Copy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></button><span class="tp-tip" role="tooltip" id="tip-1">Copy link</span></div><div class="tp-wrap"><button class="tp-btn" aria-describedby="tip-2" aria-label="Share"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 11l7.6-4M8.2 13l7.6 4"/></svg></button><span class="tp-tip" role="tooltip" id="tip-2">Share with the team</span></div><div class="tp-wrap"><button class="tp-btn" aria-describedby="tip-3" aria-label="Archive"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/></svg></button><span class="tp-tip" role="tooltip" id="tip-3">Archive (A)</span></div></div>
</div>
<script>
(function(){var root=document.currentScript.previousElementSibling;
root.querySelectorAll('.tp-wrap').forEach(function(w){var btn=w.querySelector('.tp-btn');
function open(){var r=btn.getBoundingClientRect();w.classList.toggle('is-flip',r.top<70);w.classList.add('is-open')}function close(){w.classList.remove('is-open')}
w.addEventListener('mouseenter',open);w.addEventListener('mouseleave',close);btn.addEventListener('focus',open);btn.addEventListener('blur',close);btn.addEventListener('keydown',function(e){if(e.key==='Escape')close()})});})();
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
