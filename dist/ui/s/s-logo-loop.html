<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logo loop preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,760px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.ll{overflow:hidden;padding:18px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
.ll-track{display:flex;width:max-content;gap:48px;animation:ll-run 24s linear infinite}
.ll:hover .ll-track,.ll:focus-within .ll-track{animation-play-state:paused}
.ll-logo{display:inline-flex;align-items:center;gap:10px;color:var(--sc-muted);font-weight:700;font-size:20px;letter-spacing:-.02em;white-space:nowrap;transition:color .2s}.ll-logo:hover{color:var(--sc-fg)}
.ll-logo svg{width:26px;height:26px;fill:currentColor}
@keyframes ll-run{to{transform:translateX(calc(-50% - 24px))}}
@media (prefers-reduced-motion:reduce){.ll-track{animation:none;flex-wrap:wrap;width:auto;justify-content:center}.ll-track [aria-hidden=true]{display:none}.ll{-webkit-mask-image:none;mask-image:none}}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="ll" role="group" aria-label="Trusted by"><div class="ll-track"><span class="ll-logo"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>Orbit</span><span class="ll-logo"><svg viewBox="0 0 24 24"><path d="M12 2l10 20H2z"/></svg>Summit</span><span class="ll-logo"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/></svg>Cubic</span><span class="ll-logo"><svg viewBox="0 0 24 24"><path d="M12 2l3 7 7 .6-5.3 4.6 1.7 7.3L12 17.8 5.6 21.5l1.7-7.3L2 9.6 9 9z"/></svg>Starling</span><span class="ll-logo"><svg viewBox="0 0 24 24"><path d="M3 12c4-8 14-8 18 0-4 8-14 8-18 0z"/></svg>Lumen</span><span class="ll-logo"><svg viewBox="0 0 24 24"><path d="M4 4h16v6H4zM4 14h10v6H4z"/></svg>Stackly</span><span class="ll-logo" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>Orbit</span><span class="ll-logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2l10 20H2z"/></svg>Summit</span><span class="ll-logo" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/></svg>Cubic</span><span class="ll-logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2l3 7 7 .6-5.3 4.6 1.7 7.3L12 17.8 5.6 21.5l1.7-7.3L2 9.6 9 9z"/></svg>Starling</span><span class="ll-logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 12c4-8 14-8 18 0-4 8-14 8-18 0z"/></svg>Lumen</span><span class="ll-logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 4h16v6H4zM4 14h10v6H4z"/></svg>Stackly</span></div></div>
</div>
<script>
/* Pure CSS component: no script required. */
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
