<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glow bento grid preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,860px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.gb{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:120px;gap:12px}
.gb-card{position:relative;padding:18px;border-radius:18px;background:var(--sc-surface);border:1px solid var(--sc-line);overflow:hidden}
.gb-card::after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;background:radial-gradient(220px circle at var(--mx,-200px) var(--my,-200px),var(--sc-accent),transparent 65%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none}
.gb-card strong{display:block;font-size:15px}.gb-card span{color:var(--sc-muted);font-size:13px}
.gb-a{grid-column:span 2;grid-row:span 2}.gb-b{grid-column:span 2}.gb-c{grid-row:span 2}.gb-big{display:block;margin-top:10px;font-size:44px;font-weight:700;letter-spacing:-.03em;color:var(--sc-fg)}
@media (max-width:640px){.gb{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="gb"><div class="gb-card gb-a"><strong>Weekly active teams</strong><span>Compared with last month</span><b class="gb-big">12,480</b></div><div class="gb-card gb-b"><strong>Deploys</strong><span>214 this week</span></div><div class="gb-card gb-c"><strong>Uptime</strong><span>Last 90 days</span><b class="gb-big" style="font-size:30px">99.98%</b></div><div class="gb-card"><strong>Latency</strong><span>p95 · 184ms</span></div><div class="gb-card"><strong>Errors</strong><span>0.02%</span></div></div>
</div>
<script>
(function(){var root=document.currentScript.previousElementSibling,grid=root.querySelector('.gb');
grid.addEventListener('pointermove',function(e){grid.querySelectorAll('.gb-card').forEach(function(c){var r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px')})});
grid.addEventListener('pointerleave',function(){grid.querySelectorAll('.gb-card').forEach(function(c){c.style.setProperty('--mx','-200px');c.style.setProperty('--my','-200px')})});})();
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
