<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Echo type preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,780px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.ec{position:relative;display:grid;place-items:center;min-height:330px;border:1px solid var(--sc-line);border-radius:28px;background:var(--sc-surface);overflow:hidden}
.ec-stack{position:relative;display:grid;place-items:center;padding:10px 24px}
.ec-word,.ec-ghost{margin:0;font:900 clamp(50px,13.5vw,116px)/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.055em;white-space:nowrap}
.ec-ghost{position:absolute;inset:0;display:grid;place-items:center;color:transparent;-webkit-text-stroke:1.6px hsl(calc(262 + var(--i)*13) 92% 66%);opacity:calc(.95 - var(--i)*.1);pointer-events:none;will-change:transform}
.ec-word{position:relative;will-change:transform}
.ec-hint{position:absolute;bottom:16px;left:0;right:0;margin:0;text-align:center;font-size:13px;color:var(--sc-muted)}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="ec"><div class="ec-stack"><h2 class="ec-word">Afterglow</h2></div><p class="ec-hint">Move across the word</p></div>
</div>
<script>
(function(){var root=document.currentScript.previousElementSibling.querySelector('.ec'),stack=root.querySelector('.ec-stack'),word=root.querySelector('.ec-word');
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,N=8,ghosts=[],pos=[],tx=0,ty=0,active=false,raf=0,visible=true;
for(var i=N;i>=1;i--){var g=document.createElement('div');g.className='ec-ghost';g.setAttribute('aria-hidden','true');g.style.setProperty('--i',i);g.textContent=word.textContent;stack.insertBefore(g,word);ghosts.unshift(g)}
for(var j=0;j<=N;j++)pos.push({x:0,y:0});
function frame(now){raf=0;var t=now/1000;if(!active){tx=Math.sin(t*.9)*70;ty=Math.cos(t*1.35)*26}
 pos[0].x+=(tx-pos[0].x)*.18;pos[0].y+=(ty-pos[0].y)*.18;
 for(var k=1;k<=N;k++){pos[k].x+=(pos[k-1].x-pos[k].x)*.24;pos[k].y+=(pos[k-1].y-pos[k].y)*.24}
 word.style.transform='translate('+(pos[0].x*.4).toFixed(2)+'px,'+(pos[0].y*.4).toFixed(2)+'px)';
 ghosts.forEach(function(g,idx){var p=pos[idx+1];g.style.transform='translate('+p.x.toFixed(2)+'px,'+p.y.toFixed(2)+'px)'});
 if(visible)raf=requestAnimationFrame(frame)}
function go(){if(!raf&&visible&&!reduce)raf=requestAnimationFrame(frame)}
root.addEventListener('pointermove',function(e){var r=root.getBoundingClientRect();active=true;tx=Math.max(-170,Math.min(170,(e.clientX-r.left-r.width/2)*.7));ty=Math.max(-70,Math.min(70,(e.clientY-r.top-r.height/2)*.5))});
root.addEventListener('pointerleave',function(){active=false});
if('IntersectionObserver' in window)new IntersectionObserver(function(es){visible=es[0].isIntersecting;go()}).observe(root);
if(reduce){ghosts.forEach(function(g,idx){g.style.transform='translate('+(idx+1)*7+'px,'+(idx+1)*3+'px)'})}go();})();
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
