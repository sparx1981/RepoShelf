<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tilt card preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,520px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.tc-wrap{perspective:900px;display:grid;place-items:center}
.tc{position:relative;width:min(100%,340px);border-radius:22px;border:1px solid var(--sc-line);background:var(--sc-surface);overflow:hidden;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .35s cubic-bezier(.2,.8,.2,1);will-change:transform;box-shadow:0 18px 40px -22px rgba(0,0,0,.45)}
.tc.is-active{transition:transform .08s linear}
.tc-art{height:170px;background:linear-gradient(135deg,var(--sc-accent),#22d3ee 60%,#f472b6)}
.tc-body{padding:18px 20px 22px}.tc-body h3{margin:0 0 4px;font-size:18px}.tc-body p{margin:0;color:var(--sc-muted);font-size:14px}
.tc-glare{position:absolute;inset:0;background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.55),transparent 55%);opacity:0;transition:opacity .25s;mix-blend-mode:soft-light;pointer-events:none}
.tc.is-active .tc-glare{opacity:1}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="tc-wrap"><article class="tc"><div class="tc-art"></div><div class="tc-body"><h3>Northern lights</h3><p>Move your pointer across the card.</p></div><div class="tc-glare"></div></article></div>
</div>
<script>
(function(){var root=document.currentScript.previousElementSibling,card=root.querySelector('.tc'),calm=matchMedia('(prefers-reduced-motion: reduce)');
card.addEventListener('pointermove',function(e){if(calm.matches)return;var r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;card.classList.add('is-active');card.style.setProperty('--ry',((x-.5)*20)+'deg');card.style.setProperty('--rx',((.5-y)*20)+'deg');card.style.setProperty('--gx',(x*100)+'%');card.style.setProperty('--gy',(y*100)+'%')});
card.addEventListener('pointerleave',function(){card.classList.remove('is-active');card.style.setProperty('--rx','0deg');card.style.setProperty('--ry','0deg')});})();
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
