<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ink outline preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,780px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.ink{display:grid;gap:12px;justify-items:center;padding:36px 20px 28px;border:1px solid var(--sc-line);border-radius:28px;background:var(--sc-surface)}
.ink-svg{width:100%;height:auto;max-width:700px}
.ink-text{font:900 170px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.04em}
.ink-l{fill:url(#ink-g);fill-opacity:0;stroke:url(#ink-g);stroke-width:2.4;stroke-linejoin:round;stroke-dasharray:1400;stroke-dashoffset:1400}
.ink.run .ink-l{animation:ink-draw 1.5s cubic-bezier(.6,0,.3,1) forwards calc(var(--n)*.12s),ink-fill .8s ease forwards calc(var(--n)*.12s + 1.25s)}
.ink-btn{padding:9px 18px;border:1px solid var(--sc-line);border-radius:999px;background:var(--sc-bg);cursor:pointer;font-size:14px;font-weight:600}
.ink-btn:hover{border-color:var(--sc-accent)}
@keyframes ink-draw{to{stroke-dashoffset:0}}
@keyframes ink-fill{to{fill-opacity:1}}
@media (prefers-reduced-motion:reduce){.ink-l{stroke-dashoffset:0;fill-opacity:1;animation:none!important}}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="ink run"><svg class="ink-svg" viewBox="0 0 800 260" role="img"><title>Sketch it</title><defs><linearGradient id="ink-g" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="740" y2="0"><stop offset="0" stop-color="#7c5cff"/><stop offset=".55" stop-color="#d64bff"/><stop offset="1" stop-color="#ff7a59"/></linearGradient></defs><text class="ink-text" x="400" y="190" text-anchor="middle"><tspan class="ink-l" style="--n:0">S</tspan><tspan class="ink-l" style="--n:1">k</tspan><tspan class="ink-l" style="--n:2">e</tspan><tspan class="ink-l" style="--n:3">t</tspan><tspan class="ink-l" style="--n:4">c</tspan><tspan class="ink-l" style="--n:5">h</tspan></text></svg><button class="ink-btn" type="button">Replay</button></div>
</div>
<script>
(function(){var root=document.currentScript.previousElementSibling.querySelector('.ink'),btn=root.querySelector('.ink-btn'),timer=0;
function play(){clearTimeout(timer);root.classList.remove('run');void root.getBoundingClientRect();root.classList.add('run');timer=setTimeout(play,8000)}
btn.addEventListener('click',play);if(matchMedia('(prefers-reduced-motion:reduce)').matches){clearTimeout(timer)}else{play()}})();
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
