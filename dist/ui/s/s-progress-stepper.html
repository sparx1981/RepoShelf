<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Progress stepper preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,700px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.st{display:grid;gap:26px}
.st-track{position:relative;display:flex;justify-content:space-between}
.st-line{position:absolute;left:18px;right:18px;top:17px;height:3px;border-radius:2px;background:var(--sc-line)}
.st-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:2px;background:var(--sc-accent);transition:width .5s cubic-bezier(.3,.9,.3,1)}
.st-step{position:relative;display:grid;justify-items:center;gap:8px;width:76px;font-size:13px;color:var(--sc-muted)}
.st-dot{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--sc-bg);border:2px solid var(--sc-line);font-weight:600;transition:all .35s}
.st-dot svg{width:18px;height:18px;fill:none;stroke:var(--sc-accent-fg);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .4s .15s}
.st-step.is-done .st-dot{background:var(--sc-accent);border-color:var(--sc-accent)}.st-step.is-done .st-dot span{display:none}.st-step.is-done .st-dot svg{stroke-dashoffset:0}
.st-step.is-current .st-dot{border-color:var(--sc-accent);box-shadow:0 0 0 5px var(--sc-ring);color:var(--sc-fg)}.st-step.is-current{color:var(--sc-fg)}
.st-actions{display:flex;justify-content:space-between}.st-actions button{padding:9px 20px;border-radius:999px;border:1px solid var(--sc-line);background:var(--sc-surface);cursor:pointer}.st-actions button:last-child{background:var(--sc-accent);color:var(--sc-accent-fg);border-color:var(--sc-accent)}.st-actions button:disabled{opacity:.4;cursor:not-allowed}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="st"><div class="st-track"><div class="st-line"><div class="st-fill"></div></div><div class="st-step"><div class="st-dot"><span>1</span><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>Account</div><div class="st-step"><div class="st-dot"><span>2</span><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>Profile</div><div class="st-step"><div class="st-dot"><span>3</span><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>Plan</div><div class="st-step"><div class="st-dot"><span>4</span><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>Done</div></div><p class="st-live" role="status" aria-live="polite" style="margin:0;text-align:center;color:var(--sc-muted);font-size:14px"></p><div class="st-actions"><button data-act="back">Back</button><button data-act="next">Continue</button></div></div>
</div>
<script>
(function(){var root=document.currentScript.previousElementSibling,steps=[].slice.call(root.querySelectorAll('.st-step')),fill=root.querySelector('.st-fill'),live=root.querySelector('.st-live'),back=root.querySelector('[data-act=back]'),next=root.querySelector('[data-act=next]'),i=1;
function paint(){steps.forEach(function(s,n){s.classList.toggle('is-done',n<i);s.classList.toggle('is-current',n===i);if(n===i)s.setAttribute('aria-current','step');else s.removeAttribute('aria-current')});fill.style.width=(i/(steps.length-1)*100)+'%';back.disabled=i===0;next.textContent=i===steps.length-1?'Finish':'Continue';live.textContent='Step '+(i+1)+' of '+steps.length+': '+steps[i].textContent.replace(/[0-9]/g,'').trim()}
back.addEventListener('click',function(){if(i>0){i--;paint()}});next.addEventListener('click',function(){if(i<steps.length-1){i++;paint()}else{i=0;paint()}});paint();})();
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
