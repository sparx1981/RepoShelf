<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Squish switch preview</title>
<style>html,body{margin:0}body{min-height:100vh}.sc-stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;background:var(--sc-bg)}.sc-stage>.sc{width:min(100%,460px);background:transparent}</style>
<style>
.sc{--sc-bg:#ffffff;--sc-fg:#111113;--sc-muted:#6b7280;--sc-line:#e4e4e7;--sc-surface:#f5f5f7;--sc-accent:#6d5ef5;--sc-accent-fg:#ffffff;--sc-ring:rgba(109,94,245,.35);color:var(--sc-fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
.sc *,.sc *::before,.sc *::after{box-sizing:inherit}
.sc[data-theme=dark]{--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}
@media (prefers-color-scheme:dark){.sc:not([data-theme=light]){--sc-bg:#0b0b0d;--sc-fg:#f4f4f5;--sc-muted:#a1a1aa;--sc-line:#2a2a30;--sc-surface:#16161a;--sc-accent:#a597ff;--sc-accent-fg:#0b0b0d;--sc-ring:rgba(165,151,255,.4)}}
:where(.sc) button{font:inherit;color:inherit}
:where(.sc) :focus-visible{outline:2px solid var(--sc-accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sc *,.sc *::before,.sc *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.qs{display:grid;gap:16px}
.qs-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 18px;border:1px solid var(--sc-line);border-radius:16px;background:var(--sc-surface)}
.qs-row span{font-size:15px}
.qs-sw{position:relative;width:58px;height:34px;padding:0;border:0;border-radius:999px;background:var(--sc-line);cursor:pointer;transition:background .3s}
.qs-sw[aria-checked=true]{background:var(--sc-accent)}
.qs-knob{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:999px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .45s cubic-bezier(.34,1.7,.5,1),width .2s}
.qs-sw[aria-checked=true] .qs-knob{transform:translateX(24px)}
.qs-sw:active .qs-knob{width:34px}.qs-sw[aria-checked=true]:active .qs-knob{transform:translateX(16px)}
</style></head>
<body><div class="sc-stage sc" id="stage"><div class="sc" id="demo">
<div class="qs"><label class="qs-row"><span>Notifications</span><button class="qs-sw" role="switch" aria-checked="true" aria-label="Notifications"><i class="qs-knob"></i></button></label><label class="qs-row"><span>Dark mode</span><button class="qs-sw" role="switch" aria-checked="false" aria-label="Dark mode"><i class="qs-knob"></i></button></label><label class="qs-row"><span>Auto-save</span><button class="qs-sw" role="switch" aria-checked="true" aria-label="Auto-save"><i class="qs-knob"></i></button></label></div>
</div>
<script>
(function(){var root=document.currentScript.previousElementSibling;
root.querySelectorAll('.qs-sw').forEach(function(sw){sw.addEventListener('click',function(e){e.preventDefault();sw.setAttribute('aria-checked',String(sw.getAttribute('aria-checked')!=='true'))})});})();
</script>
</div>
<script>
(function(){var q=new URLSearchParams(location.search).get('theme'),stage=document.getElementById('stage'),demo=document.getElementById('demo');var t=q==='dark'?'dark':'light';stage.dataset.theme=t;demo.dataset.theme=t})();
</script></body></html>
