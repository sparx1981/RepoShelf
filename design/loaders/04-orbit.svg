<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Loading">
  <title>Loading</title>
  <style>
    .track{fill:none;stroke:#d6fb79;stroke-width:3;opacity:.16}
    .runner{fill:none;stroke:#d6fb79;stroke-width:5;stroke-linecap:round;stroke-dasharray:.2 .8;animation:orbit 1.6s linear infinite}
    @keyframes orbit{from{stroke-dashoffset:0}to{stroke-dashoffset:-1}}
    @media (prefers-reduced-motion:reduce){.runner{animation:none}}
  </style>
  <rect class="track" x="22" y="22" width="156" height="156" rx="40"/>
  <rect class="runner" pathLength="1" x="22" y="22" width="156" height="156" rx="40"/>
  <g transform="translate(100 100) scale(.88) translate(-100 -100)">
    <rect x="40" y="40" width="120" height="120" rx="29" fill="#d6fb79"/>
    <g fill="none" stroke="#111113" stroke-width="14">
      <path d="M78 69V131"/>
      <path d="M78 102V94A18 18 0 0 1 96 76H106"/>
    </g>
    <circle cx="122" cy="124" r="7.5" fill="#111113"/>
  </g>
</svg>
