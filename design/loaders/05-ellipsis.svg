<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Loading">
  <title>Loading</title>
  <style>
    .d{transform-origin:center;transform-box:fill-box;animation-duration:1.8s;animation-iteration-count:infinite}
    .d2{animation-name:d2}
    .d3{animation-name:d3}
    @keyframes d2{0%,30%{transform:scale(0)}38%{transform:scale(1.35)}46%,92%{transform:scale(1)}100%{transform:scale(0)}}
    @keyframes d3{0%,58%{transform:scale(0)}66%{transform:scale(1.35)}74%,92%{transform:scale(1)}100%{transform:scale(0)}}
    @media (prefers-reduced-motion:reduce){.d{animation:none;transform:none}}
  </style>
  <rect x="40" y="40" width="120" height="120" rx="29" fill="#d6fb79"/>
  <g fill="none" stroke="#111113" stroke-width="14">
    <path d="M62 69V131"/>
    <path d="M62 102V94A18 18 0 0 1 80 76H90"/>
  </g>
  <g fill="#111113">
    <circle cx="106" cy="124.500" r="6.500"/>
    <circle class="d d2" cx="124" cy="124.500" r="6.500"/>
    <circle class="d d3" cx="142" cy="124.500" r="6.500"/>
  </g>
</svg>
