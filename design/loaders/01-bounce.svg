<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Loading">
  <title>Loading</title>
  <style>
    .dot{transform-origin:122px 131px;animation:hop 1.1s infinite}
    .shadow{transform-origin:122px 133px;animation:shadow 1.1s infinite}
    @keyframes hop{
      0%{transform:translateY(0) scale(1.25,.7);animation-timing-function:cubic-bezier(.2,.7,.3,1)}
      12%{transform:translateY(0) scale(.92,1.1);animation-timing-function:cubic-bezier(.2,.7,.3,1)}
      50%{transform:translateY(-34px) scale(1,1);animation-timing-function:cubic-bezier(.7,0,.8,.3)}
      88%{transform:translateY(0) scale(1,1)}
      100%{transform:translateY(0) scale(1.25,.7)}
    }
    @keyframes shadow{0%,100%{transform:scale(1.2);opacity:.28}50%{transform:scale(.55);opacity:.12}}
    @media (prefers-reduced-motion:reduce){.dot,.shadow{animation:none}}
  </style>
  <rect x="40" y="40" width="120" height="120" rx="29" fill="#d6fb79"/>
  <g fill="none" stroke="#111113" stroke-width="14">
    <path d="M78 69V131"/>
    <path d="M78 102V94A18 18 0 0 1 96 76H106"/>
  </g>
  <ellipse class="shadow" cx="122" cy="133" rx="9" ry="2.5" fill="#111113"/>
  <circle class="dot" cx="122" cy="124" r="7.5" fill="#111113"/>
</svg>
