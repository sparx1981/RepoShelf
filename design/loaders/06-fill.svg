<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Loading">
  <title>Loading</title>
  <defs>
    <!-- Both gradients share one hard edge that rises and falls: below it the tile is lime and the letters dark, above it the reverse. -->
    <linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="0" y1="40" x2="0" y2="160">
      <stop offset="0" stop-color="#d6fb79" stop-opacity="0"/>
      <stop offset="1" stop-color="#d6fb79" stop-opacity="0">
        <animate attributeName="offset" dur="3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.45;.55;1" keySplines=".4 0 .2 1;0 0 1 1;.4 0 .2 1" values="1;0;0;1"/>
      </stop>
      <stop offset="1" stop-color="#d6fb79">
        <animate attributeName="offset" dur="3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.45;.55;1" keySplines=".4 0 .2 1;0 0 1 1;.4 0 .2 1" values="1;0;0;1"/>
      </stop>
      <stop offset="1" stop-color="#d6fb79"/>
    </linearGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="40" x2="0" y2="160">
      <stop offset="0" stop-color="#d6fb79"/>
      <stop offset="1" stop-color="#d6fb79">
        <animate attributeName="offset" dur="3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.45;.55;1" keySplines=".4 0 .2 1;0 0 1 1;.4 0 .2 1" values="1;0;0;1"/>
      </stop>
      <stop offset="1" stop-color="#111113">
        <animate attributeName="offset" dur="3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.45;.55;1" keySplines=".4 0 .2 1;0 0 1 1;.4 0 .2 1" values="1;0;0;1"/>
      </stop>
      <stop offset="1" stop-color="#111113"/>
    </linearGradient>
  </defs>
  <rect x="41.500" y="41.500" width="117" height="117" rx="27.500" fill="url(#tile)" stroke="#d6fb79" stroke-width="3"/>
  <g fill="none" stroke="url(#ink)" stroke-width="14">
    <path d="M78 69V131"/>
    <path d="M78 102V94A18 18 0 0 1 96 76H106"/>
  </g>
  <circle cx="122" cy="124" r="7.5" fill="url(#ink)"/>
</svg>
