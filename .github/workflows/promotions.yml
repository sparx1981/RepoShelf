name: Check promotion availability
on:
  workflow_dispatch:
  schedule:
    - cron: '43 * * * *'
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true' # GitHub is retiring Node 20 for JavaScript actions: run them on Node 24 already

permissions:
  contents: read
concurrency:
  group: reposhelf-promotions
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Unpack saved catalogue data
        run: node scripts/data-packing.mjs unpack
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile test payments and promotion availability
        env:
          REPOSHELF_PROMOTION_SYNC_KEY: ${{ secrets.REPOSHELF_PROMOTION_SYNC_KEY }}
          REPOSHELF_PUBLIC_URL: https://reposhelf.vercel.app
        run: node scripts/sync-promotions.mjs
