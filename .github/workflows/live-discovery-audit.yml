name: Verify production discovery
on:
  push:
    branches: [codex/live-discovery-audit-20261012]
permissions:
  contents: read
jobs:
  public-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/audit-discovery.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for production and audit public discovery
        run: |
          node --input-type=module <<'AUDIT'
          import {auditDiscovery} from './scripts/audit-discovery.mjs';
          import {mkdir,writeFile} from 'node:fs/promises';
          let last;
          for(let attempt=0;attempt<40;attempt++){
           try{const report=await auditDiscovery('https://www.reposhelf.co.uk',{allowEmpty:true});await mkdir('artifacts',{recursive:true});await writeFile('artifacts/discovery-live.json',JSON.stringify(report,null,2));console.log('Production discovery audit: '+JSON.stringify(report));last=null;break}catch(error){last=error;console.log('Awaiting production release: '+error.message);if(attempt<39)await new Promise(resolve=>setTimeout(resolve,15000))}
          }
          if(last)throw last;
          AUDIT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-discovery-report
          path: artifacts/discovery-live.json
          retention-days: 3
