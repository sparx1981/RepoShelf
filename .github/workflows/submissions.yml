name: Scan submitted repositories
on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: 'Optional single submission to check first'
        required: false
        type: string
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths: ['scripts/import-submissions.mjs', 'scripts/submission-imports.mjs', 'scripts/submission-quality.mjs', '.github/workflows/submissions.yml']
permissions:
  contents: write
  actions: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.queue.outputs.ready }}
    steps:
      - name: Check configuration and catalogue availability
        id: check
        env:
          REPOSHELF_SUBMISSION_SYNC_KEY: ${{ secrets.REPOSHELF_SUBMISSION_SYNC_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          let ready=false;
          if((process.env.REPOSHELF_SUBMISSION_SYNC_KEY||'').length>=32){
            try{
              const response=await fetch('https://api.github.com/repos/sparx1981/RepoShelf/actions/runs?per_page=50',{headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+process.env.GITHUB_TOKEN},signal:AbortSignal.timeout(10000)});
              if(!response.ok)throw Error('History unavailable');
              const runs=(await response.json()).workflow_runs;
              if(!Array.isArray(runs))throw Error('Invalid history');
              ready=!runs.some(run=>run.status!=='completed'&&['.github/workflows/catalog.yml','.github/workflows/publication.yml'].includes(run.path));
              console.log(ready?'Submission scanner ready.':'Catalogue refresh active or queued; submissions remain queued for a later scan.');
            }catch{console.log('Catalogue availability could not be checked; submissions retained for retry.')}
          }else console.log('Submission scan awaits configuration; catalogue queue left untouched.');
          appendFileSync(process.env.GITHUB_OUTPUT,'ready='+ready+'\n');
          JS
      # Restoring the saved catalogue takes about six minutes, so the scan only starts when someone has submitted a repository that is
      # due. This also shows a missing database update in seconds, as its own failed step, instead of after the restore.
      - name: Check submissions database access
        id: queue
        env:
          REPOSHELF_SUBMISSION_SYNC_KEY: ${{ secrets.REPOSHELF_SUBMISSION_SYNC_KEY }}
          REPOSHELF_PUBLIC_URL: https://reposhelf.vercel.app
          SUBMISSION_ID: ${{ inputs.submission_id }}
          CATALOGUE_READY: ${{ steps.check.outputs.ready }}
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          const out=ready=>appendFileSync(process.env.GITHUB_OUTPUT,'ready='+ready+'\n');
          if(process.env.CATALOGUE_READY!=='true'){out(false);process.exit(0)}
          const origin=process.env.REPOSHELF_PUBLIC_URL||'https://reposhelf.vercel.app';
          let response,data;
          try{
            response=await fetch(origin+'/api/submissions?action=pending',{method:'POST',headers:{Authorization:'Bearer '+process.env.REPOSHELF_SUBMISSION_SYNC_KEY,'Content-Type':'application/json'},body:JSON.stringify({id:process.env.SUBMISSION_ID||null,requireVersion:2}),signal:AbortSignal.timeout(20000)});
            data=await response.json().catch(()=>({}));
          }catch{console.log('The website could not be reached; submissions stay queued for the next check.');out(false);process.exit(0)}
          if(response.ok&&data.version!==2){console.log('The submission API update is not deployed yet; requests remain queued.');out(false);process.exit(0)}
          if(response.ok){console.log(data.pending?'Submissions are waiting; starting the scan.':'No submissions are due; nothing to scan.');out(data.pending===true);process.exit(0)}
          const code=data?.error?.code,message=data?.error?.message||'Request failed';
          if(code==='migration_required'){console.log('::error::The submissions database tables are missing. Apply migrations 7 and 26 (supabase/migrations/202610080026_submission_quality_cancellation.sql) in the Supabase SQL editor, then run this check again.');out(false);process.exit(1)}
          if(response.status===401||response.status===403){console.log('::error::The website rejected REPOSHELF_SUBMISSION_SYNC_KEY. The value in GitHub Actions secrets must match the one in Vercel.');out(false);process.exit(1)}
          console.log('The submissions queue could not be read ('+response.status+': '+message+'); submissions stay queued for the next check.');out(false);
          JS
  scan:
    needs: readiness
    if: needs.readiness.outputs.ready == 'true'
    concurrency:
      group: reposhelf-catalog
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      REPOSHELF_SUBMISSION_SYNC_KEY: ${{ secrets.REPOSHELF_SUBMISSION_SYNC_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      SUBMISSION_ID: ${{ inputs.submission_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Unpack saved catalogue data
        run: node scripts/data-packing.mjs unpack
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install submission validation browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Restore accumulated catalogue changes
        run: node scripts/publish-catalog.mjs restore
      - name: Refresh listing exclusions
        run: node scripts/sync-listing-controls.mjs
      - name: Validate submitted demos, capture screenshots and save README context
        run: node scripts/import-submissions.mjs
      - name: Save imported repositories for daily publication
        env:
          SYNC_PUBLICATION_PHASE: deferred
        run: |
          if [ ! -f .submission-results.json ]; then exit 0; fi
          if ! node -e "process.exit(JSON.parse(require('fs').readFileSync('.submission-results.json')).length ? 0 : 1)"; then exit 0; fi
          node scripts/publish-catalog.mjs
      - name: Save private submission results
        run: |
          if [ -f .submission-results.json ]; then node scripts/import-submissions.mjs finish; fi
