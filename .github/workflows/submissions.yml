name: Scan submitted repositories
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths: ['scripts/import-submissions.mjs', 'scripts/submission-imports.mjs', '.github/workflows/submissions.yml']
permissions:
  contents: write
  actions: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check configuration and catalogue availability
        id: check
        env:
          REPOSHELF_SUBMISSION_SYNC_KEY: ${{ secrets.REPOSHELF_SUBMISSION_SYNC_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          let ready=false;
          if((process.env.REPOSHELF_SUBMISSION_SYNC_KEY||'').length>=32){
            try{
              const response=await fetch('https://api.github.com/repos/sparx1981/RepoShelf/actions/runs?per_page=50',{headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+process.env.GITHUB_TOKEN},signal:AbortSignal.timeout(10000)});
              if(!response.ok)throw Error('History unavailable');
              const runs=(await response.json()).workflow_runs;
              if(!Array.isArray(runs))throw Error('Invalid history');
              ready=!runs.some(run=>run.status!=='completed'&&['.github/workflows/catalog.yml','.github/workflows/publication.yml'].includes(run.path));
              console.log(ready?'Submission scanner ready.':'Catalogue refresh active or queued; submissions remain queued for a later scan.');
            }catch{console.log('Catalogue availability could not be checked; submissions retained for retry.')}
          }else console.log('Submission scan awaits configuration; catalogue queue left untouched.');
          appendFileSync(process.env.GITHUB_OUTPUT,'ready='+ready+'\n');
          JS
  scan:
    needs: readiness
    if: needs.readiness.outputs.ready == 'true'
    concurrency:
      group: reposhelf-catalog
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REPOSHELF_SUBMISSION_SYNC_KEY: ${{ secrets.REPOSHELF_SUBMISSION_SYNC_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore accumulated catalogue changes
        run: node scripts/publish-catalog.mjs restore
      - name: Refresh listing exclusions
        run: node scripts/sync-listing-controls.mjs
      - name: Import submissions and save README context
        run: node scripts/import-submissions.mjs
      - name: Save imported repositories for daily publication
        env:
          SYNC_PUBLICATION_PHASE: deferred
        run: |
          if [ ! -f .submission-results.json ]; then exit 0; fi
          if ! node -e "process.exit(JSON.parse(require('fs').readFileSync('.submission-results.json')).length ? 0 : 1)"; then exit 0; fi
          node scripts/publish-catalog.mjs
      - name: Save private submission results
        run: |
          if [ -f .submission-results.json ]; then node scripts/import-submissions.mjs finish; fi
