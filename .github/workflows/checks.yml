name: Check application
on:
  push:
    branches: [main]
    paths:
      - 'dist/*.js'
      - 'dist/*.html'
      - 'dist/*.css'
      - 'dist/*.webmanifest'
      - 'scripts/**'
      - 'lib/**'
      - 'api/**'
      - 'vercel.json'
      - 'tests/**'
      - 'supabase/**'
      - 'package.json'
      - '.github/workflows/checks.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-ci-password
          POSTGRES_DB: reposhelf_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d reposhelf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Unpack saved catalogue data
        run: node scripts/data-packing.mjs unpack
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install agent server dependencies
        run: npm install --package-lock=false
      - name: Validate application and source logic
        run: npm test && npm run test:mcp && npm run build
      - name: Verify database migration and permissions
        env:
          PGPASSWORD: local-ci-password
        run: |
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f tests/database-bootstrap.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610030001_accounts_editorial_analytics.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610030002_admin_user_management.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610030003_unique_visitors.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610030004_account_forks.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610030005_bookmarks_and_legal.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610030006_promotions.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610030007_repository_submissions.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610040008_editorial_discovery_qa.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610040009_discovery_history.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610040010_launch_quality_moderation_analytics.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610040011_account_data_controls.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f tests/database-account-data.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610050012_reposhelf_popularity.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f tests/database-reposhelf-popularity.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610050013_capture_providers.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f tests/database-capture-providers.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f tests/database-launch.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f tests/database-discovery-history.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f tests/database-editorial-qa.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f tests/database-legal.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f tests/database-forks.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f tests/database-permissions.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f tests/database-visitors.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f tests/database-roles.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f tests/database-promotions.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f tests/database-submissions.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610060014_subject_taxonomy.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f tests/database-taxonomy.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610060015_expanded_categories.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f tests/database-expanded-categories.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610060016_legal_version_2.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f tests/database-legal-v2.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610060017_mcp_gate.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610060017_mcp_gate.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f tests/database-mcp-gate.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610060018_more_subjects.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610060019_merge_accounts.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610060019_merge_accounts.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f tests/database-merge.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610060020_mcp_keys.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610060020_mcp_keys.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f tests/database-mcp-keys.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610060021_demo_viewer.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610060021_demo_viewer.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610060022_demo_viewer_v2.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610060022_demo_viewer_v2.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610070023_viewer_admin_preview.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610070023_viewer_admin_preview.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f tests/database-viewer.sql
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify catalog search, sources, tracking, and responsive layout
        run: node scripts/verify-taxonomy-ui.mjs && node scripts/verify-browser-pool.mjs && node scripts/verify-public-launch-ui.mjs && node scripts/verify-launch-ui.mjs && node scripts/verify-pwa-ui.mjs && node scripts/verify-browsing-ui.mjs && node scripts/verify-ui.mjs && node scripts/verify-accounts-ui.mjs && node scripts/verify-legal-ui.mjs && node scripts/verify-promotions-ui.mjs && node scripts/verify-submissions-ui.mjs && node scripts/verify-qa-ui.mjs && node scripts/verify-journey-ui.mjs && node scripts/verify-merge-ui.mjs && node scripts/verify-connector-ui.mjs && node scripts/verify-viewer-qualify.mjs && node scripts/verify-viewer-ui.mjs
      - name: Verify deployed agent routes
        if: github.event_name == 'push'
        run: node scripts/verify-deployed-api.mjs && REPOSHELF_VERIFY_LIVE_ADMIN=true node scripts/verify-accounts-ui.mjs
      - name: Save storefront screenshots
        uses: actions/upload-artifact@v4
        with:
          name: storefront-preview
          path: |
            account-data-mobile.png
            discovery-guide-mobile.png
            quality-mobile.png
            reports-mobile.png
            ui-desktop.png
            ui-mobile.png
            admin-editor.png
            admin-analytics.png
            likes-mobile.png
            admin-help.png
            admin-users.png
            admin-sync.png
            signin-desktop.png
            signin-mobile.png
            legal-accept-mobile.png
            promotions-admin-mobile.png
            promotions-owner-mobile.png
            sponsored-admin-mobile.png
            submissions-mobile.png
            profile-member-mobile.png
            profile-admin-mobile.png
            recently-viewed-mobile.png
            sync-recovery-mobile.png
          retention-days: 3
