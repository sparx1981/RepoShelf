name: Check application
on:
  push:
    branches: [main]
    paths:
      - 'dist/*.js'
      - 'dist/*.html'
      - 'dist/*.css'
      - 'scripts/**'
      - 'lib/**'
      - 'api/**'
      - 'vercel.json'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/checks.yml'
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install agent server dependencies
        run: npm install --package-lock=false
      - name: Validate application and source logic
        run: npm test && npm run test:mcp && npm run build
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify catalog search, sources, tracking, and responsive layout
        run: node scripts/verify-ui.mjs
      - name: Verify deployed agent routes
        if: github.event_name == 'push'
        run: node scripts/verify-deployed-api.mjs
      - name: Save storefront screenshots
        uses: actions/upload-artifact@v4
        with:
          name: storefront-preview
          path: |
            ui-desktop.png
            ui-mobile.png
          retention-days: 3
