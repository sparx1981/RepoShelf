name: Check application
on:
  push:
    branches: [main]
    paths:
      - 'dist/*.js'
      - 'dist/*.html'
      - 'dist/*.css'
      - 'scripts/**'
      - 'lib/**'
      - 'api/**'
      - 'vercel.json'
      - 'tests/**'
      - 'supabase/**'
      - 'package.json'
      - '.github/workflows/checks.yml'
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-ci-password
          POSTGRES_DB: reposhelf_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d reposhelf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install agent server dependencies
        run: npm install --package-lock=false
      - name: Validate application and source logic
        run: npm test && npm run test:mcp && npm run build
      - name: Verify database migration and permissions
        env:
          PGPASSWORD: local-ci-password
        run: |
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f tests/database-bootstrap.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610030001_accounts_editorial_analytics.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610030002_admin_user_management.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610030003_unique_visitors.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610030004_account_forks.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610030005_bookmarks_and_legal.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610030006_promotions.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610030007_repository_submissions.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f tests/database-legal.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f tests/database-forks.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f tests/database-permissions.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f tests/database-visitors.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f tests/database-roles.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f tests/database-promotions.sql
          psql -h localhost -U postgres -d reposhelf_test -v ON_ERROR_STOP=1 -f tests/database-submissions.sql
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify catalog search, sources, tracking, and responsive layout
        run: node scripts/verify-ui.mjs && node scripts/verify-accounts-ui.mjs && node scripts/verify-legal-ui.mjs && node scripts/verify-promotions-ui.mjs && node scripts/verify-submissions-ui.mjs
      - name: Verify deployed agent routes
        if: github.event_name == 'push'
        run: node scripts/verify-deployed-api.mjs
      - name: Save storefront screenshots
        uses: actions/upload-artifact@v4
        with:
          name: storefront-preview
          path: |
            ui-desktop.png
            ui-mobile.png
            admin-editor.png
            admin-analytics.png
            likes-mobile.png
            admin-help.png
            admin-users.png
            admin-sync.png
            signin-desktop.png
            signin-mobile.png
            legal-accept-mobile.png
            promotions-admin-mobile.png
            promotions-owner-mobile.png
            sponsored-admin-mobile.png
            submissions-mobile.png
            profile-member-mobile.png
            profile-admin-mobile.png
          retention-days: 3
