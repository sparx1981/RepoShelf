name: Import validated repositories from X
on:
  workflow_dispatch:
    inputs:
      not_before:
        description: Collector request time; blank imports existing validated candidates
        type: string
        default: ''
      limit:
        description: Maximum validated repositories to import (normal daily limit is 50)
        type: choice
        options: ['50', '100']
        default: '50'
  schedule:
    - cron: '20 6 * * *'
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true' # GitHub is retiring Node 20 for JavaScript actions: run them on Node 24 already

permissions:
  contents: write
jobs:
  # Waiting for the external collector can take twenty minutes. It happens here, outside the reposhelf-catalog concurrency group, so
  # an idle wait does not hold the group (and does not leave this run sitting as the group's single waiting slot).
  collector:
    if: github.event_name == 'schedule' || inputs.not_before != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts/wait-x-collector.mjs
            scripts/data-packing.mjs
            lib/data-packing.mjs
            lib/readme-terms.mjs
          sparse-checkout-cone-mode: false
      - name: Unpack saved catalogue data
        run: node scripts/data-packing.mjs unpack
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for successful X collection and validation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          X_NOT_BEFORE: ${{ inputs.not_before }}
        run: |
          mkdir -p data
          node scripts/wait-x-collector.mjs
  intake:
    needs: collector
    # The collector job is skipped for a manual run that asks for the existing candidates; that must still import.
    if: always() && (needs.collector.result == 'success' || needs.collector.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: reposhelf-catalog
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Unpack saved catalogue data
        run: node scripts/data-packing.mjs unpack
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record the successful X collection run
        # The collector has already finished, so this returns at once; it records the run id the import needs.
        if: github.event_name == 'schedule' || inputs.not_before != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          X_NOT_BEFORE: ${{ inputs.not_before }}
        run: node scripts/wait-x-collector.mjs
      - name: Restore accumulated catalogue changes
        run: node scripts/publish-catalog.mjs restore
      - name: Refresh current moderation decisions
        run: node scripts/sync-listing-controls.mjs
      - name: Import fresh collector evidence and screenshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
          X_IMPORT_LIMIT: ${{ inputs.limit || '50' }}
        run: node scripts/import-x.mjs
      - name: Publish imported X repositories
        run: node scripts/publish-catalog.mjs
