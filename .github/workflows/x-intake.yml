name: Import validated repositories from X
on:
  workflow_dispatch:
  schedule:
    - cron: '45 7 * * *'
permissions:
  contents: write
concurrency:
  group: reposhelf-catalog
  cancel-in-progress: false
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Unpack saved catalogue data
        run: node scripts/data-packing.mjs unpack
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore accumulated catalogue changes
        run: node scripts/publish-catalog.mjs restore
      - name: Refresh current moderation decisions
        run: node scripts/sync-listing-controls.mjs
      - name: Import fresh collector evidence and screenshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/import-x.mjs
      - name: Save accepted candidates for normal publication
        env:
          SYNC_PUBLICATION_PHASE: deferred
        run: node scripts/publish-catalog.mjs
