name: Publish saved catalogue
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publication.yml', 'lib/publication-policy.mjs']
  schedule:
    # Checked daily, but the scheduled publication is weekly (Monday 06:35 UTC, see lib/publication-policy.mjs): on the other days this
    # run stops after a few seconds unless that week's Monday publication was missed. Each publication is one Vercel build.
    - cron: '35 6 * * *'
  workflow_dispatch:
    inputs:
      scheduled:
        description: Weekly publication (skip if already handled this week)
        type: boolean
        default: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true' # GitHub is retiring Node 20 for JavaScript actions: run them on Node 24 already

permissions:
  contents: write
concurrency:
  group: reposhelf-catalog
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    # Restoring the saved checkpoint takes about 12 minutes before anything is published, so 15 minutes cancelled every
    # publication (including Publish now). The limit is a safety net, not a budget.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Unpack saved catalogue data
        run: node scripts/data-packing.mjs unpack
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check whether the weekly publication is due
        id: due
        env:
          DAILY_PUBLICATION: ${{ github.event_name == 'schedule' || inputs.scheduled }}
        run: |
          if [ "$DAILY_PUBLICATION" != "true" ]; then echo "due=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          node --input-type=module -e "import {readFileSync,appendFileSync} from 'node:fs';import {scheduledPublicationDue} from './lib/publication-policy.mjs';let state=null;try{state=JSON.parse(readFileSync('data/publication.json','utf8'))}catch{}const due=scheduledPublicationDue(state);console.log(due?'The weekly publication is due.':'The weekly publication was already handled this week; nothing to do.');appendFileSync(process.env.GITHUB_OUTPUT,'due='+due+'\n')"
      - name: Restore accumulated generated changes
        if: steps.due.outputs.due == 'true'
        run: node scripts/publish-catalog.mjs restore
      - name: Publish the latest saved catalogue
        if: steps.due.outputs.due == 'true'
        env:
          DAILY_PUBLICATION: ${{ github.event_name == 'schedule' || inputs.scheduled }}
        run: |
          if [ "$DAILY_PUBLICATION" = "true" ]; then
            node scripts/publish-catalog.mjs --scheduled
          else
            node scripts/publish-catalog.mjs
          fi
      - name: Retain publication recovery data
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: publication-recovery-${{ github.run_id }}
          path: |
            dist/catalog.json
            dist/spaces.json
            dist/community.json
            dist/trendshift.json
            dist/growth.json
            dist/previews/
            data/
          retention-days: 7
