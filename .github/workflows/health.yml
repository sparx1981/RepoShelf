name: Monitor operational health
on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Refresh demo catalog']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ['scripts/monitor-health.mjs', '.github/workflows/health.yml']
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: reposhelf-operational-health
  cancel-in-progress: false
jobs:
  monitor:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check production and catalogue maintenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/monitor-health.mjs
