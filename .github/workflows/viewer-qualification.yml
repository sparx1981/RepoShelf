name: Demo viewer qualification

# Qualifies the administrator-approved demos for the in-page viewer: loads each one in the exact viewer sandbox on the
# canonical origin, runs its scenario, and records dated evidence through the worker API. Evidence is good for 48 hours,
# so this runs daily. It never pushes to the repository and never deploys. Without the worker key it does nothing.
on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
    inputs:
      browser:
        description: Browser engine
        type: choice
        options: [chromium, webkit, firefox]
        default: chromium
      mobile:
        description: Use mobile emulation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: viewer-qualification
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Unpack saved catalogue data
        run: node scripts/data-packing.mjs unpack
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps ${{ inputs.browser || 'chromium' }}
      - name: Qualify approved demos
        env:
          REPOSHELF_SUBMISSION_SYNC_KEY: ${{ secrets.REPOSHELF_SUBMISSION_SYNC_KEY }}
        run: node scripts/viewer-qualify.mjs --queue --browser=${{ inputs.browser || 'chromium' }} ${{ inputs.mobile && '--mobile' || '' }}
