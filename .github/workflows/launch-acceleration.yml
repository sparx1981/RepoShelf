name: Bounded launch acceleration
# The launch milestone (5,000 published listings) was reached long ago, so this check has nothing left to request: it only
# answered "milestone_reached" 24 times a day. It stays available to run by hand.
on:
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true' # GitHub is retiring Node 20 for JavaScript actions: run them on Node 24 already

permissions:
  contents: read
  actions: write
concurrency:
  group: reposhelf-launch-dispatch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
      - name: Unpack saved catalogue data
        run: node scripts/data-packing.mjs unpack
      - name: Request one extra sync only while quality-ready growth needs acceleration
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/launch-cadence.mjs dispatch
