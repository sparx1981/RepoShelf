name: Bounded launch acceleration
on:
  schedule:
    - cron: '47 * * * *'
    - cron: '17 1-23/2 * * *'
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true' # GitHub is retiring Node 20 for JavaScript actions: run them on Node 24 already

permissions:
  contents: read
  actions: write
concurrency:
  group: reposhelf-launch-dispatch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
      - name: Unpack saved catalogue data
        run: node scripts/data-packing.mjs unpack
      - name: Request one extra sync only while quality-ready growth needs acceleration
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/launch-cadence.mjs dispatch
