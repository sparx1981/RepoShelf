name: Refresh demo catalog
run-name: ${{ inputs.watchdog_recovery && 'Automatic catch-up sync' || 'Refresh demo catalog' }}
on:
  workflow_dispatch:
    inputs:
      refresh_previews:
        description: Refresh demo health and screenshots now
        type: boolean
        default: false
      recovery_passes:
        description: Bounded browser passes (two for a catch-up burst)
        type: choice
        options: ['1', '2']
        default: '1'
      watchdog_recovery:
        description: Automatic catch-up requested by the sync watchdog
        type: boolean
        default: false
  schedule:
    - cron: '17 */2 * * *'
  push:
    branches: [main]
    paths:
      - 'lib/listing-policy.mjs'
      - 'scripts/sync-listing-controls.mjs'
      - 'scripts/catalog-priority.mjs'
      - 'scripts/sync-metrics.mjs'
      - 'scripts/demo-only-policy.mjs'
      - 'scripts/prune-no-demo.mjs'
      - 'scripts/compress-previews.mjs'
      - 'scripts/build-browse-index.mjs'
      - 'lib/browse-index.mjs'
      - 'dist/picks.js'
      - 'scripts/index-catalog.mjs'
      - 'scripts/catalog-health.mjs'
      - 'scripts/enrich-catalog.mjs'
      - 'scripts/readme-overviews.mjs'
      - 'scripts/enrich-overviews.mjs'
      - 'scripts/agent-snapshots.mjs'
      - 'scripts/enrich-agent-context.mjs'
      - 'scripts/record-growth.mjs'
      - 'scripts/sync-history.mjs'
      - 'scripts/browser-cycle.mjs'
      - 'scripts/capture-previews.mjs'
      - 'scripts/preview-workers.mjs'
      - 'scripts/browser-checkpoint.mjs'
      - 'lib/browser-backlog.mjs'
      - 'scripts/preview-schedule.mjs'
      - 'scripts/demo-health.mjs'
      - 'scripts/check-demo-health.mjs'
      - 'scripts/demo-probe.mjs'
      - 'scripts/demo-probe-runner.mjs'
      - 'scripts/demo-session.mjs'
      - 'scripts/demo-preflight.mjs'
      - 'scripts/preview-quality.mjs'
      - 'scripts/browser-shards.mjs'
      - 'scripts/capture-provider-fallback.mjs'
      - 'scripts/finish-sharded-sync.mjs'
      - 'scripts/verify-browser-pool.mjs'
      - 'scripts/demo-worker.mjs'
      - 'scripts/demo-pool.mjs'
      - 'scripts/adaptive-browser.mjs'
      - 'scripts/browser-queues.mjs'
      - 'scripts/run-browser-queues.mjs'
      - 'scripts/live-sync-progress.mjs'
      - 'lib/sync-progress.mjs'
      - 'scripts/publish-catalog.mjs'
      - 'scripts/catalog-publication.mjs'
      - 'scripts/deployment-policy.mjs'
      - 'scripts/project-insights.mjs'
      - 'scripts/ai-overviews.mjs'
      - 'scripts/generate-ai-overviews.mjs'
      - 'dist/quality.js'
      - 'dist/storefront.js'
      - 'dist/discovery.js'
      - 'dist/providers.js'
      - 'scripts/import-sources.mjs'
      - 'scripts/source-imports.mjs'
      - 'sources.config.json'
      - 'scripts/community-sources.mjs'
      - 'scripts/bluesky-stream.mjs'
      - 'scripts/import-community.mjs'
      - 'dist/community.js'
      - '.github/workflows/catalog.yml'
permissions:
  contents: write
  issues: read
concurrency:
  group: reposhelf-catalog
  cancel-in-progress: false
jobs:
  prepare:
    outputs:
      due: ${{ steps.browser_cycle.outputs.due }}
      sha: ${{ steps.handoff.outputs.sha }}
    env:
      WATCHDOG_RECOVERY: ${{ inputs.watchdog_recovery }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore unpublished generated checkpoint data
        run: node scripts/publish-catalog.mjs restore
      - name: Record starting catalog
        id: baseline
        run: node scripts/sync-history.mjs start
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: |
            .catalog-cache.json
            .sources-cache.json
            .community-cache.json
          key: demo-catalog-${{ github.run_id }}
          restore-keys: demo-catalog-
      - name: Install agent server dependencies
        id: dependencies
        run: npm install --package-lock=false
      - name: Validate catalog logic
        id: validate
        run: npm test && npm run test:mcp && npm run build
      - name: Refresh public moderation controls and quality requests
        id: listing_controls
        continue-on-error: true
        run: node scripts/sync-listing-controls.mjs
      - name: Remove saved projects without demo links
        id: cleanup
        run: |
          mkdir -p .sync-logs
          set -o pipefail
          node scripts/prune-no-demo.mjs 2>&1 | tee .sync-logs/cleanup.log
      - name: Compress existing preview images
        id: compression
        run: |
          mkdir -p .sync-logs
          set -o pipefail
          node scripts/compress-previews.mjs 2>&1 | tee .sync-logs/compression.log
      - name: Record demo-only cleanup
        id: cleanup_report
        env:
          SYNC_STEP_RESULTS: ${{ toJSON(steps) }}
          SYNC_REPORT_PHASE: cleanup
        run: node scripts/sync-history.mjs finish
      - name: Save cleanup recovery checkpoint
        id: cleanup_publish
        env:
          SYNC_PUBLICATION_PHASE: checkpoint
        run: node scripts/publish-catalog.mjs
      - name: Prioritise existing catalogue quality
        id: priority
        run: node scripts/catalog-priority.mjs
      - name: Import Hugging Face Spaces and curated lists
        id: sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPACE_IMPORT_BATCH: ${{ steps.priority.outputs.spacesBatch }}
          SPACE_REVALIDATE_BATCH: '150'
          CURATED_IMPORT_BATCH: ${{ steps.priority.outputs.curatedBatch }}
        run: |
          mkdir -p .sync-logs
          set -o pipefail
          node scripts/import-sources.mjs 2>&1 | tee .sync-logs/sources.log
      - name: Discover repositories discussed on Hacker News and Bluesky
        id: community
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMUNITY_IMPORT_BATCH: ${{ steps.priority.outputs.communityBatch }}
        run: |
          mkdir -p .sync-logs
          set -o pipefail
          node scripts/import-community.mjs 2>&1 | tee .sync-logs/community.log
      - name: Find public repository demos
        id: catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CATALOG_BATCH_SIZE: ${{ steps.priority.outputs.githubBatch }}
          CATALOG_REVALIDATE_BATCH: 'auto'
        run: |
          mkdir -p .sync-logs
          set -o pipefail
          node scripts/index-catalog.mjs 2>&1 | tee .sync-logs/catalog.log
      - name: Enrich releases, technologies, and historical counts
        id: enrich
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CATALOG_ENRICH_BATCH: '80'
        run: |
          mkdir -p .sync-logs
          set -o pipefail
          node scripts/enrich-catalog.mjs 2>&1 | tee .sync-logs/enrich.log
      - name: Extract author-written project overviews
        id: overviews
        env:
          OVERVIEW_GITHUB_BATCH: '100'
          OVERVIEW_SPACE_BATCH: '40'
        run: |
          mkdir -p .sync-logs
          set -o pipefail
          node scripts/enrich-overviews.mjs 2>&1 | tee .sync-logs/overviews.log
      - name: Save supporting agent documents
        id: context
        env:
          AGENT_CONTEXT_BATCH: '40'
        run: |
          mkdir -p .sync-logs
          set -o pipefail
          node scripts/enrich-agent-context.mjs 2>&1 | tee .sync-logs/context.log
      - name: Generate optional AI overviews
        id: ai
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          AI_OVERVIEW_BATCH: '10'
          AI_OVERVIEW_DAILY_LIMIT: '20'
        run: |
          mkdir -p .sync-logs
          set -o pipefail
          node scripts/generate-ai-overviews.mjs 2>&1 | tee .sync-logs/ai.log
      - name: Record growth before browser checks
        if: always() && steps.baseline.outcome == 'success'
        id: growth_checkpoint
        run: node scripts/record-growth.mjs
      - name: Save discovery checkpoint report
        if: always() && steps.baseline.outcome == 'success'
        id: checkpoint_report
        env:
          SYNC_STEP_RESULTS: ${{ toJSON(steps) }}
          SYNC_REPORT_PHASE: discovery
        run: node scripts/sync-history.mjs finish
      - name: Save discovery recovery checkpoint
        if: always() && steps.checkpoint_report.outcome == 'success'
        id: checkpoint_publish
        env:
          SYNC_PUBLICATION_PHASE: checkpoint
        run: node scripts/publish-catalog.mjs
      - name: Check eligible demo and screenshot queues
        id: browser_cycle
        if: always() && steps.baseline.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORCE_BROWSER_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_previews }}
        run: node scripts/browser-cycle.mjs decide
      - name: Prepare parallel browser handoff
        id: handoff
        if: always() && steps.baseline.outcome == 'success'
        env:
          SYNC_STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          node --input-type=module -e "import {writeFileSync} from 'node:fs';writeFileSync('.sync-prepare-steps.json',process.env.SYNC_STEP_RESULTS)"
      - name: Save prepared catalogue for browser runners
        if: always() && steps.handoff.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: browser-input-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .sync-logs/
            .sync-metrics/
            .sync-before.json
            .sync-prepare-steps.json
            dist/catalog.json
            dist/spaces.json
            dist/community.json
            dist/growth.json
            data/
          retention-days: 3
  browser:
    needs: prepare
    if: always() && needs.prepare.outputs.due == 'true' && needs.prepare.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: browser-input-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Install dependencies
        run: npm install --package-lock=false
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-1.56.1
      - name: Install screenshot browser
        id: browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify isolated browser workers
        id: verify
        run: node scripts/verify-browser-pool.mjs
      - name: Validate demos and capture previews with shared browser workers
        id: previews
        continue-on-error: true
        timeout-minutes: 55
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BROWSER_SHARD_INDEX: ${{ matrix.shard }}
          BROWSER_SHARD_COUNT: '2'
          BROWSER_RECOVERY_PASSES: ${{ inputs.recovery_passes || '1' }}
          PREVIEW_BUDGET_MS: '900000'
          DEMO_CHECK_BUDGET_MS: '600000'
          CATALOG_PREVIEW_CONCURRENCY: '4'
          CATALOG_PREVIEW_BATCH: 'auto'
          DEMO_CHECK_BATCH: 'auto'
        run: |
          mkdir -p .sync-logs
          set -o pipefail
          node scripts/browser-shards.mjs worker 2>&1 | tee .sync-logs/previews.log
      - name: Retain complete and partial browser patches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-result-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: browser-results/
          retention-days: 3
      - name: Fail visibly if a worker was interrupted
        if: steps.previews.outcome == 'failure'
        run: exit 1
  refresh:
    needs: [prepare, browser]
    if: always() && needs.prepare.outputs.sha != ''
    env:
      WATCHDOG_RECOVERY: ${{ inputs.watchdog_recovery }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install merge dependencies
        run: npm install --package-lock=false
      - name: Restore existing preview files from the saved checkpoint
        run: node scripts/publish-catalog.mjs restore
      - uses: actions/download-artifact@v4
        with:
          name: browser-input-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Download all completed browser results
        if: needs.prepare.outputs.due == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: browser-result-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: browser-results/
          merge-multiple: true
      - name: Merge parallel browser patches without replacing other fields
        id: browser_merge
        if: needs.prepare.outputs.due == 'true'
        continue-on-error: true
        env:
          BROWSER_SHARD_COUNT: '2'
        run: node scripts/browser-shards.mjs merge
      - name: Optional free screenshot provider fallback
        id: capture_providers
        continue-on-error: true
        env:
          REPOSHELF_SUBMISSION_SYNC_KEY: ${{ secrets.REPOSHELF_SUBMISSION_SYNC_KEY }}
          SCREENSHOTONE_ACCESS_KEY: ${{ secrets.SCREENSHOTONE_ACCESS_KEY }}
          CLOUDFLARE_BROWSER_TOKEN: ${{ secrets.CLOUDFLARE_BROWSER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/capture-provider-fallback.mjs
      - name: Record remaining public demo checks from shared workers
        id: health
        if: needs.prepare.outputs.due == 'true'
        continue-on-error: true
        run: node scripts/run-browser-queues.mjs summary
      - name: Compress new and remaining previews
        id: compression_final
        run: node scripts/compress-previews.mjs
      - name: Record completed browser refresh cycle
        id: browser_complete
        if: steps.health.outcome == 'success' && steps.browser_merge.outcome == 'success'
        run: node scripts/browser-cycle.mjs complete
      - name: Record catalog growth
        id: growth
        run: node scripts/record-growth.mjs
      - name: Save sync report
        id: report
        env:
          SYNC_STEP_RESULTS: ${{ toJSON(steps) }}
          BROWSER_JOB_RESULT: ${{ needs.browser.result }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/finish-sharded-sync.mjs
      - name: Save completed sync for daily publication
        if: always() && steps.report.outcome == 'success'
        id: publish
        env:
          SYNC_PUBLICATION_PHASE: deferred
        run: node scripts/publish-catalog.mjs
      - name: Retain sync diagnostics and generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .sync-logs/
            .sync-metrics/
            .sync-before.json
            dist/catalog.json
            dist/spaces.json
            dist/community.json
            dist/growth.json
            dist/previews/
            data/
          retention-days: 7
      - name: Report incomplete browser or preparation stages
        if: always() && (needs.prepare.result == 'failure' || needs.browser.result == 'failure' || steps.browser_merge.outcome == 'failure')
        run: exit 1
