name: Refresh demo catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/index-catalog.mjs'
      - 'scripts/catalog-health.mjs'
      - 'dist/discovery.js'
      - '.github/workflows/catalog.yml'
permissions:
  contents: write
concurrency:
  group: reposhelf-catalog
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: .catalog-cache.json
          key: demo-catalog-${{ github.run_id }}
          restore-keys: demo-catalog-
      - name: Validate catalog logic
        run: npm test && npm run build
      - name: Find public repository demos
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CATALOG_BATCH_SIZE: '1500'
          CATALOG_REVALIDATE_BATCH: '250'
        run: node scripts/index-catalog.mjs
      - name: Publish refreshed catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/catalog.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh public demo catalog"
          git pull --rebase origin main
          git push origin HEAD:main
